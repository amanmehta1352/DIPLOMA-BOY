<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<title>Diploma Boy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap">
<style>
/* Diploma Boy — identity: an engineering drawing sheet. Paper, drafting blue, signal saffron.
   One memorable element: the "title block" on Today (like the corner block of a drawing sheet). */
:root{
  --paper:#F5F6F2; --sheet:#FFFFFF; --ink:#16233A; --ink2:#4A5568; --rule:#DCE0D8; --grid:rgba(36,87,197,.07);
  --blue:#2457C5; --blue-soft:#E7EEFB; --saffron:#F2A007; --saffron-soft:#FFF4DC;
  --ok:#1F8A5B; --ok-soft:#E3F4EC; --bad:#C8372D; --bad-soft:#FBE9E7; --mark:#7A4CC2;
  --s-maths:#0E86B8; --s-reasoning:#7A4CC2; --s-general-science:#1F8A5B; --s-general-awareness:#C77700; --s-eng:#C8372D;
  --r1:10px; --r2:16px; --shadow:0 1px 0 rgba(22,35,58,.06), 0 6px 18px -12px rgba(22,35,58,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1522; --sheet:#152034; --ink:#E8EDF6; --ink2:#A3AEC2; --rule:#26334A; --grid:rgba(120,160,240,.06);
  --blue:#7EA6F5; --blue-soft:#1C2D4D; --saffron:#F5B83D; --saffron-soft:#3A2E12; --ok:#4CC78E; --ok-soft:#14352A; --bad:#F07A6E; --bad-soft:#3E1D1A; --mark:#B595F0;
  --shadow:0 1px 0 rgba(0,0,0,.3);}}
:root[data-theme="dark"]{
  --paper:#0E1522; --sheet:#152034; --ink:#E8EDF6; --ink2:#A3AEC2; --rule:#26334A; --grid:rgba(120,160,240,.06);
  --blue:#7EA6F5; --blue-soft:#1C2D4D; --saffron:#F5B83D; --saffron-soft:#3A2E12; --ok:#4CC78E; --ok-soft:#14352A; --bad:#F07A6E; --bad-soft:#3E1D1A; --mark:#B595F0;
  --shadow:0 1px 0 rgba(0,0,0,.3);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:Mukta,"Noto Sans Devanagari",system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.hide{display:none!important}
.muted{color:var(--ink2)}
.small{font-size:14px}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:18px;margin:24px 0 10px;font-weight:700}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.spacer{flex:1}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 14px;font-size:15px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:40px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--sheet)}
.lang button{border:0;background:none;padding:6px 11px;font-size:14px;cursor:pointer;min-height:36px;color:var(--ink2)}
.lang button.on{background:var(--blue);color:#fff}
.tblock{margin:12px 0 0;background:var(--sheet);border:2px solid var(--ink);border-radius:4px;display:grid;grid-template-columns:1.4fr 1fr .8fr;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px}
.tblock>div{padding:10px 12px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);min-width:0}
.tblock>div:nth-child(3){border-right:0}
.tblock .k{font-size:13px;color:var(--ink2)}
.tblock .v{font-weight:800;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.tblock .v.big{font-size:24px}
.tblock .wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;border-right:0;border-bottom:0}
.ring{--p:0;width:60px;height:60px;border-radius:50%;flex:none;background:conic-gradient(var(--saffron) calc(var(--p)*1%),var(--rule) 0);display:grid;place-items:center}
.ring::after{content:attr(data-t);width:46px;height:46px;border-radius:50%;background:var(--sheet);display:grid;place-items:center;font-weight:800;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:var(--r1);background:var(--blue);color:#fff;font-weight:700;font-size:17px;cursor:pointer;padding:10px 16px;text-align:center;line-height:1.25}
:root[data-theme="dark"] .btn:not(.line):not(.quiet):not(.saffron){color:#0E1522}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.line):not(.quiet):not(.saffron){color:#0E1522}}
.btn.saffron{background:var(--saffron);color:#1B1300}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.quiet{background:var(--blue-soft);color:var(--blue)}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--rule);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;min-height:64px}
.item:first-child{border-top:0}
.item .bar4{width:4px;align-self:stretch;border-radius:4px;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:16px;line-height:1.3}
.item .tx span{font-size:14px;color:var(--ink2)}
.meter{height:6px;background:var(--rule);border-radius:9px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:9px}
.chev{color:var(--ink2);flex:none;display:flex}
.empty{padding:22px 16px;text-align:center;color:var(--ink2)}
.note{background:var(--saffron-soft);border-left:4px solid var(--saffron);padding:10px 12px;border-radius:8px;font-size:15px;margin:12px 0}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.tag.pyq{background:var(--ink);color:var(--paper)}
.hero{padding:28px 0 8px}
.hero p{margin:8px 0 0;color:var(--ink2)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 24px}
.bcard{background:var(--sheet);border:1.5px solid var(--rule);border-radius:var(--r2);padding:16px 14px;text-align:left;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.bcard b{font-size:19px;line-height:1.2}
.bcard span{font-size:13px;color:var(--ink2)}
.bcard.on{border-color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.dock .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
.dock button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:12px;color:var(--ink2);cursor:pointer;min-height:58px;position:relative}
.dock button svg{width:24px;height:24px}
.dock button.on{color:var(--blue);font-weight:700}
.dock button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.dock .badge{position:absolute;top:5px;left:56%;background:var(--saffron);color:#1B1300;font-size:11px;font-weight:800;border-radius:9px;padding:0 5px;min-width:18px;line-height:17px}
.sheet{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column}
.sheet-top{background:var(--sheet);border-bottom:1px solid var(--rule)}
.sheet-top .wrap{display:flex;align-items:center;gap:8px;height:56px}
.icon-btn{border:0;background:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon-btn svg{width:24px;height:24px}
.prog{height:4px;background:var(--rule)}
.prog i{display:block;height:100%;background:var(--blue);transition:width .25s}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body .wrap{padding-top:14px;padding-bottom:110px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.qtext{font-size:18px;line-height:1.55;margin:12px 0 4px;font-weight:500}
.qtext .en{display:block;font-size:15px;color:var(--ink2);font-weight:400;margin-top:6px}
.qimg{max-width:100%;display:block;margin:10px 0;background:#fff;border-radius:8px;border:1px solid var(--rule)}
.mt{font-size:12px;color:var(--ink2);margin-top:2px}
.opts{margin-top:14px;display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;min-height:54px;border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);cursor:pointer;font-size:16px;line-height:1.45}
.opt:disabled{cursor:default}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt .ot{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .ot .en{display:block;font-size:14px;color:var(--ink2)}
.opt img{max-width:100%;display:block;background:#fff;margin-top:6px;border-radius:6px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)} .opt.sel .l{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .l{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .l{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.verdict{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)} .verdict.skip{background:var(--saffron-soft);color:var(--ink)}
.sol{margin-top:10px;background:var(--sheet);border:1px dashed var(--ink2);border-radius:12px;padding:12px 14px;font-size:15px}
.sheet-foot{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:55}
.sheet-foot .wrap{display:flex;gap:8px}
.sheet-foot .btn{min-height:48px;font-size:16px;padding:8px 10px}
.timer{font-weight:800;font-variant-numeric:tabular-nums;font-size:17px;padding:4px 10px;border-radius:8px;background:var(--blue-soft);color:var(--blue)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.pal button{height:44px;border-radius:8px;border:1.5px solid var(--rule);background:var(--sheet);cursor:pointer;font-weight:700;font-size:14px}
.pal button.a{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.pal button.m{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.pal button.v{border-color:var(--bad);color:var(--bad)}
.pal button.cur{outline:3px solid var(--saffron);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink2);margin:10px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,16,28,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--sheet);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.stat span{font-size:13px;color:var(--ink2)}
.score{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.score b{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.03em}
table.sub{width:100%;border-collapse:collapse;font-size:15px}
table.sub td,table.sub th{padding:9px 8px;border-top:1px solid var(--rule);text-align:right}
table.sub td:first-child,table.sub th:first-child{text-align:left}
table.sub th{font-size:13px;color:var(--ink2);font-weight:600;border-top:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:90;font-size:15px;max-width:90vw}
@media (min-width:760px){.bgrid{grid-template-columns:repeat(3,1fr)} .qtext{font-size:19px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M2 21h28M18 21v9" stroke="currentColor" stroke-width="2"/><path d="M7 15l4.5-7 4.5 7 4.5-7 4.5 7" fill="none" stroke="#F2A007" stroke-width="2.5" stroke-linejoin="round"/></svg>Diploma Boy</div>
  <div class="spacer"></div>
  <div class="lang" role="group" aria-label="भाषा / Language"><button data-lang="hi">हिं</button><button data-lang="both">दोनों</button><button data-lang="en">EN</button></div>
</div></header>
<main class="wrap" id="app"></main>
<nav class="dock hide" id="dock"><div class="wrap" id="dockin"></div></nav>
<div id="layer"></div>

<script>
/* ============ CONFIG ============ */
const SB={url:'https://wobmtlcpszcntczkebtt.supabase.co', key:'sb_publishable_7ZZEUDULfYaMHSeLIxfluQ_fZWSCi8R'}; // publishable key: safe in the app
const REV=[1,3,7,15,30];   // spaced revision, days
/* Offline fallback: names only. Questions always come from the database. */
const DATA={
  branches:[{id:'mechanical',hi:'मैकेनिकल',en:'Mechanical'},{id:'civil',hi:'सिविल',en:'Civil'},{id:'electrical',hi:'इलेक्ट्रिकल',en:'Electrical'},{id:'electronics',hi:'इलेक्ट्रॉनिक्स',en:'Electronics'},{id:'computer',hi:'कंप्यूटर / आईटी',en:'Computer / IT'}],
  subjects:[{id:'maths',hi:'गणित',en:'Mathematics',branch:null},{id:'reasoning',hi:'रीज़निंग',en:'Reasoning',branch:null},{id:'general-science',hi:'सामान्य विज्ञान',en:'General Science',branch:null},{id:'general-awareness',hi:'सामान्य जागरूकता',en:'General Awareness',branch:null}],
  exams:[
    {id:'rrb-je-cbt1',hi:'आरआरबी जेई सीबीटी 1',en:'RRB JE CBT 1',branches:['mechanical','civil','electrical','electronics','computer'],ready:false},
    {id:'ssc-je-paper1',hi:'एसएससी जेई पेपर I',en:'SSC JE Paper I',branches:['mechanical','civil','electrical'],ready:false},
    {id:'isro',hi:'इसरो',en:'ISRO',branches:['electronics','computer','electrical','mechanical'],ready:false,soon:true},
    {id:'drdo',hi:'डीआरडीओ',en:'DRDO',branches:['electronics','computer','mechanical'],ready:false,soon:true}]
};
const R={ok:false,topics:{},sources:{}};

/* ============ STATE (saved on this phone) ============ */
const KEY='diploma-boy-v2';
let S={lang:'both',theme:'auto',branch:null,exam:null,tab:'today',goal:30,st:{},tp:{},days:{},mis:{},mocks:[],seen:{}};
try{const o=JSON.parse(localStorage.getItem(KEY)||'null'); if(o) Object.assign(S,o);
  else{const v1=JSON.parse(localStorage.getItem('diploma-boy-v1')||'null'); if(v1){S.lang=v1.lang||S.lang;S.branch=v1.branch||null;}}}catch(e){}
function save(){try{const {lang,theme,branch,exam,tab,goal,st,tp,days,mis,mocks,seen}=S;localStorage.setItem(KEY,JSON.stringify({lang,theme,branch,exam,tab,goal,st,tp,days,mis,mocks,seen}))}catch(e){}}
let V={sheet:null,view:null,modal:null};   // screen state, not saved

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const L=(hi,en)=>S.lang==='en'?en:hi;
const N=o=>o?(S.lang==='en'?(o.en||o.hi):(o.hi||o.en)):'';
const byId=(a,id)=>a.find(x=>x.id===id);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const pct=(c,t)=>t?Math.round(c/t*100):0;
const fmtDate=s=>s?s.split('-').reverse().join('/'):'';
function TX(o){ if(!o) return ''; const hi=o.hi||'', en=o.en||'';
  if(S.lang==='en'||!hi) return en||hi; if(S.lang==='hi'||hi===en) return hi; return hi+'<span class="en">'+en+'</span>'; }
const ICON={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  practice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM4 17a2 2 0 0 1 2-2h12"/></svg>',
  mock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>',
  mistakes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
  chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>'
};
const subjColor=id=>/engineering/.test(id)?'var(--s-eng)':`var(--s-${id},var(--blue))`;
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ============ DATABASE ============ */
async function sb(path){ const r=await fetch(SB.url+'/rest/v1/'+path,{headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Accept-Profile':'mtb'}}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function loadRemote(){
  try{
    const [br,ex,eb,su,tp,src]=await Promise.all([
      sb('branches?select=id,slug,name_en,name_hi,sort&order=sort'),
      sb('exams?select=id,slug,name_en,name_hi,active,pattern&active=eq.true&order=id'),
      sb('exam_branches?select=exam_id,branch_id'),
      sb('subjects?select=id,slug,name_en,name_hi,branch_id&order=id'),
      sb('topics?select=id,slug,name_en,name_hi,subject_id,sort&order=sort,id'),
      sb('sources?select=id,exam_id,branch_id,paper_date,shift,note&order=paper_date.desc,shift')]);
    const bS={}; br.forEach(b=>bS[b.id]=b.slug);
    const sS={}; su.forEach(s=>sS[s.id]=s.slug);
    DATA.branches=br.map(b=>({id:b.slug,hi:b.name_hi,en:b.name_en}));
    DATA.subjects=su.map(s=>({id:s.slug,hi:s.name_hi,en:s.name_en,branch:s.branch_id==null?null:bS[s.branch_id]}));
    const exs=ex.map(e=>({id:e.slug,dbid:e.id,hi:e.name_hi,en:e.name_en,pattern:e.pattern||{},branches:eb.filter(x=>x.exam_id===e.id).map(x=>bS[x.branch_id]),ready:true}));
    DATA.exams=[...exs,...DATA.exams.filter(e=>e.soon&&!exs.some(x=>x.id===e.id))];
    R.topics={}; tp.forEach(t=>R.topics[t.id]={id:t.id,hi:t.name_hi,en:t.name_en,subject:sS[t.subject_id]});
    R.sources={}; src.forEach(x=>R.sources[x.id]={...x,exam:(exs.find(e=>e.dbid===x.exam_id)||{}).id,branch:bS[x.branch_id]||null});
    R.ok=true;
  }catch(e){ R.ok=false; }
}
const QSEL='id,topic_id,source_id,source_qno,stem,options,answer,solution';
function norm(r){ const t=R.topics[r.topic_id]||{}; return {id:r.id,topic:t,subj:t.subject,src:R.sources[r.source_id],qno:r.source_qno,stem:r.stem||{},opts:r.options||[],a:r.answer,sol:r.solution}; }
function examSources(exam,branch){ return Object.values(R.sources).filter(s=>s.exam===exam&&(!s.branch||!branch||s.branch===branch)).sort((x,y)=>(y.paper_date||'').localeCompare(x.paper_date||'')||x.shift-y.shift); }
async function fetchPractice(exam,subj,topicId){
  const tids=topicId?[topicId]:Object.values(R.topics).filter(t=>t.subject===subj).map(t=>t.id);
  const sids=examSources(exam,isBranchSubj(subj)?S.branch:null).map(s=>s.id);
  if(!tids.length||!sids.length) return [];
  const scope=exam+'|'+subj+'|'+(topicId||'all'); const off=S.seen[scope]||0;
  const base=`questions?select=${QSEL}&topic_id=in.(${tids.join(',')})&source_id=in.(${sids.join(',')})&order=id&limit=20`;
  let rows=await sb(base+'&offset='+off);
  if(!rows.length&&off){ rows=await sb(base+'&offset=0'); S.seen[scope]=0; }
  S.seen[scope]=(S.seen[scope]||0)+rows.length; save();
  return rows.map(norm);
}
async function fetchPaper(srcId){ return (await sb(`questions?select=${QSEL}&source_id=eq.${srcId}&order=source_qno`)).map(norm); }
async function fetchIds(ids){ const out=[]; for(let i=0;i<ids.length;i+=40) out.push(...await sb(`questions?select=${QSEL}&id=in.(${ids.slice(i,i+40).join(',')})`)); return out.map(norm); }

const isBranchSubj=id=>{const s=byId(DATA.subjects,id);return !!(s&&s.branch)};
const examsFor=b=>DATA.exams.filter(e=>e.branches.includes(b));
const readyExams=()=>examsFor(S.branch).filter(e=>e.ready);
function curExam(){ const r=readyExams(); return r.find(e=>e.id===S.exam)||r[0]||null; }
function examSubjects(e){
  if(!e) return [];
  const secs=(e.pattern&&e.pattern.sections)||DATA.subjects.filter(s=>!s.branch).map(s=>s.id);
  const out=[]; secs.forEach(x=>{ if(x==='branch-engineering') DATA.subjects.filter(s=>s.branch===S.branch).forEach(s=>out.push(s)); else { const s=byId(DATA.subjects,x); if(s) out.push(s);} });
  return out;
}
const stat=id=>S.st[id]||{c:0,t:0};
const todayCount=()=>S.days[today()]||0;
function streak(){ let n=0; for(let i=0;i<400;i++){ if(S.days[addDays(-i)]) n++; else if(i>0) break; } return n; }
function dueMistakes(){ const t=today(); return Object.keys(S.mis).filter(id=>S.mis[id].due<=t).map(Number); }
function weakTopics(subs){ const ok=new Set(subs.map(s=>s.id)); return Object.entries(S.tp).filter(([id,v])=>v.t>=4&&R.topics[id]&&ok.has(R.topics[id].subject)).map(([id,v])=>({id:+id,acc:pct(v.c,v.t),t:v.t})).filter(x=>x.acc<70).sort((a,b)=>a.acc-b.acc).slice(0,3); }
function negTxt(n){ if(!n) return '0'; if(Math.abs(n-.25)<.01) return '¼'; if(Math.abs(n-1/3)<.01) return '⅓'; return n; }

function bump(q,ok){
  const s=S.st[q.subj]||{c:0,t:0}; s.t++; if(ok)s.c++; S.st[q.subj]=s;
  const tid=q.topic&&q.topic.id; if(tid){ const v=S.tp[tid]||{c:0,t:0}; v.t++; if(ok)v.c++; S.tp[tid]=v; }
  S.days[today()]=(S.days[today()]||0)+1;
}
function toMistakes(q,ok){
  const m=S.mis[q.id];
  if(!ok) S.mis[q.id]={subj:q.subj,w:(m?m.w:0)+1,step:0,due:addDays(1)};
  else if(m){ const step=m.step+1; if(step>=REV.length) delete S.mis[q.id]; else S.mis[q.id]={...m,step,due:addDays(REV[step])}; }
}

function qBlock(q,mode,sel){
  const reveal=mode!=='mock'&&sel!=null, src=q.src;
  const meta=`<div class="qmeta"><span class="tag pyq">PYQ</span><span>${N(q.topic)}</span>${src?`<span>${fmtDate(src.paper_date)}, ${L('शिफ़्ट','shift')} ${src.shift}, Q${q.qno}</span>`:''}</div>`;
  const imgs=(q.stem.img||[]).map(u=>`<img class="qimg" src="${u}" alt="${L('सवाल का चित्र','Question figure')}">`).join('');
  const opts=q.opts.map((o,k)=>{let c=''; if(reveal){ if(k===q.a)c='right'; else if(k===sel)c='wrong'; } else if(sel===k) c='sel';
    return `<button class="opt ${c}" data-a="pick" data-i="${k}" ${reveal?'disabled':''} aria-pressed="${sel===k}"><span class="l">${'ABCD'[k]}</span><span class="ot">${TX(o)}${o.img?`<img src="${o.img}" alt="">`:''}</span></button>`;}).join('');
  let after='';
  if(reveal){
    if(sel===-1) after=`<div class="verdict skip">${L(`छोड़ा। सही उत्तर ${'ABCD'[q.a]} है।`,`Skipped. The answer is ${'ABCD'[q.a]}.`)}</div>`;
    else { const ok=sel===q.a; after=`<div class="verdict ${ok?'ok':'bad'}" role="status">${ok?L('सही जवाब','Correct'):L(`गलत। सही उत्तर ${'ABCD'[q.a]} है।`,`Wrong. The answer is ${'ABCD'[q.a]}.`)}${!ok&&mode!=='review'?`<div class="small" style="font-weight:500">${L('गलती बुक में जोड़ दिया।','Added to the mistake book.')}</div>`:''}</div>`; }
    if(q.sol&&q.sol.hi) after+=`<div class="sol"><b>${L('हल','Solution')}:</b> ${q.sol.hi}</div>`;
  }
  return `${meta}<div class="qtext">${TX(q.stem)}</div>${imgs}${q.stem.hi_mt&&S.lang!=='en'?`<div class="mt">हिंदी मशीन अनुवाद है, अंग्रेज़ी मूल प्रश्न है।</div>`:''}<div class="opts">${opts}</div>${after}`;
}
function clock(s){ s=Math.max(0,s|0); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function topBar(title,sub,extra='',closeAct='close'){ return `<div class="sheet-top"><div class="wrap"><button class="icon-btn" data-a="${closeAct}" aria-label="${L('बंद करें','Close')}">${ICON.close}</button><div style="flex:1;min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</b>${sub?`<span class="small muted">${sub}</span>`:''}</div>${extra}</div>`; }
function vSheet(){
  const z=V.sheet; if(!z) return '';
  if(z.loading) return `<div class="sheet" role="dialog" aria-modal="true">${topBar(z.title,'')}</div><div class="sheet-body"><div class="wrap"><div class="empty">${L('सवाल आ रहे हैं…','Loading questions…')}</div></div></div></div>`;
  if(!z.list.length) return `<div class="sheet" role="dialog" aria-modal="true">${topBar(z.title,'')}</div><div class="sheet-body"><div class="wrap"><div class="empty">${R.ok?L('यहाँ अभी सवाल नहीं हैं।','No questions here yet.'):L('सवाल लाने के लिए इंटरनेट चालू करें।','Turn on internet to load questions.')}</div><button class="btn" data-a="close">${L('वापस जाएँ','Go back')}</button></div></div></div>`;
  if(z.done) return vResult();
  const q=z.list[z.i], n=z.list.length, mock=z.mode==='mock', review=z.mode==='review';
  const sel=mock?z.ans[z.i]:review?(z.ansRef[z.i]==null?-1:z.ansRef[z.i]):z.pick;
  const answered=mock?z.ans.filter(x=>x!=null).length:0;
  const sub=mock?L(`सवाल ${z.i+1} / ${n}, हल ${answered}`,`Question ${z.i+1} / ${n}, answered ${answered}`):L(`सवाल ${z.i+1} / ${n}`,`Question ${z.i+1} / ${n}`)+(review?'':`, ${L('सही','right')} ${z.c}`);
  const extra=mock?`<span class="timer ${z.left<300?'low':''}" id="tmr" aria-label="${L('बचा समय','Time left')}">${clock(z.left)}</span><button class="icon-btn" data-a="palette" aria-label="${L('सवाल सूची','Question list')}">${ICON.grid}</button>`:'';
  const progW=Math.round((z.i+((!mock&&sel!=null)?1:0))/n*100);
  const foot=mock?`<div class="sheet-foot"><div class="wrap">
      <button class="btn line" style="flex:1" data-a="m-prev" ${z.i?'':'disabled'}>${L('पिछला','Previous')}</button>
      <button class="btn quiet" style="flex:1" data-a="m-mark">${z.mark[z.i]?L('निशान हटाएँ','Unmark'):L('बाद में देखें','Mark')}</button>
      <button class="btn" style="flex:1.2" data-a="m-next">${z.i<n-1?L('सेव, अगला','Save, next'):L('जमा करें','Submit')}</button></div></div>`
    :`<div class="sheet-foot"><div class="wrap">${sel!=null?`<button class="btn" data-a="next">${z.i<n-1?L('अगला सवाल','Next question'):(review?L('ख़त्म, बंद करें','Done, close'):L('सेट ख़त्म करें','Finish set'))}</button>`:`<button class="btn line" data-a="skip">${L('छोड़ें, अगला','Skip')}</button>`}</div></div>`;
  return `<div class="sheet" role="dialog" aria-modal="true">${topBar(z.title,sub,extra,mock?'mock-exit':'close')}<div class="prog"><i style="width:${progW}%"></i></div></div>
   <div class="sheet-body" id="sbody"><div class="wrap">${qBlock(q,review?'review':z.mode,sel)}${mock&&sel!=null?`<button class="btn quiet" style="margin-top:12px" data-a="m-clear">${L('जवाब हटाएँ','Clear answer')}</button>`:''}</div></div>${foot}</div>`;
}
function vResult(){
  const z=V.sheet;
  if(z.mode!=='mock') return `<div class="sheet" role="dialog" aria-modal="true">${topBar(z.title,'')}</div><div class="sheet-body"><div class="wrap">
    <h1 style="margin-top:8px">${L('सेट पूरा हुआ','Set complete')}</h1>
    <div class="score"><b>${z.c}</b><span class="muted">/ ${z.seen} ${L('सही','right')}</span></div>
    <div class="stats"><div class="stat"><b>${pct(z.c,z.seen)}%</b><span>${L('सही','Accuracy')}</span></div><div class="stat"><b>${z.seen-z.c}</b><span>${L('गलती बुक में','To mistakes')}</span></div><div class="stat"><b>${todayCount()}</b><span>${L('आज कुल','Today total')}</span></div></div>
    <div class="btn-row"><button class="btn line" data-a="close">${L('बंद करें','Close')}</button>${z.mode==='practice'?`<button class="btn" data-a="again">${L('अगले 20 सवाल','Next 20')}</button>`:`<button class="btn" data-a="close">${L('ठीक है','Done')}</button>`}</div></div></div></div>`;
  const r=z.res;
  return `<div class="sheet" role="dialog" aria-modal="true">${topBar(L('मॉक का नतीजा','Mock result'),z.title)}</div><div class="sheet-body"><div class="wrap">
   <div class="score"><b>${r.score}</b><span class="muted">/ ${r.max} ${L('अंक','marks')}</span></div>
   <div class="stats"><div class="stat"><b style="color:var(--ok)">${r.c}</b><span>${L('सही','Right')}</span></div><div class="stat"><b style="color:var(--bad)">${r.w}</b><span>${L('गलत','Wrong')} (−${r.neg})</span></div><div class="stat"><b>${r.u}</b><span>${L('छोड़े','Skipped')}</span></div></div>
   ${r.w?`<div class="note">${L(`गलत वाले ${r.w} सवाल छोड़ देते तो ${r.noguess} अंक आते। जिसमें पक्का न हों, उसे छोड़ना भी एक कला है।`,`Skipping the ${r.w} wrong ones would have given ${r.noguess}. Skipping what you are unsure of is a skill too.`)}</div>`:''}
   <h2>${L('विषय के अनुसार','By subject')}</h2>
   <div class="panel" style="padding:4px 10px"><table class="sub"><tr><th>${L('विषय','Subject')}</th><th>${L('सही','Right')}</th><th>${L('गलत','Wrong')}</th><th>${L('छोड़े','Skip')}</th></tr>
   ${Object.entries(r.by).map(([s,v])=>`<tr><td>${N(byId(DATA.subjects,s)||{hi:s,en:s})}</td><td>${v.c}</td><td>${v.w}</td><td>${v.u}</td></tr>`).join('')}</table></div>
   <div class="btn-row"><button class="btn line" data-a="m-review">${L('जवाब देखें','Review answers')}</button><button class="btn" data-a="close">${L('बंद करें','Close')}</button></div>
   <p class="small muted" style="margin-top:12px">${L('गलत सवाल गलती बुक में जोड़ दिए गए।','Wrong answers were added to the mistake book.')}</p></div></div></div>`;
}
function vPalette(){
  const z=V.sheet, a=z.ans.filter(x=>x!=null).length, m=z.mark.filter(Boolean).length;
  return `<div class="modal" data-a="modal-close"><div class="box" data-stop="1" role="dialog" aria-modal="true"><div style="display:flex;align-items:center"><b style="font-size:18px;flex:1">${L('सवाल सूची','All questions')}</b><button class="icon-btn" data-a="modal-close" aria-label="${L('बंद करें','Close')}">${ICON.close}</button></div>
   <div class="legend"><span><i style="background:var(--ok)"></i>${L('हल किए','Answered')} ${a}</span><span><i style="background:var(--mark)"></i>${L('बाद में देखें','Marked')} ${m}</span><span><i style="border:1.5px solid var(--bad)"></i>${L('देखा, हल नहीं','Seen')}</span><span><i style="border:1.5px solid var(--rule)"></i>${L('नहीं देखा','Not seen')}</span></div>
   <div class="pal">${z.list.map((q,i)=>`<button class="${z.mark[i]?'m':z.ans[i]!=null?'a':z.vis[i]?'v':''} ${i===z.i?'cur':''}" data-a="m-go" data-i="${i}" aria-label="${L('सवाल','Question')} ${i+1}">${i+1}</button>`).join('')}</div>
   <button class="btn saffron" style="margin-top:16px" data-a="m-submit-ask">${L('टेस्ट जमा करें','Submit test')}</button></div></div>`;
}
function vConfirm(msg,yes,act,danger){ return `<div class="modal" data-a="modal-close"><div class="box" data-stop="1" role="alertdialog" aria-modal="true"><p style="font-size:17px;margin:4px 0 16px">${msg}</p><div class="btn-row" style="margin:0"><button class="btn line" data-a="modal-close">${L('रुकें','Cancel')}</button><button class="btn saffron" style="${danger?'background:var(--bad);color:#fff':''}" data-a="${act}">${yes}</button></div></div></div>`; }

/* ============ RENDER ============ */
function applyTheme(){ const r=document.documentElement; if(S.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme); r.lang=S.lang==='en'?'en':'hi'; }
const TABS=[['today','आज','Today'],['practice','अभ्यास','Practice'],['mock','मॉक','Mock'],['mistakes','गलती बुक','Mistakes'],['me','मैं','Me']];
function render(){
  applyTheme();
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===S.lang));
  const app=$('#app');
  if(!S.branch){ app.innerHTML=vBranch(); $('#dock').classList.add('hide'); }
  else{
    $('#dock').classList.remove('hide');
    const t=S.tab; app.innerHTML=t==='practice'?vPractice():t==='mock'?vMock():t==='mistakes'?vMistakes():t==='me'?vMe():vToday();
    const due=dueMistakes().length;
    $('#dockin').innerHTML=TABS.map(x=>`<button class="${S.tab===x[0]?'on':''}" data-a="tab" data-id="${x[0]}" ${S.tab===x[0]?'aria-current="page"':''}>${ICON[x[0]]}<span>${L(x[1],x[2])}</span>${x[0]==='mistakes'&&due?`<span class="badge">${due}</span>`:''}</button>`).join('');
  }
  rSheet();
}
function rSheet(top){ $('#layer').innerHTML=vSheet()+(V.modal||''); document.body.style.overflow=V.sheet?'hidden':''; if(top){ const b=$('#sbody'); if(b) b.scrollTop=0; } }

/* ============ ACTIONS ============ */
async function openPractice(subj,topic){
  const e=curExam(); if(!e) return; const s=byId(DATA.subjects,subj)||{hi:subj,en:subj}; const t=topic?R.topics[topic]:null;
  V.sheet={mode:'practice',title:t?N(t):N(s),list:[],i:0,pick:null,c:0,seen:0,loading:true,subj,topic}; rSheet();
  try{ V.sheet.list=await fetchPractice(e.id,subj,topic?+topic:null); }catch(err){ V.sheet.list=[]; }
  V.sheet.loading=false; rSheet(true);
}
async function openRevise(subj){
  const ids=(subj?Object.keys(S.mis).filter(id=>S.mis[id].subj===subj).map(Number):dueMistakes()).slice(0,30);
  V.sheet={mode:'revise',title:L('दोहराना','Revision'),list:[],i:0,pick:null,c:0,seen:0,loading:true}; rSheet();
  try{ V.sheet.list=await fetchIds(ids); }catch(err){ V.sheet.list=[]; }
  V.sheet.loading=false; rSheet(true);
}
let TICK=null;
async function openMock(srcId){
  const e=curExam(), s=R.sources[srcId], p=e.pattern||{};
  V.modal=null; V.sheet={mode:'mock',title:`${N(e)}, ${fmtDate(s.paper_date)} ${L('शिफ़्ट','shift')} ${s.shift}`,list:[],i:0,ans:[],mark:[],vis:[],loading:true,src:srcId,left:(p.minutes||90)*60,neg:p.negative_per_wrong||0,mpq:p.marks_per_q||1}; rSheet();
  try{ V.sheet.list=await fetchPaper(srcId); }catch(err){ V.sheet.list=[]; }
  const z=V.sheet; z.loading=false; z.ans=z.list.map(()=>null); z.mark=z.list.map(()=>false); z.vis=z.list.map((_,i)=>i===0);
  z.end=Date.now()+z.left*1000; clearInterval(TICK);
  TICK=setInterval(()=>{ const y=V.sheet; if(!y||y.mode!=='mock'||y.done){clearInterval(TICK);return;} y.left=Math.round((y.end-Date.now())/1000); const el=$('#tmr'); if(el){el.textContent=clock(y.left); el.classList.toggle('low',y.left<300);} if(y.left<=0){ submitMock(); toast(L('समय ख़त्म, टेस्ट जमा हुआ','Time up, test submitted')); } },1000);
  rSheet(true);
}
function submitMock(){
  const z=V.sheet; clearInterval(TICK); let c=0,w=0,u=0; const by={};
  z.list.forEach((q,i)=>{ const a=z.ans[i], b=by[q.subj]||(by[q.subj]={c:0,w:0,u:0});
    if(a==null){u++;b.u++;return;} const ok=a===q.a; if(ok){c++;b.c++;}else{w++;b.w++;} bump(q,ok); toMistakes(q,ok); });
  const neg=+(w*z.neg).toFixed(2), score=+(c*z.mpq-neg).toFixed(2);
  z.res={c,w,u,neg,score,max:z.list.length*z.mpq,noguess:+(c*z.mpq).toFixed(2),by};
  S.mocks.push({src:z.src,label:z.title,score,max:z.res.max,c,w,u,date:today()}); save();
  z.done=true; V.modal=null; render(); rSheet(true);
}
const answeredMsg=z=>L(`${z.ans.filter(x=>x!=null).length} / ${z.list.length} सवाल हल हुए। टेस्ट जमा करें?`,`${z.ans.filter(x=>x!=null).length} / ${z.list.length} answered. Submit the test?`);

document.addEventListener('click',ev=>{
  const lg=ev.target.closest('[data-lang]'); if(lg){ S.lang=lg.dataset.lang; save(); render(); return; }
  const el=ev.target.closest('[data-a]'); if(!el) return;
  if(el.classList.contains('modal')&&ev.target.closest('[data-stop]')) return;   // tap inside a sheet box
  const a=el.dataset.a, id=el.dataset.id, z=V.sheet;
  switch(a){
    case 'branch': S.branch=id; S.exam=null; V.view=null; save(); render(); window.scrollTo(0,0); if(S.tab==='me') toast(L('ब्रांच बदल दी','Branch changed')); break;
    case 'exam': S.exam=id; V.view=null; save(); render(); break;
    case 'tab': S.tab=id; V.view=null; save(); render(); window.scrollTo(0,0); break;
    case 'open-subj': S.tab='practice'; V.view={subj:el.dataset.subj}; save(); render(); window.scrollTo(0,0); break;
    case 'back-subj': V.view=null; render(); break;
    case 'start': openPractice(el.dataset.subj, el.dataset.topic||null); break;
    case 'revise': openRevise(null); break;
    case 'revise-subj': openRevise(el.dataset.subj); break;
    case 'goal': S.goal=+id; save(); render(); break;
    case 'theme': S.theme=id; save(); render(); break;
    case 'reset-ask': V.modal=vConfirm(L('इस फ़ोन की सारी प्रगति, गलती बुक और मॉक मिट जाएँगे। यह वापस नहीं आएगा।','All progress, mistakes and mocks on this phone will be erased. This cannot be undone.'),L('मिटाएँ','Erase'),'reset',true); rSheet(); break;
    case 'reset': S.st={};S.tp={};S.days={};S.mis={};S.mocks=[];S.seen={}; V.modal=null; save(); render(); toast(L('प्रगति मिटा दी','Progress erased')); break;
    case 'modal-close': V.modal=null; rSheet(); break;
    case 'close': clearInterval(TICK); V.sheet=null; V.modal=null; render(); break;
    case 'pick':
      if(z.mode==='mock'){ z.ans[z.i]=+el.dataset.i; rSheet(); break; }
      if(z.mode==='review'||z.pick!=null) break;
      { z.pick=+el.dataset.i; z.seen++; const q=z.list[z.i], ok=z.pick===q.a; if(ok) z.c++; bump(q,ok); toMistakes(q,ok); save(); rSheet();
        const f=document.querySelector('.verdict'); if(f) f.scrollIntoView({behavior:'smooth',block:'nearest'}); }
      break;
    case 'skip': case 'next':
      if(z.i<z.list.length-1){ z.i++; z.pick=null; rSheet(true); }
      else if(z.mode==='review'){ V.sheet=null; render(); }
      else { z.done=true; render(); rSheet(true); }
      break;
    case 'again': openPractice(z.subj,z.topic); break;
    case 'mock-ask': { const e=curExam(), p=e.pattern||{}; V.modal=vConfirm(L(`यह पूरा पेपर है: ${p.questions||''} सवाल, ${p.minutes||''} मिनट। टाइमर तुरंत शुरू होगा। शुरू करें?`,`This is the full paper: ${p.questions||''} questions, ${p.minutes||''} min. The timer starts right away. Start?`),L('शुरू करें','Start'),'mock-go'); V.pendingSrc=+id; rSheet(); break; }
    case 'mock-go': openMock(V.pendingSrc); break;
    case 'm-next': if(z.i<z.list.length-1){ z.i++; z.vis[z.i]=true; rSheet(true);} else { V.modal=vConfirm(answeredMsg(z),L('जमा करें','Submit'),'m-submit'); rSheet(); } break;
    case 'm-prev': if(z.i>0){ z.i--; rSheet(true);} break;
    case 'm-mark': z.mark[z.i]=!z.mark[z.i]; rSheet(); break;
    case 'm-clear': z.ans[z.i]=null; rSheet(); break;
    case 'palette': V.modal=vPalette(); rSheet(); break;
    case 'm-go': z.i=+el.dataset.i; z.vis[z.i]=true; V.modal=null; rSheet(true); break;
    case 'm-submit-ask': V.modal=vConfirm(answeredMsg(z),L('जमा करें','Submit'),'m-submit'); rSheet(); break;
    case 'm-submit': submitMock(); break;
    case 'mock-exit': V.modal=vConfirm(L('टेस्ट बीच में छोड़ें? जवाब सेव नहीं होंगे।','Leave the test? Your answers will not be saved.'),L('टेस्ट छोड़ें','Leave test'),'close',true); rSheet(); break;
    case 'm-review': V.sheet={mode:'review',title:L('जवाब देखें','Review answers'),list:z.list,ansRef:z.ans,i:0,pick:null,c:0,seen:0}; rSheet(true); break;
  }
});
window.addEventListener('beforeunload',e=>{ if(V.sheet&&V.sheet.mode==='mock'&&!V.sheet.done){ e.preventDefault(); e.returnValue=''; } });
(async()=>{ render(); await loadRemote(); render(); })();
</script>
</body>
