name: Hindi Sample (read-only)
# Translates a few English-only questions to Hindi and uploads a JSON for review. Writes NOTHING to the database.
on:
  workflow_dispatch:
    inputs:
      n: { description: 'how many questions', default: '20' }
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -q "transformers==4.46.3" sentencepiece sacremoses einops IndicTransToolkit
      - name: Sample
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 robots/hindi/sample.py hindi_sample.json "${{ inputs.n }}"
      - uses: actions/upload-artifact@v4
        with: { name: hindi-sample, path: hindi_sample.json }
