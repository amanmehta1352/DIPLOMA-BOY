# One-time, bounded real run of the chapter job for Class 10 Science ch 11 Electricity.
# Writes nothing to main, DB, Supabase or Pages. Results land only under runs/robot-electricity-7/ on this branch.
name: chapter-robot-electricity-7 (one time, app format, web reference)

on:
  push:
    branches: [chapter-robot-electricity-7]

permissions: {}            # nothing by default; each job asks for the minimum

concurrency:
  group: chapter-robot-electricity-7
  cancel-in-progress: false

jobs:
  generate:
    # Guard 1: only the push that CREATES the branch. Guard 2: that commit carries the run token.
    if: github.event.created == true && contains(github.event.head_commit.message, '[chapter-robot-electricity-7-once]')
    runs-on: ubuntu-latest          # standard runner (larger runners are billed even on public repos)
    timeout-minutes: 40
    permissions:
      contents: read                # this job holds the AI keys and cannot write to the repo
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Guard 3 - stop if a result already exists
        run: |
          if [ -e runs/robot-electricity-7 ]; then echo "result already present; refusing a second AI run"; exit 1; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Syllabus robot (Class 10 Science) + resume Electricity (research + English only)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_WRITE_MODEL: ${{ vars.GROQ_WRITE_MODEL }}
          SAMBANOVA_WRITE_MODEL: ${{ vars.SAMBANOVA_WRITE_MODEL }}
          CLOUDFLARE_WRITE_MODEL: ${{ vars.CLOUDFLARE_WRITE_MODEL }}
          OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          FREE_TIER_CONFIRMED: gemini,groq,nvidia,sambanova,cloudflare     # owner instruction 2026-11-03 20:16 IST: switch to the next free AI when quota ends
          ROUTE_DIR: robots/route
          COPYRIGHT_FINGERPRINTS: robots/copyright/fingerprints
          CHAPTER_JOBS_DIR: out
          PROVIDER_TIME_BUDGET_S: '1200'
          PROVIDER_MAX_CALLS: '60'
          WRITER_PROVIDER: gemini
          GEMINI_WRITER_MODEL: gemini-3.5-flash
          JOB_CYCLE: robot-5
          SYLLABUS_FILE: out/syllabus_class10.json
          SYLLABUS_OUT: out/syllabus_class10.json
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WRITER_DIR: robots/writer
        run: |
          pip install -q reportlab
          which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null)
          mkdir -p out && cp -r seed/f1c3a545c6f0687b out/
          python3 - <<'PY' || echo 'catalog fetch failed' > out/catalog_error.txt
          import json, os, urllib.request
          k = os.environ['SUPABASE_SECRET_KEY'].strip()
          r = urllib.request.Request('https://wobmtlcpszcntczkebtt.supabase.co/rest/v1/rpc/get_level_catalog', json.dumps({'p_level': 'class_9_10'}).encode(),
                                     {'apikey': k, 'Authorization': 'Bearer ' + k, 'Content-Profile': 'mtb', 'Accept-Profile': 'mtb', 'Content-Type': 'application/json'}, method='POST')
          json.dump(json.load(urllib.request.urlopen(r, timeout=60)), open('out/catalog_class_9_10.json', 'w'), ensure_ascii=False)
          PY
          true
          python3 chapter_job/test_robot.py && python3 chapter_job/test_syllabus.py && SYLLABUS_FILE= python3 chapter_job/syllabus_robot.py "Class 10, CBSE 2026-27, Science" --catalog out/catalog_class_9_10.json > out/syllabus_report.json 2>&1 || echo "syllabus robot exited non-zero" >> out/syllabus_report.json
          [ -f out/syllabus_class10.json ] || cp chapter_job/syllabus_cbse10_2026_27.json out/syllabus_class10.json
          python3 chapter_job/chapter_robot.py "Class 10, CBSE 2026-27, Science, Electricity" --retry > out/run_summary.txt 2>&1 || echo "job exited non-zero" >> out/run_summary.txt
      - name: Refuse to publish if any secret value is in the output
        env:
          S1: ${{ secrets.OPENROUTER_API_KEY }}
          S2: ${{ secrets.GEMINI_API_KEY }}
          S3: ${{ secrets.GROQ_API_KEY }}
          S4: ${{ secrets.NVIDIA_API_KEY }}
          S5: ${{ secrets.SAMBANOVA_API_KEY }}
          S6: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S7: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          vals = [os.environ[k] for k in ('S1', 'S2', 'S3', 'S4', 'S5', 'S6', 'S7') if len(os.environ.get(k, '')) >= 8]
          bad = [str(p) for p in pathlib.Path('out').rglob('*') if p.is_file() and any(v in p.read_text(errors='ignore') for v in vals)]
          if bad: print('secret found in', len(bad), 'file(s); not publishing'); sys.exit(1)
          print('no secret values in output')
          PY
      - uses: actions/upload-artifact@v4
        with: { name: electricity-result, path: out/, retention-days: 1 }

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write               # repo-wide token; the destination is limited by the script below, not by the token
    steps:
      - uses: actions/checkout@v4
        with: { ref: chapter-robot-electricity-7 }
      - uses: actions/download-artifact@v4
        with: { name: electricity-result, path: runs/robot-electricity-7 }
      - name: Commit result to this branch only, under runs/robot-electricity-7/
        run: |
          git add runs/robot-electricity-7
          if git diff --cached --name-only | grep -v '^runs/robot-electricity-7/'; then echo "unexpected path; abort"; exit 1; fi
          git config user.name "chapter-job-run"; git config user.email "chapter-job-run@users.noreply.github.com"
          git commit -m "Chapter robot Electricity 7 result [skip ci]"
          git push origin HEAD:refs/heads/chapter-robot-electricity-7    # explicit ref, no force
