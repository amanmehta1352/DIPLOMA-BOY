# One-time VERIFY-ONLY run (owner approval 2026-11-06 07:40 IST): fact check + answer-blind solver on the Electricity 880 app draft.
# No AI writes content here. Writes nothing to main, DB, Supabase or Pages. Result lands only under runs/check880-1/ on this branch.
name: 'electricity-880-check-1 (one time, verify only)'

on:
  push:
    branches: [electricity-880-check-1]

permissions: {}

concurrency:
  group: electricity-880-check-1
  cancel-in-progress: false

jobs:
  check:
    if: github.event.created == true && contains(github.event.head_commit.message, '[electricity-880-check-1-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Guard - stop if a result already exists
        run: |
          if [ -e runs/check880-1 ]; then echo "result already present; refusing a second AI run"; exit 1; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Verify draft (OpenRouter free checker only)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
          FREE_TIER_CONFIRMED: ''
          ROUTE_DIR: robots/route
          PROVIDER_TIME_BUDGET_S: '1500'
          PROVIDER_MAX_CALLS: '16'
        run: |
          pip install -q sympy==1.14.0 pint==0.26.2
          mkdir -p out
          python3 chapter_job/test_book.py | tail -1 > out/tests.txt; python3 chapter_job/test_numcheck.py | tail -1 >> out/tests.txt
          python3 chapter_job/verify_draft.py seed/check880/job robots/copyright/fingerprints seed/check880/job/chapter_app_format_draft.json out > out/run_summary.txt 2>&1 || echo "verify exited non-zero" >> out/run_summary.txt
          cp out/jobs/*/checks.json out/robot_checks.json 2>/dev/null || true; rm -rf out/jobs
      - name: Refuse to publish if the secret value is in the output
        env:
          S1: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          v = os.environ.get('S1', '')
          bad = [str(p) for p in pathlib.Path('out').rglob('*') if p.is_file() and len(v) >= 8 and v in p.read_text(errors='ignore')]
          if bad: print('secret found; not publishing'); sys.exit(1)
          print('no secret values in output')
          PY
      - uses: actions/upload-artifact@v4
        with: { name: check880-result, path: out/, retention-days: 1 }

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: electricity-880-check-1 }
      - uses: actions/download-artifact@v4
        with: { name: check880-result, path: runs/check880-1 }
      - name: Commit result to this branch only, under runs/check880-1/
        run: |
          git add runs/check880-1
          if git diff --cached --name-only | grep -v '^runs/check880-1/'; then echo "unexpected path; abort"; exit 1; fi
          git config user.name "chapter-job-run"; git config user.email "chapter-job-run@users.noreply.github.com"
          git commit -m "Electricity 880 check 1 result [skip ci]"
          git push origin HEAD:refs/heads/electricity-880-check-1
