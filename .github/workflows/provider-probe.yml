name: Backup provider probe
run-name: Backup provider probe (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One short call to each backup provider
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_WRITE_MODEL: ${{ vars.GROQ_WRITE_MODEL }}
          SAMBANOVA_WRITE_MODEL: ${{ vars.SAMBANOVA_WRITE_MODEL }}
          CLOUDFLARE_WRITE_MODEL: ${{ vars.CLOUDFLARE_WRITE_MODEL }}
        run: python3 robots/writer/probe_providers.py
