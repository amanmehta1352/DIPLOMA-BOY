name: Dispatcher
# Owner's commands from the Control Room (mtb.robot_commands) -> start the right robot, follow it, store the result.
# Every 15 minutes (GitHub may run it a little late). No AI. Keys are never printed.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (only print what would happen)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: dispatcher
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Self-test
        run: python robots/dispatcher/selftest.py
      - name: Dispatch
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          A=""
          [ "${{ inputs.dry_run }}" = "true" ] && A="--dry-run"
          python robots/dispatcher/dispatcher.py $A
