/* ===== copied verbatim from book.html: stacked fractions and formula fitting ===== */
/*__FRACIFY__*/
</script>
<script>
/* Diploma Boy level book: one subject of one level, every chapter drawn like the Physics book.
   URL: ?l=<level id>&s=<subject slug>&ch=<chapter id>&tab=<book|notes|teach|formula|diagram>&ui=<hi|en>&ln=<level name> */
const SB = {url:'https://wobmtlcpszcntczkebtt.supabase.co', key:'sb_publishable_7ZZEUDULfYaMHSeLIxfluQ_fZWSCi8R'}; // publishable key
const Q = new URLSearchParams(location.search);
const LEVEL = Q.get('l') || '', SUBJ = Q.get('s') || '', UI = Q.get('ui') === 'en' ? 'en' : 'hi', LEVEL_NAME = Q.get('ln') || '';
let currentLang = UI;
try { const sv = localStorage.getItem('lvl_lang'); if (!Q.get('ui') && ['hi','en','both'].includes(sv)) currentLang = sv; } catch (e) {}
document.body.dataset.lang = currentLang;
let SUBJECT = null, CHAPTERS = [], curCh = +Q.get('ch') || 0;
const ATOMS = {};
const H = (hi, en) => `<span class="hi">${hi}</span><span class="en">${en}</span>`;
const L = (hi, en) => currentLang === 'en' ? en : currentLang === 'both' ? `${hi} · ${en}` : hi;   /* plain-text labels follow the language buttons */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* plain number fractions in running text (25/100, 1/4) are drawn stacked, like the Physics book's formula boxes */
const fracText = h => h.replace(/(^|[^\w./])(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)(?![\w/])/g, (m, pre, a, b) => `${pre}<span class="frac"><span class="num">${a}</span><span class="den">${b}</span></span>`);
const nl = s => fracText(esc(s)).replace(/\n/g, '<br>');
/* formula text: one formula per line (split on " · "), and a bare "/100" (divide by) is written as "÷ 100" so it is not stacked under a word */
const fx = s => String(s || '').split(/\s+·\s+/).map(x => `<div>${esc(x.replace(/(^|\s)\/(?=\s*\d)/g, (m, pre, at, text) => /\d\s*$/.test(text.slice(0, at)) ? m : pre + '÷ '))}</div>`).join('');
const noNum = t => String(t || '').replace(/^\s*\d+\.\s*/, '');
async function get(path){
  const r = await fetch(SB.url + '/rest/v1/' + path, {headers:{apikey:SB.key, Authorization:'Bearer ' + SB.key, 'Accept-Profile':'mtb'}});
  if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
}
async function atomsFor(id){ if (!ATOMS[id]) ATOMS[id] = await get(`rpc/get_chapter_atoms?p_chapter=${+id}&p_level=${encodeURIComponent(LEVEL)}`); return ATOMS[id]; }
const ready = () => CHAPTERS.filter(c => c.n > 0);
const cur = () => CHAPTERS.find(c => c.id === curCh);
const noOf = c => CHAPTERS.indexOf(c) + 1;
const byType = (atoms, t) => atoms.filter(a => a.type === t && a.body);
const svgImg = svg => `<img alt="" loading="lazy" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(String(svg || ''))}">`;
function pageScroller(){ const b = document.body; return (b.scrollHeight > b.clientHeight + 1 && /auto|scroll/.test(getComputedStyle(b).overflowY)) ? b : (document.scrollingElement || document.documentElement); }
window.__curCh = () => curCh;   /* read by the app shell to count reading time */

const PENDING = () => `<div class="lang-pending" style="display:${currentLang === 'hi' ? 'none' : 'block'}">${H('इस अध्याय का पाठ अभी सिर्फ़ हिंदी में है।', 'English version of this chapter is coming. The content below is shown in Hindi.')}</div>`;
function setLang(lang){
  currentLang = lang; try { localStorage.setItem('lvl_lang', lang); } catch (e) {}
  document.body.dataset.lang = lang;
  document.querySelectorAll('.lang-toggle .lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  switchTab(document.body.dataset.tabActive || 'notes');
}
function setChapter(id){
  const c = CHAPTERS.find(x => x.id === id); if (!c || !c.n) return;
  curCh = id; switchTab(document.body.dataset.tabActive || 'notes');
}
function renderChapBar(){
  const bar = document.getElementById('chapBar'), c = cur();
  bar.innerHTML = CHAPTERS.map((m, i) => `<button class="chap-chip${m.id === curCh ? ' active' : ''}${m.n ? '' : ' soon'}" ${m.n ? `onclick="setChapter(${m.id})"` : 'disabled'}><b>${i + 1}</b><span>${m.n ? '' : '🔒 '}${esc(noNum(L(m.hi, m.en)))}</span></button>`).join('');
  const a = bar.querySelector('.chap-chip.active'); if (a && a.scrollIntoView) a.scrollIntoView({inline:'center', block:'nearest'});
  document.getElementById('readerTitle').textContent = c ? `${noOf(c)}. ${noNum(L(c.hi, c.en))}` : '';
}

/* ---- check questions (the chapter's own 2 questions) ---- */
function mcqBlock(atoms, sheet){
  return mcqHtml(byType(atoms, 'mcq').flatMap(a => (a.body.questions || [])));
}
function mcqHtml(list){
  const qs = (list || []).filter(q => q && Array.isArray(q.options) && q.options.length);
  return qs.map((q, i) => `<div class="lb-mcq" data-ans="${+q.answer}" data-exp="${esc(q.explanation || '')}">
      <div class="lb-q">${i + 1}. ${nl(q.q)}</div>
      ${q.options.map((o, j) => `<button class="lb-opt" data-o="${j}">${esc(o)}</button>`).join('')}
      <div class="lb-exp"></div></div>`).join('');
}
function bindMcq(root){
  root.querySelectorAll('.lb-mcq').forEach(box => box.querySelectorAll('.lb-opt').forEach(btn => btn.addEventListener('click', () => {
    if (box.dataset.done) return; box.dataset.done = '1';
    const ans = +box.dataset.ans, pick = +btn.dataset.o, ok = pick === ans, btns = [...box.querySelectorAll('.lb-opt')];
    btns.forEach(x => x.disabled = true); btn.classList.add(ok ? 'ok' : 'no'); if (!ok && btns[ans]) btns[ans].classList.add('ok');
    box.querySelector('.lb-exp').innerHTML = (ok ? L('✔ सही!', '✔ Correct!') : L('✘ गलत।', '✘ Not quite.')) + (box.dataset.exp ? ' ' + nl(box.dataset.exp) : '');
    try { if (parent && parent.__levelQuiz) parent.__levelQuiz(curCh, ok); } catch (e) {}
  })));
}

/* ---- the five tabs ---- */
function topicTitles(atoms){
  const t = [];
  byType(atoms, 'concept').forEach(a => t.push(a.title || L('समझो','Concept')));
  byType(atoms, 'svg').forEach(a => t.push(a.title || L('चित्र','Diagram')));
  byType(atoms, 'formula').forEach(a => t.push(a.title || L('सूत्र','Formula')));
  byType(atoms, 'example').forEach(a => t.push(a.title || L('हल किया उदाहरण','Solved example')));
  if (mcqBlock(atoms)) t.push(L('खुद को जाँचें','Check yourself'));
  return t;
}
function bookGo(tab, i){
  switchTab(tab).then(() => requestAnimationFrame(() => {
    const el = document.querySelectorAll(tab === 'teach' ? '#readerContent .teach-sec' : '#readerContent .panel')[i];
    if (!el) return;
    el.scrollIntoView({block:'start'});
    const tb = document.querySelector('.top-bar'), off = (tb ? tb.getBoundingClientRect().height : 56) + 12;
    try { pageScroller().scrollTop -= off; } catch (e) {}
    el.classList.add('book-flash'); setTimeout(() => el.classList.remove('book-flash'), 1600);
  }));
}
function bookTab(atoms){
  const c = cur(), n = t => byType(atoms, t).length;
  const chaps = CHAPTERS.map((m, i) => `<button class="book-chap${m.id === curCh ? ' active' : ''}${m.n ? '' : ' soon'}" ${m.n ? `onclick="setChapter(${m.id})"` : 'disabled'}><b>${i + 1}</b>${m.n ? '' : '🔒 '}${esc(noNum(L(m.hi, m.en)))}</button>`).join('');
  const rd = ready().length, soon = CHAPTERS.length - rd;
  return '<div class="book-wrap">'
    + `<div class="book-hero"><div class="book-num">${noOf(c)}</div><div><div class="book-title">${esc(noNum(L(c.hi, c.en)))}</div>`
    + `<div class="book-stats">${esc(LEVEL_NAME)} · ${esc(L(SUBJECT.hi, SUBJECT.en))}<br>${L(`💡 ${n('concept')} समझ · ∑ ${n('formula')} सूत्र · 🧮 ${n('example')} उदाहरण · ✅ ${byType(atoms,'mcq').reduce((a,x)=>a+((x.body.questions||[]).length),0)} सवाल · 🖼️ ${n('svg')} चित्र`,
        `💡 ${n('concept')} concept · ∑ ${n('formula')} formula · 🧮 ${n('example')} example · ✅ ${byType(atoms,'mcq').reduce((a,x)=>a+((x.body.questions||[]).length),0)} questions · 🖼️ ${n('svg')} diagram`)}</div></div></div>`
    + `<div class="book-actions"><button class="book-act" onclick="switchTab('notes')"><b>✦</b>${H('नोट्स','Notes')}</button><button class="book-act" onclick="switchTab('teach')"><b>◉</b>${H('क्लास','Teach')}</button><button class="book-act" onclick="switchTab('formula')"><b>∑</b>${H('सूत्र','Formula')}</button><button class="book-act" onclick="switchTab('diagram')"><b>🖼️</b>${H('चित्र','Diagram')}</button></div>`
    + (() => { const T = topicTitles(atoms), li = tab => T.map((x, i) => `<li><button class="book-item" onclick="bookGo('${tab}',${i})"><span class="bi-n">${i + 1}.</span><span>${esc(x)}</span></button></li>`).join('');
        return T.length ? `<div class="book-card"><div class="book-h">${H('📑 नोट्स — विषय-सूची', '📑 Notes — contents')}</div><ol class="book-list">${li('notes')}</ol></div>`
          + `<div class="book-card"><div class="book-h">${H('🎓 Teach — पाठ', '🎓 Teach — lessons')}</div><ol class="book-list">${li('teach')}</ol></div>` : ''; })()
    + `<div class="book-card"><div class="book-h">${H(`📚 पूरी किताब: ${esc(SUBJECT.hi)} (${rd} तैयार${soon ? `, ${soon} जल्द` : ''})`, `📚 Whole book: ${esc(SUBJECT.en)} (${rd} ready${soon ? `, ${soon} coming soon` : ''})`)}</div><div class="book-chaps">${chaps}</div></div>`
    + '</div>';
}
function notesTab(atoms){
  const c = cur(), p = [];
  byType(atoms, 'concept').forEach(a => p.push(`<div class="panel blue"><div class="panel-header">💡 ${esc(a.title || L('समझो','Concept'))}</div><div class="panel-body"><p>${nl(a.body.text)}</p>${a.body.note ? `<div class="teach-ex" style="background:#fffbeb;color:#92400e;border-left-color:#f59e0b;margin-top:10px">📌 ${nl(a.body.note)}</div>` : ''}</div></div>`));
  byType(atoms, 'svg').forEach(a => p.push(`<div class="panel orange"><div class="panel-header">🖼️ ${esc(a.title || L('चित्र','Diagram'))}</div><div class="panel-body"><div class="lb-fig">${svgImg(a.body.svg)}</div>${a.body.caption ? `<div class="lb-cap">${esc(a.body.caption)}</div>` : ''}</div></div>`));
  byType(atoms, 'formula').forEach(a => p.push(`<div class="panel purple"><div class="panel-header">✏️ ${esc(a.title || L('सूत्र','Formula'))}</div><div class="panel-body"><div class="formula-box">${fx(a.body.formula)}</div>${a.body.explanation ? `<p>${nl(a.body.explanation)}</p>` : ''}</div></div>`));
  byType(atoms, 'example').forEach(a => p.push(`<div class="panel green"><div class="panel-header">🧮 ${esc(a.title || L('हल किया उदाहरण','Solved example'))}</div><div class="panel-body"><p><strong>${L('सवाल','Question')}:</strong> ${nl(a.body.question)}</p>${a.body.solution ? `<div class="formula-box" style="text-align:left">${fx(a.body.solution)}</div>` : ''}${a.body.answer ? `<div class="lb-ans">✔ ${L('उत्तर','Answer')}: ${nl(a.body.answer)}</div>` : ''}</div></div>`));
  const m = mcqBlock(atoms, true); if (m) p.push(`<div class="panel red"><div class="panel-header">✅ ${L('खुद को जाँचें','Check yourself')}</div><div class="panel-body">${m}</div></div>`);
  return `<div class="notes-theme"><div class="notes-paper">${PENDING()}<div style="text-align:center;font-weight:800;font-size:20px;color:#1d4ed8;margin:4px 0 12px">${noOf(c)}. ${esc(noNum(L(c.hi, c.en)))}</div>${p.join('') || `<p>${L('इस अध्याय में अभी सामग्री नहीं।','No content in this chapter yet.')}</p>`}</div></div>`;
}
let teachLang = 'hindi';
function setTeachLang(l, btn){
  teachLang = l;
  document.querySelectorAll('.lang-switcher .lang-btn').forEach(b => b.classList.toggle('active', b === btn));
  const pend = document.getElementById('teachPending'); if (pend) pend.style.display = l === 'hindi' ? 'none' : 'block';
}
function teachTab(atoms){
  const c = cur(), s = [];
  teachLang = currentLang === 'en' ? 'english' : currentLang === 'both' ? 'bilingual' : 'hindi';
  byType(atoms, 'concept').forEach(a => s.push(`<div class="teach-sec"><div class="teach-sec-h">💡 ${esc(a.title || L('समझो','Concept'))}</div><div class="teach-text"><p>${nl(a.body.text)}</p>${a.body.note ? `<div class="teach-ex"><strong>${L('याद रखो:','Remember:')}</strong> ${nl(a.body.note)}</div>` : ''}</div></div>`));
  byType(atoms, 'svg').forEach(a => s.push(`<div class="teach-sec"><div class="teach-sec-h">🖼️ ${esc(a.title || L('चित्र से समझो','See it'))}</div><div class="lb-fig">${svgImg(a.body.svg)}</div>${a.body.caption ? `<div class="lb-cap">${esc(a.body.caption)}</div>` : ''}</div>`));
  byType(atoms, 'formula').forEach(a => s.push(`<div class="teach-sec"><div class="teach-sec-h">✏️ ${esc(a.title || L('सूत्र','Formula'))}</div><div class="teach-formula">${fx(a.body.formula)}</div>${a.body.explanation ? `<div class="teach-text"><p>${nl(a.body.explanation)}</p></div>` : ''}</div>`));
  byType(atoms, 'example').forEach(a => s.push(`<div class="teach-sec"><div class="teach-sec-h">🧮 ${L('चलो एक सवाल हल करें','Let us solve one')}</div><div class="teach-text"><div class="teach-ex"><strong>${L('सवाल:','Question:')}</strong> ${nl(a.body.question)}</div>${a.body.solution ? `<div class="teach-formula" style="text-align:left">${fx(a.body.solution)}</div>` : ''}${a.body.answer ? `<div class="lb-ans">✔ ${L('उत्तर','Answer')}: ${nl(a.body.answer)}</div>` : ''}</div></div>`));
  const m = mcqBlock(atoms, false); if (m) s.push(`<div class="teach-sec"><div class="teach-sec-h">✅ ${L('अब तुम बताओ','Your turn')}</div><div class="teach-text">${m}</div></div>`);
  const langs = [['hindi','हिंदी'],['english','English'],['bilingual','Bilingual'],['hinglish','Hinglish']];
  const sw = `<div class="lang-switcher">${langs.map(l => `<button class="lang-btn${l[0] === teachLang ? ' active' : ''}" onclick="setTeachLang('${l[0]}', this)">${l[1]}</button>`).join('')}</div>`
    + `<div class="lang-pending" id="teachPending" style="display:${teachLang === 'hindi' ? 'none' : 'block'}">${H('इस अध्याय का पाठ अभी सिर्फ़ हिंदी में है।', 'English version of this chapter is coming. The content below is shown in Hindi.')}</div>`;
  return `<div class="teach-theme">${sw}<div class="teach-title">${noOf(c)}. ${esc(noNum(L(c.hi, c.en)))} — ${L('क्लास में आपका स्वागत है!','welcome to the class!')}</div>${s.join('') || `<div class="teach-text"><p>${L('इस अध्याय में अभी सामग्री नहीं।','No content in this chapter yet.')}</p></div>`}</div>`;
}
function formulaTab(atoms){
  const f = byType(atoms, 'formula'), ex = byType(atoms, 'example').filter(a => a.body.solution), c = cur(), total = f.length + ex.length;
  const card = (cat, a, title, body, sub) => `<div class="fcard cat-basic" data-cat="${cat}"><div class="top-row"><span class="cat-chip basic">● ${esc(LEVEL_NAME)}</span><span class="counter"></span></div><div class="fcard-title">${esc(title || '')}</div><div class="formula-box-demo">${body}</div>${sub ? `<div class="fcard-sub" style="margin-top:4px">${nl(sub)}</div>` : ''}</div>`;
  const cards = f.map(a => card('formula', a, a.title, fx(a.body.formula), a.body.explanation)).join('')
    + ex.map(a => card('example', a, a.title || L('हल किया उदाहरण','Solved example'), fx(a.body.solution), a.body.question)).join('');
  const chips = [['all', H('सभी','All'), total], ['formula', H('सूत्र','Formulas'), f.length], ['example', H('हल किए उदाहरण','Worked examples'), ex.length]].filter(x => x[0] === 'all' || x[2])
    .map(x => `<button class="filter-chip${x[0] === 'all' ? ' active' : ''}" data-filter="${x[0]}">${x[1]} (${x[2]})</button>`).join('');
  return PENDING() + (total ? `<div class="filter-wrap"><div class="filter-chips" id="formulaChips">${chips}</div></div>` : '')
    + `<div class="cards-list" id="formulaCards">${cards || `<div class="pending-card">${L('इस अध्याय में अभी कोई सूत्र नहीं।','No formula in this chapter yet.')}</div>`}</div>`
    + (total ? `<div class="formula-note">${H('👆 ऊपर-नीचे scroll करो — filter chips sticky रहेंगी।<br>Filter दबाओ — उस category के cards दिखेंगे।', '👆 Scroll up and down — filter chips stay sticky.<br>Tap a filter to show only that category.')}</div>` : '');
}
function applyFormulaFilter(filter){
  document.querySelectorAll('#formulaChips .filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === filter));
  const cards = [...document.querySelectorAll('#formulaCards .fcard')];
  cards.forEach(card => { card.style.display = (filter === 'all' || card.dataset.cat === filter) ? 'flex' : 'none'; });
  const vis = cards.filter(c => c.style.display !== 'none');
  vis.forEach((card, i) => { const k = card.querySelector('.counter'); if (k) k.textContent = (i + 1) + ' / ' + vis.length; });
  try { pageScroller().scrollTo({top:0, behavior:'smooth'}); } catch (e) { window.scrollTo({top:0, behavior:'smooth'}); }
}
document.addEventListener('click', e => { const chip = e.target.closest('#formulaChips .filter-chip'); if (chip) applyFormulaFilter(chip.dataset.filter); });
function diagramTab(atoms){
  const d = byType(atoms, 'svg');
  return `<div class="notes-theme"><div class="notes-paper">${d.map(a => `<div class="panel orange"><div class="panel-header">🖼️ ${esc(a.title || '')}</div><div class="panel-body"><div class="lb-fig">${svgImg(a.body.svg)}</div>${a.body.caption ? `<div class="lb-cap">${esc(a.body.caption)}</div>` : ''}</div></div>`).join('')
    || `<p>${L('इस अध्याय का चित्र अभी तैयार नहीं है।','No diagram for this chapter yet.')}</p>`}</div></div>`;
}

/* ---- review mode: the owner's preview of robot drafts. Opens only with ?review=<code>; students never see drafts ---- */
const REVIEW = (Q.get('review') || '').trim();
const DRAFTS = {};
async function post(fn, args){
  const r = await fetch(SB.url + '/rest/v1/rpc/' + fn, {method:'POST', headers:{apikey:SB.key, Authorization:'Bearer ' + SB.key, 'Content-Profile':'mtb', 'Accept-Profile':'mtb', 'Content-Type':'application/json'}, body:JSON.stringify(args)});
  if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
}
async function draftFor(id){ if (!(id in DRAFTS)) DRAFTS[id] = await post('draft_review_get', {p_level:LEVEL, p_chapter:+id, p_code:REVIEW}); return DRAFTS[id]; }
const arr = x => Array.isArray(x) ? x : [];
const pts = list => `<ul class="lb-pts">${arr(list).map(x => `<li>${nl(x)}</li>`).join('')}</ul>`;
const lines = list => arr(list).map(x => `<div>${esc(x)}</div>`).join('');
function tbl(t){
  const rows = arr(t).filter(r => Array.isArray(r) && r.length); if (rows.length < 2) return '';
  return `<div class="lb-tblw"><table class="lb-tbl"><tr>${rows[0].map(c => `<th>${nl(c)}</th>`).join('')}</tr>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${nl(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
function reviewBanner(r){
  const ck = r.checks || {}, prob = arr(ck.problems), so = ck.second_opinion;
  return `<div class="lb-review">📝 <b>${L('ड्राफ्ट — सिर्फ़ आपके देखने के लिए। छात्रों को नहीं दिखता।','Draft: only for your review. Students do not see it.')}</b><br>`
    + `${L('हालत','Status')}: <b class="${r.status === 'draft' ? '' : 'bad'}">${esc(r.status)}</b> · ${esc(r.model || '')}`
    + (so ? ` · ${L('दूसरे AI से जाँच','Second opinion')}: ${10 - arr(so.disagree).length}/10 ${L('मिले','agree')}` : '')
    + (prob.length ? `<br><span class="bad">${prob.map(esc).join('<br>')}</span>` : '') + '</div>';
}
function dNoteTitles(d){
  return [...arr(d.notes).map(n => n.title), ...arr(d.solved).map((x, i) => L(`हल किया सवाल ${i + 1}`, `Solved question ${i + 1}`)),
    ...(arr(d.mistakes).length ? [L('आम गलतियाँ','Common mistakes')] : []), ...(arr(d.revision).length ? [L('जल्दी दोहराओ','Quick revision')] : []),
    ...(arr(d.practice).length ? [L(`अभ्यास (${arr(d.practice).length} सवाल)`, `Practice (${arr(d.practice).length} questions)`)] : [])];
}
function dTeachTitles(d){
  return [...arr(d.teach).map(t => t.heading), ...arr(d.solved).map((x, i) => L(`चलो हल करें ${i + 1}`, `Let us solve ${i + 1}`)), ...(arr(d.practice).length ? [L('अब तुम बताओ','Your turn')] : [])];
}
function dBook(r){
  const d = r.data || {}, c = cur();
  const chaps = CHAPTERS.map((m, i) => `<button class="book-chap${m.id === curCh ? ' active' : ''}${m.n ? '' : ' soon'}" ${m.n ? `onclick="setChapter(${m.id})"` : 'disabled'}><b>${i + 1}</b>${m.n ? '' : '🔒 '}${esc(noNum(L(m.hi, m.en)))}</button>`).join('');
  const li = (T, tab) => T.map((x, i) => `<li><button class="book-item" onclick="bookGo('${tab}',${i})"><span class="bi-n">${i + 1}.</span><span>${esc(x)}</span></button></li>`).join('');
  const k = x => arr(d[x]).length;
  return reviewBanner(r) + '<div class="book-wrap">'
    + `<div class="book-hero"><div class="book-num">${noOf(c)}</div><div><div class="book-title">${esc(noNum(L(c.hi, c.en)))}</div>`
    + `<div class="book-stats">${esc(LEVEL_NAME)} · ${esc(L(SUBJECT.hi, SUBJECT.en))}<br>${L(`📑 ${k('notes')} विषय · 🎓 ${k('teach')} पाठ · ∑ ${k('formulas')} सूत्र · 🧮 ${k('solved')} हल · ✅ ${k('practice')} अभ्यास`, `📑 ${k('notes')} topics · 🎓 ${k('teach')} lessons · ∑ ${k('formulas')} formulas · 🧮 ${k('solved')} solved · ✅ ${k('practice')} practice`)}</div></div></div>`
    + `<div class="book-actions"><button class="book-act" onclick="switchTab('notes')"><b>✦</b>${H('नोट्स','Notes')}</button><button class="book-act" onclick="switchTab('teach')"><b>◉</b>${H('क्लास','Teach')}</button><button class="book-act" onclick="switchTab('formula')"><b>∑</b>${H('सूत्र','Formula')}</button><button class="book-act" onclick="switchTab('diagram')"><b>🖼️</b>${H('चित्र','Diagram')}</button></div>`
    + `<div class="book-card"><div class="book-h">${H('📑 नोट्स — विषय-सूची', '📑 Notes — contents')}</div><ol class="book-list">${li(dNoteTitles(d), 'notes')}</ol></div>`
    + `<div class="book-card"><div class="book-h">${H('🎓 Teach — पाठ', '🎓 Teach — lessons')}</div><ol class="book-list">${li(dTeachTitles(d), 'teach')}</ol></div>`
    + `<div class="book-card"><div class="book-h">${H('📚 ड्राफ्ट वाले अध्याय', '📚 Chapters with a draft')}</div><div class="book-chaps">${chaps}</div></div>`
    + '</div>';
}
function dSolved(x, i, teach){
  const steps = `<div class="${teach ? 'teach-formula' : 'formula-box'}" style="text-align:left">${lines(x.steps)}</div>`;
  const ans = x.answer ? `<div class="lb-ans">✔ ${L('उत्तर','Answer')}: ${nl(x.answer)}</div>` : '';
  return teach
    ? `<div class="teach-sec"><div class="teach-sec-h">🧮 ${L(`चलो हल करें ${i + 1}`, `Let us solve ${i + 1}`)}</div><div class="teach-text"><div class="teach-ex"><strong>${L('सवाल:','Question:')}</strong> ${nl(x.question)}</div>${steps}${ans}</div></div>`
    : `<div class="panel green"><div class="panel-header">🧮 ${L(`हल किया सवाल ${i + 1}`, `Solved question ${i + 1}`)}</div><div class="panel-body"><p><strong>${L('सवाल','Question')}:</strong> ${nl(x.question)}</p>${steps}${ans}</div></div>`;
}
function dNotes(r){
  const d = r.data || {}, c = cur(), p = [];
  arr(d.notes).forEach(n => p.push(`<div class="panel blue"><div class="panel-header">📑 ${esc(n.title)}</div><div class="panel-body">${pts(n.points)}${tbl(n.table)}</div></div>`));
  arr(d.solved).forEach((x, i) => p.push(dSolved(x, i, false)));
  if (arr(d.mistakes).length) p.push(`<div class="panel red"><div class="panel-header">⚠️ ${L('आम गलतियाँ','Common mistakes')}</div><div class="panel-body">${pts(d.mistakes)}</div></div>`);
  if (arr(d.revision).length) p.push(`<div class="panel purple"><div class="panel-header">🔁 ${L('जल्दी दोहराओ','Quick revision')}</div><div class="panel-body">${pts(d.revision)}</div></div>`);
  const m = mcqHtml(d.practice); if (m) p.push(`<div class="panel red"><div class="panel-header">✅ ${L('अभ्यास','Practice')}</div><div class="panel-body">${m}</div></div>`);
  return reviewBanner(r) + `<div class="notes-theme"><div class="notes-paper">${PENDING()}<div style="text-align:center;font-weight:800;font-size:20px;color:#1d4ed8;margin:4px 0 12px">${noOf(c)}. ${esc(noNum(L(c.hi, c.en)))}</div>${p.join('')}</div></div>`;
}
function dTeach(r){
  const d = r.data || {}, c = cur(), s = [];
  teachLang = currentLang === 'en' ? 'english' : currentLang === 'both' ? 'bilingual' : 'hindi';
  arr(d.teach).forEach(t => s.push(`<div class="teach-sec"><div class="teach-sec-h">🎓 ${esc(t.heading)}</div><div class="teach-text"><p>${nl(t.explain)}</p>${t.example ? `<div class="teach-ex">${nl(t.example)}</div>` : ''}</div></div>`));
  arr(d.solved).forEach((x, i) => s.push(dSolved(x, i, true)));
  const m = mcqHtml(d.practice); if (m) s.push(`<div class="teach-sec"><div class="teach-sec-h">✅ ${L('अब तुम बताओ','Your turn')}</div><div class="teach-text">${m}</div></div>`);
  const langs = [['hindi','हिंदी'],['english','English'],['bilingual','Bilingual'],['hinglish','Hinglish']];
  const sw = `<div class="lang-switcher">${langs.map(l => `<button class="lang-btn${l[0] === teachLang ? ' active' : ''}" onclick="setTeachLang('${l[0]}', this)">${l[1]}</button>`).join('')}</div>`
    + `<div class="lang-pending" id="teachPending" style="display:${teachLang === 'hindi' ? 'none' : 'block'}">${H('इस अध्याय का पाठ अभी सिर्फ़ हिंदी में है।', 'English version of this chapter is coming. The content below is shown in Hindi.')}</div>`;
  return reviewBanner(r) + `<div class="teach-theme">${sw}<div class="teach-title">${noOf(c)}. ${esc(noNum(L(c.hi, c.en)))} — ${L('क्लास में आपका स्वागत है!','welcome to the class!')}</div>${s.join('')}</div>`;
}
function dFormula(r){
  const d = r.data || {}, f = arr(d.formulas), ex = arr(d.solved), total = f.length + ex.length;
  const card = (cat, title, body, sub) => `<div class="fcard cat-basic" data-cat="${cat}"><div class="top-row"><span class="cat-chip basic">● ${esc(LEVEL_NAME)}</span><span class="counter"></span></div><div class="fcard-title">${esc(title || '')}</div><div class="formula-box-demo">${body}</div>${sub ? `<div class="fcard-sub" style="margin-top:4px">${sub}</div>` : ''}</div>`;
  const cards = f.map(x => card('formula', x.title, fx(x.formula), [x.units ? `${L('इकाई','Unit')}: ${nl(x.units)}` : '', x.note ? nl(x.note) : ''].filter(Boolean).join('<br>'))).join('')
    + ex.map((x, i) => card('example', L(`हल किया सवाल ${i + 1}`, `Solved question ${i + 1}`), lines(x.steps), nl(x.question))).join('');
  const chips = [['all', H('सभी','All'), total], ['formula', H('सूत्र','Formulas'), f.length], ['example', H('हल किए उदाहरण','Worked examples'), ex.length]].filter(x => x[0] === 'all' || x[2])
    .map(x => `<button class="filter-chip${x[0] === 'all' ? ' active' : ''}" data-filter="${x[0]}">${x[1]} (${x[2]})</button>`).join('');
  return reviewBanner(r) + PENDING() + `<div class="filter-wrap"><div class="filter-chips" id="formulaChips">${chips}</div></div><div class="cards-list" id="formulaCards">${cards}</div>`
    + `<div class="formula-note">${H('👆 ऊपर-नीचे scroll करो — filter chips sticky रहेंगी।<br>Filter दबाओ — उस category के cards दिखेंगे।', '👆 Scroll up and down — filter chips stay sticky.<br>Tap a filter to show only that category.')}</div>`;
}
let SOLVE = {};   /* chapter id -> number of step-by-step solved questions (approved; with a review code also drafts) */
function solveBtn(){
  const n = SOLVE[curCh]; if (!n) return '';
  return `<button class="lb-solve" onclick="openSolve()">✍️ ${L('स्टेप-बाय-स्टेप हल करो','Solve step by step')} <small>(${n} ${L('सवाल','questions')})</small></button>`;
}
function openSolve(){
  const q = new URLSearchParams({l:LEVEL, s:SUBJ, ch:String(curCh), ln:LEVEL_NAME, ui:currentLang === 'en' ? 'en' : 'hi'});
  if (REVIEW) q.set('review', REVIEW);
  location.href = 'solve.html?' + q.toString();
}
let loadSeq = 0;   /* only the newest chapter/tab request may draw */
async function switchTab(tab){
  if (!['book','notes','teach','formula','diagram'].includes(tab)) tab = tab === '3d' ? 'diagram' : 'notes';
  document.body.dataset.tabActive = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const box = document.getElementById('readerContent'), seq = ++loadSeq;
  renderChapBar();
  let atoms, rv = REVIEW && tab !== 'diagram';
  try { atoms = rv ? await draftFor(curCh) : await atomsFor(curCh); if (rv && !atoms) throw new Error('no draft'); } catch (e) {
    if (seq === loadSeq)
      box.innerHTML = `<div class="pending-card">${L('अध्याय नहीं खुल सका। इंटरनेट जाँचें।','Could not open the chapter. Check your internet.')}</div>`;
    return;
  }
  if (seq !== loadSeq) return;
  const sb = (tab === 'book' || tab === 'notes') ? solveBtn() : '';
  box.innerHTML = sb + (rv ? {book:dBook, notes:dNotes, teach:dTeach, formula:dFormula} : {book:bookTab, notes:notesTab, teach:teachTab, formula:formulaTab, diagram:diagramTab})[tab](atoms);
  bindMcq(box); fracify(box); if (tab === 'formula') applyFormulaFilter('all');
  window.scrollTo(0, 0); try { (document.scrollingElement || document.documentElement).scrollTop = 0; } catch (e) {}
}
document.querySelectorAll('.lang-toggle .lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
(async function load(){
  const msg = t => { const m = document.getElementById('bookLoadingMsg'); if (m) m.innerHTML = t; };
  try {
    const cat = await get('rpc/get_level_catalog?p_level=' + encodeURIComponent(LEVEL));
    SUBJECT = (cat || []).find(s => s.slug === SUBJ); if (!SUBJECT) throw new Error('subject');
    CHAPTERS = (SUBJECT.chapters || []).map(c => ({id:c.id, hi:c.hi, en:c.en, n:c.n}));
    if (REVIEW) {   /* review mode: only chapters that have a robot draft can be opened */
      const have = new Set((await post('draft_review_list', {p_code:REVIEW})).filter(x => x.level_id === LEVEL).map(x => x.chapter_id));
      CHAPTERS.forEach(c => { c.n = have.has(c.id) ? 1 : 0; });
      if (!have.size) throw new Error('no drafts');
    }
    if (!CHAPTERS.some(c => c.id === curCh && c.n)) curCh = (ready()[0] || {}).id || 0;
    if (!curCh) throw new Error('empty');
    try { SOLVE = REVIEW ? await post('solution_review_counts', {p_level:LEVEL, p_code:REVIEW}) : await post('get_level_solution_counts', {p_level:LEVEL}); } catch (e) { SOLVE = {}; }
    await switchTab(Q.get('tab') || 'notes');
    document.getElementById('bookLoading').remove();
  } catch (e) {
    msg('किताब लोड नहीं हुई। इंटरनेट जाँचें। / Could not load the book. Check your internet.<br><button onclick="location.reload()" style="margin-top:12px;padding:10px 18px;border-radius:10px;border:1px solid #5eead4;background:none;color:#5eead4;font:inherit;cursor:pointer">फिर कोशिश करें / Retry</button>');
    console.error('level book load failed', e);
  }
})();
</script>
