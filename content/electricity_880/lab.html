<!DOCTYPE html>
<html lang="hi" data-l="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electricity lab</title>
<style>
  :root{--bg:#f4f6fa;--card:#fff;--ink:#16202f;--mute:#5f6b80;--line:#dde3ec;--b:#2563eb;--o:#e8730c;--g:#15803d;--r:#dc2626;--soft:#eef3fd}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Noto Sans Devanagari",sans-serif}
  .wrap{max-width:460px;margin:0 auto;padding:6px 8px 12px}
  .top{display:flex;justify-content:space-between;align-items:center}
  .tag{font-size:12px;color:var(--mute)}
  .lang{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--ink)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
  .chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;font-size:13px;color:var(--mute)}
  .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .fig-no{font-size:12px;color:var(--b);font-weight:700;letter-spacing:.04em;margin-top:8px}
  h2{font-size:21px;margin:2px 0 4px}
  .hook{background:var(--soft);border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
  .card svg{width:100%;height:auto;display:block}
  .cap{font-size:13px;color:var(--mute);margin-top:6px;text-align:center}
  .idea{margin:8px 0;padding-left:16px} .idea li{margin:3px 0}
  .row{display:flex;align-items:center;gap:10px;margin:7px 0}
  .row label{width:112px;font-size:14px;color:var(--mute)}
  .row input{flex:1;accent-color:var(--b)} .row b{min-width:70px;text-align:right;font-size:15px}
  .seg{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
  .seg button{flex:1;min-width:80px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-size:14px;color:var(--ink)}
  .seg button.on{border-color:var(--b);color:var(--b);background:var(--soft);font-weight:600}
  .out{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .out div{background:var(--bg);border-radius:10px;padding:7px 4px;text-align:center}
  .out small{display:block;font-size:11px;color:var(--mute)} .out b{font-size:16px}
  .box{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
  .why{background:#eaf1ff;border-left:4px solid var(--b)}
  .trap{background:#fff1e4;border-left:4px solid var(--o)}
  .good{background:#e8f6ee;border-left:4px solid var(--g)}
  .q{font-weight:700;margin:14px 0 4px}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:15px;color:var(--ink)}
  .opt.right{border-color:var(--g);background:#e8f6ee} .opt.wrong{border-color:var(--r);background:#fdeaea}
  .meth{display:flex;gap:6px;margin-top:8px} .meth button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px;font-size:14px}
  .meth button.on{border-color:var(--g);color:var(--g);font-weight:600}
  .steps div{padding:4px 0;border-bottom:1px dashed var(--line)} .steps div:last-child{border:0;font-weight:700}
  .nav{position:fixed;left:0;right:0;bottom:0;background:#ffffffee;border-top:1px solid var(--line);padding:10px 14px;backdrop-filter:blur(6px)}
  .nav .in{max-width:460px;margin:0 auto;display:flex;gap:10px}
  .nav button{flex:1;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:600}
  .bk{background:#e7ebf2;color:var(--ink)} .nx{background:var(--ink);color:#fff}
  .note{font-size:12px;color:var(--mute);margin-top:16px}
  text{font-family:system-ui,"Noto Sans Devanagari",sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="tag" id="tag"></span><button class="lang" id="lang"></button></div>
  <div class="chips" id="chips"></div>
  <div id="sec"></div>
  
</div>


<script>
const _l=document.documentElement.dataset.l;let L=_l==="en"?"en":"hi",S=0;
const $=id=>document.getElementById(id);
const t=(hi,en)=>L==="hi"?hi:en;
const NS="http://www.w3.org/2000/svg";
const B="#2563eb",O="#e8730c",G="#15803d",R="#dc2626",K="#16202f",M="#5f6b80";

/* ---------- small SVG drawing helpers ---------- */
const ln=(x1,y1,x2,y2,c=K,w=2.5,ex="")=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${ex}/>`;
const tx=(x,y,s,c=K,sz=13,a="middle",wt=500)=>`<text x="${x}" y="${y}" fill="${c}" font-size="${sz}" text-anchor="${a}" font-weight="${wt}">${s}</text>`;
const resH=(x,y,w=44,c=K)=>{let d=`M${x},${y} l6,0`;const n=6,st=(w-12)/n;for(let i=0;i<n;i++)d+=` l${st/2},${i%2?6:-6} l${st/2},${i%2?-6:6}`;d+=` l6,0`;return `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`;};
const cellH=(x,y,c=K)=>ln(x,y-12,x,y+12,c,2.5)+ln(x+8,y-6,x+8,y+6,c,5);
const meter=(x,y,l,c)=>`<circle cx="${x}" cy="${y}" r="14" fill="#fff" stroke="${c}" stroke-width="2.5"/>`+tx(x,y+5,l,c,14,"middle",700);
const bulb=(x,y,glow=0,c=K)=>`<circle cx="${x}" cy="${y}" r="${12+glow*16}" fill="#ffcc4d" opacity="${(glow*0.6).toFixed(2)}"/><circle cx="${x}" cy="${y}" r="12" fill="#fff" stroke="${c}" stroke-width="2.5"/>${ln(x-8,y-8,x+8,y+8,c,2)}${ln(x-8,y+8,x+8,y-8,c,2)}`;
const arrow=(x,y,ang,c)=>`<path d="M-7,-5 L7,0 L-7,5 Z" fill="${c}" transform="translate(${x},${y}) rotate(${ang})"/>`;
const svg=(h,inner,w=340)=>`<svg viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>`;

/* ---------- interactive pieces: return {html, mount()} ---------- */
function slider(id,lab,min,max,step,val,unit){return `<div class="row"><label>${lab}</label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"><b id="${id}v"></b></div>`;}
function seg(id,opts,on=0){return `<div class="seg" id="${id}">`+opts.map((o,k)=>`<button data-k="${k}" class="${k===on?"on":""}">${o}</button>`).join("")+`</div>`;}
function segOn(id,fn){const g=$(id);g.querySelectorAll("button").forEach(b=>b.onclick=()=>{g.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");fn(+b.dataset.k);});}
const st={}; // remembers interactive state per section

const EMB={d1:"<!DOCTYPE html>\n<html lang=\"hi\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Demo 1: विद्युत धारा सिम्युलेटर<\/title>\n<style>\n  :root{--bg:#0f1420;--card:#182033;--ink:#eef2fb;--mute:#9aa6c2;--e:#4da3ff;--cur:#ff9a3d;--ok:#3ecf8e;--bad:#ff6b6b;--line:#2a3550}\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,\"Noto Sans Devanagari\",sans-serif}\n  .wrap{max-width:460px;margin:0 auto;padding:14px 14px 90px}\n  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}\n  .tag{font-size:12px;color:var(--mute)}\n  .lang{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:5px 12px;font-size:13px}\n  .dots{display:flex;gap:6px;margin:6px 0 12px}\n  .dots i{flex:1;height:4px;border-radius:4px;background:var(--line)}\n  .dots i.on{background:var(--cur)}\n  h2{font-size:20px;margin:4px 0 6px}\n  p{margin:6px 0;color:#d5dcec}\n  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}\n  svg{width:100%;height:auto;display:block}\n  .row{display:flex;align-items:center;gap:10px;margin:8px 0}\n  .row label{width:118px;font-size:14px;color:var(--mute)}\n  .row input{flex:1;accent-color:var(--cur)}\n  .row b{width:62px;text-align:right}\n  .meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}\n  .meter div{background:#111829;border-radius:10px;padding:8px;text-align:center}\n  .meter small{display:block;color:var(--mute);font-size:12px}\n  .meter b{font-size:18px}\n  .opt{display:block;width:100%;text-align:left;background:#111829;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 12px;margin:7px 0;font-size:15px}\n  .opt.right{border-color:var(--ok);background:#12301f}\n  .opt.wrong{border-color:var(--bad);background:#341619}\n  .box{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}\n  .why{background:#13243d;border-left:4px solid var(--e)}\n  .trap{background:#3a2412;border-left:4px solid var(--cur)}\n  .hidden{display:none}\n  .toggle{display:flex;gap:6px;margin-top:8px}\n  .toggle button{flex:1;background:#111829;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px;font-size:14px}\n  .toggle button.on{border-color:var(--cur);color:var(--cur)}\n  .nav{position:fixed;left:0;right:0;bottom:0;background:#0b0f19ee;border-top:1px solid var(--line);padding:10px 14px}\n  .nav .in{max-width:460px;margin:0 auto;display:flex;gap:10px}\n  .nav button{flex:1;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:600}\n  .back{background:#1d2740;color:var(--ink)} .next{background:var(--cur);color:#1b1205}\n  .note{font-size:12px;color:var(--mute);margin-top:14px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\">\n    <span class=\"tag\" data-t=\"tag\"><\/span>\n    <button class=\"lang\" id=\"lang\">English<\/button>\n  <\/div>\n  <div class=\"dots\" id=\"dots\"><\/div>\n\n  <h2 id=\"h\"><\/h2>\n  <p id=\"p\"><\/p>\n\n  <div class=\"card\">\n    <svg viewBox=\"0 0 360 220\" id=\"sim\" role=\"img\" aria-label=\"circuit\">\n      <rect x=\"30\" y=\"40\" width=\"300\" height=\"140\" rx=\"18\" fill=\"none\" stroke=\"#5b6a8f\" stroke-width=\"10\"/>\n      <!-- battery on left -->\n      <g id=\"batt\">\n        <rect x=\"14\" y=\"88\" width=\"32\" height=\"44\" rx=\"5\" fill=\"#0f1420\" stroke=\"#5b6a8f\" stroke-width=\"2\"/>\n        <line x1=\"22\" y1=\"102\" x2=\"38\" y2=\"102\" stroke=\"#ff6b6b\" stroke-width=\"4\"/>\n        <line x1=\"30\" y1=\"94\" x2=\"30\" y2=\"110\" stroke=\"#ff6b6b\" stroke-width=\"4\"/>\n        <line x1=\"22\" y1=\"120\" x2=\"38\" y2=\"120\" stroke=\"#9aa6c2\" stroke-width=\"4\"/>\n        <text x=\"54\" y=\"100\" fill=\"#ff6b6b\" font-size=\"13\">+<\/text>\n        <text x=\"54\" y=\"128\" fill=\"#9aa6c2\" font-size=\"15\">−<\/text>\n      <\/g>\n      <!-- bulb on top -->\n      <circle id=\"glow\" cx=\"180\" cy=\"40\" r=\"34\" fill=\"#ffd166\" opacity=\"0\"/>\n      <circle cx=\"180\" cy=\"40\" r=\"16\" fill=\"#0f1420\" stroke=\"#ffd166\" stroke-width=\"3\"/>\n      <path d=\"M172 40 q4 -8 8 0 q4 8 8 0\" fill=\"none\" stroke=\"#ffd166\" stroke-width=\"2\"/>\n      <!-- ammeter on bottom -->\n      <circle cx=\"180\" cy=\"180\" r=\"17\" fill=\"#0f1420\" stroke=\"#4da3ff\" stroke-width=\"3\"/>\n      <text x=\"180\" y=\"186\" fill=\"#4da3ff\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"700\">A<\/text>\n      <g id=\"dotsG\"><\/g>\n      <g id=\"arrows\"><\/g>\n      <text id=\"lbl\" x=\"180\" y=\"118\" fill=\"#9aa6c2\" font-size=\"13\" text-anchor=\"middle\"><\/text>\n    <\/svg>\n\n    <div id=\"controls\">\n      <div class=\"row\"><label data-t=\"lv\"><\/label><input id=\"v\" type=\"range\" min=\"0\" max=\"12\" step=\"1\" value=\"0\"><b id=\"vv\"><\/b><\/div>\n      <div class=\"row\"><label data-t=\"lr\"><\/label><input id=\"r\" type=\"range\" min=\"2\" max=\"24\" step=\"2\" value=\"6\"><b id=\"rv\"><\/b><\/div>\n      <div class=\"meter\">\n        <div><small data-t=\"mi\"><\/small><b id=\"mi\"><\/b><\/div>\n        <div><small data-t=\"mp\"><\/small><b id=\"mp\"><\/b><\/div>\n        <div><small data-t=\"mf\"><\/small><b>I = V/R<\/b><\/div>\n      <\/div>\n      <div class=\"toggle\" id=\"tg\">\n        <button id=\"tE\" class=\"on\" data-t=\"te\"><\/button>\n        <button id=\"tC\" data-t=\"tc\"><\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"extra\"><\/div>\n  <p class=\"note\" data-t=\"note\"><\/p>\n<\/div>\n\n<div class=\"nav\"><div class=\"in\">\n  <button class=\"back\" id=\"bk\"><\/button>\n  <button class=\"next\" id=\"nx\"><\/button>\n<\/div><\/div>\n\n<script>\nconst T={\n hi:{tag:\"डेमो 1 · विद्युत · कक्षा 10\",lv:\"वोल्टेज (V)\",lr:\"प्रतिरोध (R)\",mi:\"धारा I\",mp:\"बल्ब की शक्ति\",mf:\"सूत्र\",te:\"इलेक्ट्रॉन का बहाव\",tc:\"परंपरागत धारा\",back:\"पीछे\",next:\"आगे\",done:\"पूरा\",note:\"यह डेमो DeepSeek के idea 'Current Flow Simulator' पर आधारित है। Physics जाँच कर सुधारा गया है।\",\n  s:[\n   {h:\"स्विच दबाते ही बल्ब तुरंत जलता है। पर इलेक्ट्रॉन तो बहुत धीरे चलते हैं। ऐसा कैसे?\",p:\"पहले अंदाज़ा लगाइए, फिर आगे देखिए।\",q:{o:[\"इलेक्ट्रॉन प्रकाश की गति से दौड़ते हैं\",\"तार में इलेक्ट्रॉन पहले से भरे हैं, सब एक साथ खिसकने लगते हैं\",\"बैटरी से बल्ब तक पहुँचने वाला पहला इलेक्ट्रॉन ही बल्ब जलाता है\"],a:1,w:\"तार में मुक्त इलेक्ट्रॉन हर जगह पहले से मौजूद हैं। बैटरी जुड़ते ही पूरे तार में विद्युत क्षेत्र लगभग तुरंत बन जाता है, इसलिए हर जगह के इलेक्ट्रॉन एक साथ खिसकने लगते हैं। इलेक्ट्रॉन खुद मिलीमीटर प्रति सेकंड के क्रम की धीमी गति से चलते हैं।\"}},\n   {h:\"बिना बैटरी: इलेक्ट्रॉन इधर-उधर घूमते हैं\",p:\"वोल्टेज 0 है। इलेक्ट्रॉन हिलते तो हैं, पर किसी एक दिशा में नहीं जाते। इसलिए नेट धारा शून्य है और बल्ब बंद है।\",lock:0},\n   {h:\"वोल्टेज बढ़ाइए: बहाव शुरू\",p:\"V स्लाइडर बढ़ाइए। इलेक्ट्रॉन एक दिशा में खिसकने लगते हैं, ammeter धारा दिखाता है, और बल्ब चमकता है। R बढ़ाएँगे तो धारा घटेगी।\"},\n   {h:\"किस दिशा में? दो अलग तीर\",p:\"इलेक्ट्रॉन बैटरी के − से + की ओर बहते हैं। परंपरागत धारा को उल्टी दिशा, + से − की ओर, माना जाता है। दोनों बटन दबाकर देखिए।\",showToggle:1},\n   {h:\"याद रखने वाली बात\",p:\"\",box:1},\n   {h:\"अब आपकी बारी\",p:\"\",mcq:{q:\"6 V की बैटरी से 3 Ω का प्रतिरोध जुड़ा है। धारा कितनी होगी?\",o:[\"18 A\",\"2 A\",\"0.5 A\",\"3 A\"],a:1,w:\"I = V/R = 6/3 = 2 A\",tr:\"18 A वाला विकल्प V और R को गुणा करने से आता है। ओम का नियम भाग देता है: I = V ÷ R।\",alt:\"दूसरा तरीका (अनुपात): 3 Ω में 3 V पर 1 A बहता है। 6 V यानी दुगुना वोल्टेज, तो धारा भी दुगुनी = 2 A।\"}}\n  ],\n  why:\"<b>क्यों:<\/b> धारा = प्रति सेकंड किसी बिंदु से गुज़रा आवेश (I = Q/t)। इलेक्ट्रॉन धीरे चलते हैं, पर उनकी संख्या बहुत बड़ी है।\",\n  trap:\"<b>आम गलती:<\/b> 'इलेक्ट्रॉन + से − की ओर बहते हैं।' नहीं, इलेक्ट्रॉन − से + की ओर बहते हैं। + से − वाली दिशा परंपरागत धारा की है।\",\n  ok:\"सही!\",no:\"फिर से सोचिए।\",alt:\"दूसरा तरीका\"},\n en:{tag:\"Demo 1 · Electricity · Class 10\",lv:\"Voltage (V)\",lr:\"Resistance (R)\",mi:\"Current I\",mp:\"Bulb power\",mf:\"Formula\",te:\"Electron flow\",tc:\"Conventional current\",back:\"Back\",next:\"Next\",done:\"Done\",note:\"This demo is based on DeepSeek's idea 'Current Flow Simulator'. Its physics was checked and corrected.\",\n  s:[\n   {h:\"Press the switch and the bulb lights at once. But electrons move very slowly. How?\",p:\"Guess first, then look further.\",q:{o:[\"Electrons race at the speed of light\",\"Free electrons already fill the wire and all start drifting together\",\"The first electron that reaches the bulb from the battery lights it\"],a:1,w:\"Free electrons are already everywhere in the wire. When the battery is connected, the electric field sets up through the whole wire almost at once, so electrons everywhere start drifting together. The electrons themselves drift slowly, of the order of a millimetre per second.\"}},\n   {h:\"No battery: electrons wander at random\",p:\"Voltage is 0. Electrons jiggle but do not move in one direction, so net current is zero and the bulb is off.\",lock:0},\n   {h:\"Raise the voltage: the drift begins\",p:\"Move the V slider. Electrons start drifting one way, the ammeter shows current, the bulb glows. Raise R and the current falls.\"},\n   {h:\"Which direction? Two different arrows\",p:\"Electrons flow from the battery's − to +. Conventional current is taken the opposite way, from + to −. Tap both buttons.\",showToggle:1},\n   {h:\"Remember this\",p:\"\",box:1},\n   {h:\"Your turn\",p:\"\",mcq:{q:\"A 3 Ω resistor is connected to a 6 V battery. What is the current?\",o:[\"18 A\",\"2 A\",\"0.5 A\",\"3 A\"],a:1,w:\"I = V/R = 6/3 = 2 A\",tr:\"18 A comes from multiplying V and R. Ohm's law divides: I = V ÷ R.\",alt:\"Second method (ratio): through 3 Ω, 3 V drives 1 A. 6 V is double the voltage, so current doubles = 2 A.\"}}\n  ],\n  why:\"<b>Why:<\/b> current = charge passing a point per second (I = Q/t). Electrons are slow, but there are a huge number of them.\",\n  trap:\"<b>Common mistake:<\/b> 'Electrons flow from + to −.' No, electrons flow from − to +. The + to − direction is conventional current.\",\n  ok:\"Correct!\",no:\"Think again.\",alt:\"Second method\"}\n};\nlet L=\"hi\",S=0,mode=\"e\";\nconst $=id=>document.getElementById(id);\nconst V=$(\"v\"),R=$(\"r\");\n// path around the loop: rectangle x30..330, y40..180\nconst P={x0:30,y0:40,x1:330,y1:180};\nconst per=2*((P.x1-P.x0)+(P.y1-P.y0));\nfunction pt(s){s=((s%per)+per)%per;const w=P.x1-P.x0,h=P.y1-P.y0;\n if(s<w)return[P.x0+s,P.y0];s-=w;if(s<h)return[P.x1,P.y0+s];s-=h;if(s<w)return[P.x1-s,P.y1];s-=w;return[P.x0,P.y1-s];}\nconst N=34,el=[];\nfor(let i=0;i<N;i++){const c=document.createElementNS(\"http://www.w3.org/2000/svg\",\"circle\");c.setAttribute(\"r\",\"3.4\");c.setAttribute(\"fill\",\"#4da3ff\");$(\"dotsG\").appendChild(c);el.push({c,s:i*per/N,j:Math.random()*6});}\nfunction I(){const v=+V.value,r=+R.value;return v/r;}\nfunction draw(){const i=I(),v=+V.value,r=+R.value;\n $(\"vv\").textContent=v+\" V\";$(\"rv\").textContent=r+\" Ω\";\n $(\"mi\").textContent=i.toFixed(2)+\" A\";$(\"mp\").textContent=(v*v/r).toFixed(1)+\" W\";\n $(\"glow\").setAttribute(\"opacity\",Math.min(0.85,(v*v/r)/24).toFixed(2));\n const ar=$(\"arrows\");ar.innerHTML=\"\";\n if(i>0&&S>=3){const col=mode===\"e\"?\"#4da3ff\":\"#ff9a3d\";\n   // electrons: battery − (bottom-left) → around → + ; we move dots clockwise from bottom-left upward? choose: electrons leave − (lower terminal) going down-left corner → bottom → right → top → back to +\n   const dirE=-1; const dir=mode===\"e\"?dirE:-dirE;\n   [[100,40],[330,110],[260,180],[30,150]].forEach(([x,y],k)=>{\n     let ang=[0,90,180,270][k]; if(dir<0)ang+=180;\n     const g=document.createElementNS(\"http://www.w3.org/2000/svg\",\"path\");\n     g.setAttribute(\"d\",\"M-9,-7 L9,0 L-9,7 Z\");g.setAttribute(\"fill\",col);\n     g.setAttribute(\"transform\",`translate(${x},${y}) ro /* F4: Ohm's law graph */
{h:()=>t("ओम का नियम: V-I ग्राफ","Ohm's law: the V-I graph"),
 hook:()=>t("एक ही वोल्टेज पर कोई तार ज़्यादा धारा क्यों देता है, कोई कम?","At the same voltage, why does one wire pass more current than another?"),
 idea:()=>[t("तापमान स्थिर हो तो V = IR: धारा, वोल्टेज के अनुक्रमानुपाती है।","At fixed temperature V = IR: current is proportional to voltage."),t("V-I ग्राफ मूल बिंदु से सीधी रेखा। ढलान (V/I) = R।","The V-I graph is a straight line through the origin. Slope (V/I) = R.")],
 fig:()=>{const Rv=st.f4??4;const X=(i)=>40+i*200,Y=(v)=>170-v*12;
   let s=ln(40,170,310,170,K,2)+ln(40,170,40,20,K,2)+tx(318,166,"I (A)",B,13,"end",700)+tx(32,22,"V (V)",O,13,"end",700);
   for(let v=0;v<=12;v+=4)s+=tx(32,Y(v)+4,v,M,11,"end")+ln(40,Y(v),310,Y(v),"#eef1f6",1);
   for(let i=0;i<=1;i+=0.25)s+=tx(X(i),186,i,M,11);
   const iMax=Math.min(1.25,12/Rv);s+=ln(X(0),Y(0),X(iMax),Y(iMax*Rv),B,3.5);
   [0.25,0.5,0.75,1].forEach(i=>{if(i*Rv<=12)s+=`<circle cx="${X(i)}" cy="${Y(i*Rv)}" r="4.5" fill="${O}"/>`;});
   s+=tx(X(iMax)-4,Y(iMax*Rv)-10,"R = "+Rv+" Ω",B,14,"end",700);
   return {html:svg(198,s)+slider("f4r",t("प्रतिरोध R","Resistance R"),2,16,2,Rv),cap:t("R बढ़ाइए: रेखा खड़ी होती है, यानी उतने ही V पर कम I।","Raise R: the line gets steeper, so less I at the same V."),
     mount:()=>{$("f4rv").textContent=Rv+" Ω";$("f4r").oninput=e=>{st.f4=+e.target.value;render();};}};},
 why:()=>t("<b>क्यों:</b> रेखा का हर बिंदु एक जोड़ी (I, V) है, और हर बिंदु पर V/I एक ही रहता है। वही R है।","<b>Why:</b> each point is a pair (I, V), and V/I is the same at every point. That is R."),
 trap:()=>t("<b>आम गलती:</b> ढलान को 1/R समझना। यहाँ V ऊपर (y-अक्ष) है, इसलिए ढलान = R। अगर I ऊपर हो, तब ढलान = 1/R।","<b>Common mistake:</b> reading the slope as 1/R. Here V is on the y-axis, so slope = R. If I were on the y-axis, slope would be 1/R."),
 mcq:{q:()=>t("ग्राफ की रेखा (0.5 A, 4 V) से गुज़रती है। R कितना है?","The line passes through (0.5 A, 4 V). What is R?"),o:()=>["2 Ω","8 Ω","0.125 Ω","4.5 Ω"],a:1,
  A:()=>["R = V / I","R = 4 / 0.5","R = 8 Ω"],B:()=>[t("0.5 A पर 4 V","4 V at 0.5 A"),t("1 A यानी दुगुनी धारा → दुगुना V = 8 V","1 A means double current → double V = 8 V"),t("1 A पर 8 V, तो R = 8 Ω","8 V per 1 A, so R = 8 Ω")],
  tr:()=>t("2 Ω, V × I से आता है; 0.125 Ω, I ÷ V से। सही है V ÷ I।","2 Ω comes from V × I; 0.125 Ω from I ÷ V. The right one is V ÷ I.")}},

/* F5: resistivity */
{h:()=>t("प्रतिरोध किन बातों पर निर्भर है","What resistance depends on"),
 hook:()=>t("हीटर में पतला लंबा तार क्यों, और घर की वायरिंग में मोटा तांबा क्यों?","Why does a heater use thin long wire, and house wiring thick copper?"),
 idea:()=>[t("R = ρ L / A: लंबाई L बढ़े तो R बढ़े, मोटाई (क्षेत्रफल A) बढ़े तो R घटे।","R = ρL/A: longer L raises R, thicker (larger area A) lowers R."),t("ρ (प्रतिरोधकता) पदार्थ पर निर्भर है: तांबा कम, नाइक्रोम बहुत ज़्यादा।","ρ (resistivity) depends on the material: copper low, nichrome very high.")],
 fig:()=>{const s0=st.f5||{L:2,d:0.5,m:0};const rho=[1.7e-8,1.1e-6][s0.m];const A=Math.PI*Math.pow(s0.d*1e-3/2,2);const Rr=rho*s0.L/A;

   let s=`<rect x="20" y="${70-th/2}" width="${len}" height="${th}" rx="${th/2}" fill="${col}" opacity=".85"/>`
    +ln(20,110,20+len,110,M,1.5)+ln(20,104,20,116,M,1.5)+ln(20+len,104,20+len,116,M,1.5)+tx(20+len/2,128,"L = "+s0.L+" m",M,12)
    +tx(30+len,74,"d = "+s0.d+" mm",M,12,"start");
   const Rs=Rr>=1?Rr.toFixed(2):Rr.toFixed(3);
   s+=`<rect x="70" y="146" width="200" height="38" rx="10" fill="#f4f6fa"/>`+tx(170,171,"R = "+Rs+" Ω",col,18,"middle",700);
   return {html:svg(196,s)+seg("f5m",[t("तांबा","Copper"),t("नाइक्रोम","Nichrome")],s0.m)+slider("f5l",t("लंबाई L","Length L"),1,10,1,s0.L)+slider("f5d",t("मोटाई d","Thickness d"),0.2,1,0.1,s0.d),
     cap:t("लंबाई, मोटाई और पदार्थ बदलकर R पर असर देखिए।","Change length, thickness and material to see R change."),
     mount:()=>{$("f5lv").textContent=s0.L+" m";$("f5dv").textContent=s0.d+" mm";
       segOn("f5m",v=>{st.f5={...s0,m:v};render();});
       $("f5l").oninput=e=>{st.f5={...s0,L:+e.target.value};render();};$("f5d").oninput=e=>{st.f5={...s0,d:+(+e.target.value).toFixed(1)};render();};}};},
 why:()=>t("<b>क्यों:</b> लंबे तार में इलेक्ट्रॉनों को ज़्यादा टक्करें मिलती हैं; मोटे तार में चलने के रास्ते ज़्यादा होते हैं।","<b>Why:</b> a longer wire gives electrons more collisions; a thicker wire gives them more paths."),
 trap:()=>t("<b>आम गलती:</b> 'मोटे तार में इलेक्ट्रॉन तेज़ चलते हैं।' नहीं: मोटे तार में ज़्यादा इलेक्ट्रॉन साथ चलते हैं, इसलिए धारा ज़्यादा।","<b>Common mistake:</b> 'electrons move faster in a thick wire.' No: more electrons move together, so the current is larger."),
 mcq:{q:()=>t("एक तार को खींचकर दुगुना लंबा कर दिया (आयतन वही)। R कितना होगा?","A wire is stretched to double its length (same volume). What happens to R?"),o:()=>[t("वही","Same"),t("2 गुना","2 times"),t("4 गुना","4 times"),t("आधा","Half")],a:2,
  A:()=>["R = ρL/A",t("L → 2L, आयतन वही इसलिए A → A/2","L → 2L; same volume so A → A/2"),t("R → ρ(2L)/(A/2) = 4R","R → ρ(2L)/(A/2) = 4R")],B:()=>[t("सिर्फ़ लंबाई से: 2 गुना","From length alone: ×2"),t("पतला होने से: और 2 गुना","From thinning: another ×2"),t("कुल 2 × 2 = 4 गुना","Total 2 × 2 = 4 times")],
  tr:()=>t("'2 गुना' चुनना आम है: लंबाई देखी, पर पतला होना भूल गए।","Choosing '2 times' is common: you saw the length but forgot the thinning.")}},

{h:()=>t("श्रेणी बनाम समानांतर","Series vs parallel"),

   s+=tx(80,172,"I = "+Is.toFixed(2)+" A",B,13,"middle",700)+tx(80,190,t("हर बल्ब ","each ")+Ps.toFixed(2)+" W",O,13,"middle",700);
   // parallel right

   for(let i=0;i<n;i++){const x=225+i*(85/(n>1?n-1:1))*(n>1?1:0)+(n===1?40:0);s+=ln(x,top,x,bot,K,2)+`<rect x="${x-14}" y="76" width="28" height="28" fill="#fff"/>`+bulb(x,90,gp);}
   s+=tx(255,172,"I = "+Ip.toFixed(2)+" A",B,13,"middle",700)+tx(255,190,t("हर बल्ब ","each ")+Pp.toFixed(2)+" W",O,13,"middle",700);
   return {html:svg(198,s)+seg("f6n",[t("1 बल्ब","1 bulb"),t("2 बल्ब","2 bulbs"),t("3 बल्ब","3 bulbs")],n-1),
     cap:t("6 V बैटरी, हर बल्ब 12 Ω। बल्ब जोड़ते जाइए और चमक देखिए।","6 V battery, each bulb 12 Ω. Add bulbs and watch the brightness."),mount:()=>segOn("f6n",v=>{st.f6=v+1;render();})};},
 why:()=>t("<b>क्यों:</b> समानांतर में हर बल्ब पूरे 6 V से जुड़ा है, इसलिए एक बल्ब जोड़ने से दूसरे पर फ़र्क नहीं पड़ता। एक बल्ब फ्यूज़ हो तो बाकी जलते रहते हैं।","<b>Why:</b> in parallel each bulb sits across the full 6 V, so adding one does not affect the others. If one fuses, the rest stay on."),
 trap:()=>t("<b>आम गलती:</b> 'प्रतिरोध जोड़ने से कुल धारा हमेशा घटती है।' समानांतर में जोड़ने पर कुल प्रतिरोध घटता है और कुल धारा बढ़ती है।","<b>Common mistake:</b> 'adding a resistor always lowers the current.' In parallel, total resistance falls and total current rises."),
 mcq:{q:()=>t("4 Ω और 4 Ω समानांतर में 6 V से जुड़े हैं। कुल धारा?","4 Ω and 4 Ω in parallel across 6 V. Total current?"),o:()=>["0.75 A","1.5 A","3 A","12 A"],a:2,
  A:()=>["1/R = 1/4 + 1/4 = 1/2","R = 2 Ω","I = 6 / 2 = 3 A"],B:()=>[t("हर शाखा पर पूरे 6 V","Each branch has the full 6 V"),t("हर शाखा: 6 / 4 = 1.5 A","Each branch: 6 / 4 = 1.5 A"),t("कुल: 1.5 + 1.5 = 3 A","Total: 1.5 + 1.5 = 3 A")],
  tr:()=>t("0.75 A श्रेणी वाला उत्तर है (8 Ω)। 1.5 A सिर्फ़ एक शाखा की धारा है।","0.75 A is the series answer (8 Ω). 1.5 A is only one branch.")}},

/* F7: heating */
{h:()=>t("धारा का तापीय प्रभाव","Heating effect of current"),
 hook:()=>t("हीटर का तार लाल हो जाता है, पर उससे जुड़ी तार ठंडी क्यों रहती है?","The heater coil glows red, so why does its cord stay cool?"),
 idea:()=>[t("ऊष्मा H = I²Rt = VIt = (V²/R)t। सभी सही हैं, जो मान दिए हों वही लगाइए।","Heat H = I²Rt = VIt = (V²/R)t. All are correct; use the one that fits the data."),t("एक ही धारा में, जहाँ R बड़ा वहाँ गर्मी ज़्यादा।","With the same current, more heat where R is larger.")],

   s+=`<rect x="178" y="140" width="150" height="52" rx="10" fill="#f4f6fa"/>`+tx(253,160,t("तार: R = 0.1 Ω","cord: R = 0.1 Ω"),K,12)+tx(253,180,Hw.toFixed(1)+t(" J हर सेकंड"," J each second"),B,13,"middle",700);
   return {html:svg(200,s)+slider("f7p",t("हीटर की शक्ति","Heater power"),500,2000,250,P),cap:t("230 V पर, धारा I = "+I.toFixed(2)+" A, दोनों में बराबर।","At 230 V the current I = "+I.toFixed(2)+" A is the same in both."),
     mount:()=>{$("f7pv").textContent=P+" W";$("f7p").oninput=e=>{st.f7=+e.target.value;render();};}};},
 why:()=>t("<b>क्यों:</b> कुंडली और तार श्रेणी में हैं, तो धारा बराबर है। H = I²Rt में R बड़ा होने से कुंडली सैकड़ों गुना ज़्यादा गर्म होती है।","<b>Why:</b> coil and cord are in series, so the current is equal. In H = I²Rt the much larger R makes the coil hundreds of times hotter."),

 why:()=>t("<b>क्यों:</b> MCB लाइव तार में है, इसलिए गिरते ही पूरा परिपथ बिजली से कट जाता है। अर्थ तार धातु के खोल से रिसी धारा को ज़मीन में भेजकर झटके से बचाता है।","<b>Why:</b> the MCB is in the live wire, so when it trips the whole circuit is cut off. The earth wire sends leaked current from a metal body into the ground and prevents a shock."),

function mcq(m,box){const holder=document.createElement("div");holder.innerHTML=`<div class="q">${t("अब आपकी बारी: ","Your turn: ")}${m.q()}</div>`;
 const opts=m.o();opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=o;
  b.onclick=()=>{holder.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j===m.a)x.classList.add("right");});if(k!==m.a)b.classList.add("wrong");
   const r=document.createElement("div");
   const tabs=m.B?`<div class="meth"><button class="on" data-m="A">${t("तरीका A: सूत्र","Method A: formula")}</button><button data-m="B">${t("तरीका B: अनुपात/तर्क","Method B: ratio/logic")}</button></div>`:"";
   r.innerHTML=`<div class="box ${k===m.a?"good":"trap"}"><b>${k===m.a?t("सही!","Correct!"):t("फिर से सोचिए।","Think again.")}</b></div>${tabs}<div class="box why steps" id="stp"></div><div class="box trap">${m.tr()}</div>`;
   holder.appendChild(r);const show=w=>{r.querySelector("#stp").innerHTML=(w==="B"?m.B():m.A()).map(x=>`<div>${x}</div>`).join("");};show("A");
   r.querySelectorAll(".meth button").forEach(bt=>bt.onclick=()=>{r.querySelectorAll(".meth button").forEach(x=>x.classList.remove("on"));bt.classList.add("on");show(bt.dataset.m);});};
  holder.appendChild(b);});box.appendChild(holder);}
