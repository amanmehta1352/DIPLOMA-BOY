name: Robot route test v3 (4 chapters)
# v3: motion, gravitation, work_energy, sound with the v2 pipeline.
# Writes FILES only (content/generated/...) and commits them back to this branch. Never touches the database. Keys are never printed.
# Starts when robots/route/trigger_v3.txt changes on content-fill-database.
on:
  push:
    branches: [content-fill-database]
    paths: ['robots/route/trigger_v3.txt']
permissions:
  contents: write
concurrency: route-test-v3
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Self-test
        run: python robots/route/run_chapters.py --selftest
      - name: Run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python robots/route/run_chapters.py
      - name: Commit the generated files back (no database write)
        if: always()
        run: |
          git config user.name "route-test robot"
          git config user.email "robot@users.noreply.github.com"
          git add content/generated
          git diff --cached --quiet || git commit -m "robot route test output (draft, not published)"
          git pull --rebase origin content-fill-database
          git push origin HEAD:content-fill-database
