name: DeepSeek ideas
# Runs only on the deepseek-ideas branch. Writes only robots/ideas/out/. No database, no app files.
on:
  push:
    branches: [deepseek-ideas]
    paths: ['robots/ideas/prompt.md', 'robots/ideas/brief.md', '.github/workflows/deepseek-ideas.yml']
permissions:
  contents: write
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 robots/ideas/ask_deepseek.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - run: |
          git config user.name deepseek-ideas
          git config user.email deepseek-ideas@users.noreply.github.com
          git add robots/ideas/out
          git commit -m "DeepSeek ideas result [skip ci]" && git push
