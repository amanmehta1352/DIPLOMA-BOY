<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<title>Diploma Boy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--bg:#F5F7FA;--card:#FFFFFF;--ink:#14213D;--muted:#5B6578;--line:#E3E8EF;--brand:#1F4E79;--accent:#E07A1F;--ok:#2E8B57;--soft:#EAF1F8;--r:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1420;--card:#172033;--ink:#EEF2F8;--muted:#9AA5B8;--line:#26324A;--brand:#7FB2E5;--accent:#F0A35E;--ok:#5FD39A;--soft:#1D2A44}}
:root[data-theme="dark"]{--bg:#0E1420;--card:#172033;--ink:#EEF2F8;--muted:#9AA5B8;--line:#26324A;--brand:#7FB2E5;--accent:#F0A35E;--ok:#5FD39A;--soft:#1D2A44}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans Devanagari",Inter,system-ui,sans-serif;font-size:16px;line-height:1.55;min-height:100vh;padding-bottom:84px;overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.logo{font-weight:700;color:var(--brand);font-size:18px}
.logo small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
h1{font-size:22px;margin:12px 0 4px}
h2{font-size:17px;margin:20px 0 8px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-height:64px}
.tile.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--soft) inset}
.tile b{display:block;font-size:15px}
.tile span{color:var(--muted);font-size:13px}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer;padding:10px 14px}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--brand);white-space:nowrap}
.tag.soon{color:var(--accent);background:transparent;border:1px solid var(--accent)}
.tag.done{color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:12px;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.right{border-color:var(--ok);background:rgba(46,139,87,.12)}
.opt.wrong{border-color:#C0392B}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
.dock button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:8px 0;min-height:48px;cursor:pointer}
.dock button.on{color:var(--brand);font-weight:700}
.muted{color:var(--muted)}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="logo">Diploma Boy<small id="tag"></small></div>
  <div class="seg" role="group" aria-label="Language">
    <button data-lang="hi">हिं</button><button data-lang="both">दोनों</button><button data-lang="en">EN</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<nav class="dock" id="dock"></nav>

<script>
/* ---------- DATA (config-only: add exams/subjects here, nothing else changes) ---------- */
const DATA = {
  branches: [
    {id:'mechanical', hi:'मैकेनिकल', en:'Mechanical'},
    {id:'civil', hi:'सिविल', en:'Civil'},
    {id:'electrical', hi:'इलेक्ट्रिकल', en:'Electrical'},
    {id:'electronics', hi:'इलेक्ट्रॉनिक्स', en:'Electronics'},
    {id:'computer', hi:'कंप्यूटर / आईटी', en:'Computer / IT'}
  ],
  // common = सभी ब्रांच के लिए; branch = सिर्फ़ उस ब्रांच के लिए
  subjects: [
    {id:'maths', hi:'गणित', en:'Maths', branch:null},
    {id:'reasoning', hi:'रीज़निंग', en:'Reasoning', branch:null},
    {id:'gs', hi:'सामान्य विज्ञान', en:'General Science', branch:null},
    {id:'ga', hi:'सामान्य जागरूकता', en:'General Awareness', branch:null},
    {id:'mech-thermo', hi:'थर्मोडायनामिक्स', en:'Thermodynamics', branch:'mechanical'},
    {id:'civil-survey', hi:'सर्वेक्षण', en:'Surveying', branch:'civil'},
    {id:'elec-circuits', hi:'इलेक्ट्रिक सर्किट', en:'Electric Circuits', branch:'electrical'},
    {id:'ec-analog', hi:'एनालॉग इलेक्ट्रॉनिक्स', en:'Analog Electronics', branch:'electronics'},
    {id:'cs-prog', hi:'प्रोग्रामिंग', en:'Programming', branch:'computer'}
  ],
  exams: [
    {id:'rrb-je-cbt1', hi:'आरआरबी जेई — सीबीटी 1', en:'RRB JE — CBT 1', branches:['mechanical','civil','electrical','electronics','computer'], ready:true},
    {id:'ssc-je', hi:'एसएससी जेई', en:'SSC JE', branches:['mechanical','civil','electrical'], ready:false},
    {id:'isro', hi:'इसरो', en:'ISRO', branches:['electronics','computer','electrical'], ready:false},
    {id:'drdo', hi:'डीआरडीओ', en:'DRDO', branches:['electronics','computer','mechanical'], ready:false}
  ],
  // सैंपल सवाल — असली PYQ सिर्फ़ आधिकारिक स्रोत से आएँगे (kind: 'practice' अभी के लिए)
  questions: [
    {id:'q1', subject:'maths', kind:'practice', hi:'किसी संख्या का 20% 40 है, संख्या क्या है?', en:'20% of a number is 40. What is the number?', o:['100','200','80','20'], a:1},
    {id:'q2', subject:'reasoning', kind:'practice', hi:'श्रृंखला: 2, 4, 8, ? अगला अंक क्या है?', en:'Series: 2, 4, 8, ? Next number?', o:['12','16','10','14'], a:1},
    {id:'q3', subject:'mech-thermo', kind:'practice', hi:'आदर्श गैस समीकरण क्या है?', en:'What is the ideal gas equation?', o:['PV = nRT','F = ma','V = IR','E = mc²'], a:0},
    {id:'q4', subject:'elec-circuits', kind:'practice', hi:'ओम का नियम क्या है?', en:"What is Ohm's law?", o:['V = IR','P = IV²','F = qE','v = u+at'], a:0}
  ]
};

/* ---------- STATE (per device; no secrets; wrapped in try/catch) ---------- */
const KEY='diploma-boy-v1';
let S={lang:'both', branch:null, exam:null, tab:'home', progress:{}, subj:null, qi:0, picked:null, score:{c:0,t:0}};
try{Object.assign(S, JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
function save(){try{localStorage.setItem(KEY, JSON.stringify({lang:S.lang,branch:S.branch,exam:S.exam,progress:S.progress}))}catch(e){}}

/* ---------- HELPERS ---------- */
const T=(o)=> S.lang==='hi'?o.hi : S.lang==='en'?o.en : (o.hi+' · '+o.en);
const $=(s)=>document.querySelector(s);
const byId=(arr,id)=>arr.find(x=>x.id===id);
function subjectsFor(branch){return DATA.subjects.filter(s=>s.branch===null || s.branch===branch)}
function examsFor(branch){return DATA.exams.filter(e=>e.branches.includes(branch))}
function examSubjects(branch){return subjectsFor(branch)}
function pct(subj){const p=S.progress[subj]||{c:0,t:0};return p.t?Math.round(p.c/p.t*100):0}

/* ---------- VIEWS ---------- */
function viewOnboard(){
  return `<h1>${S.lang==='en'?'Choose your branch':'अपनी ब्रांच चुनें'}</h1>
  <p class="sub">${S.lang==='en'?'You can change this later in Profile. Your progress stays.':'बाद में प्रोफ़ाइल में बदल सकते हैं। आपकी प्रगति सुरक्षित रहेगी।'}</p>
  <div class="grid">${DATA.branches.map(b=>`<button class="tile" data-act="pick-branch" data-id="${b.id}"><b>${T(b)}</b><span>${S.lang==='en'?'Diploma':'डिप्लोमा'}</span></button>`).join('')}</div>`;
}
function viewHome(){
  const b=byId(DATA.branches,S.branch);
  const exams=examsFor(S.branch);
  const subs=subjectsFor(S.branch);
  const total=subs.reduce((a,s)=>a+ (S.progress[s.id]?.t||0),0);
  return `<h1>${S.lang==='en'?'Hello':'नमस्ते'} · ${T(b)}</h1>
  <p class="sub">${S.lang==='en'?'Your exams for this branch':'इस ब्रांच की परीक्षाएँ'}</p>
  <div class="card"><b>${S.lang==='en'?'Today':'आज'}</b>
    <p class="muted" style="margin:6px 0 10px">${total?(S.lang==='en'?'Keep going: ':'आगे बढ़ें: ')+total+' '+(S.lang==='en'?'answered':'सवाल हल'):(S.lang==='en'?'Start with 5 questions in Maths':'गणित के 5 सवाल से शुरू करें')}</p>
    <button class="btn" data-act="go-practice">${S.lang==='en'?'Start practice':'अभ्यास शुरू करें'}</button></div>
  ${exams.map(e=>`<div class="card"><div class="row" style="border:0;padding:0"><b>${T(e)}</b><span class="tag ${e.ready?'':'soon'}">${e.ready?(S.lang==='en'?'Ready':'तैयार'):(S.lang==='en'?'Coming soon':'जल्द')}</span></div>
    ${e.ready?`<button class="btn ghost" style="margin-top:10px" data-act="open-exam" data-id="${e.id}">${S.lang==='en'?'Open':'खोलें'}</button>`:''}</div>`).join('')}`;
}
function viewExam(){
  const e=byId(DATA.exams,S.exam);
  const subs=subjectsFor(S.branch);
  return `<button class="btn ghost" data-act="go-home" style="width:auto;margin-bottom:8px">← ${S.lang==='en'?'Back':'वापस'}</button>
  <h1>${T(e)}</h1>
  <p class="sub">${S.lang==='en'?'Common subjects + your branch subjects':'सामान्य विषय + आपकी ब्रांच के विषय'}</p>
  <div class="card">${subs.map(s=>`<div class="row"><div style="flex:1"><b>${T(s)}</b> <span class="tag ${s.branch?'':''}">${s.branch?(S.lang==='en'?'Branch':'ब्रांच'):(S.lang==='en'?'Common':'सामान्य')}</span>
    <div class="bar"><i style="width:${pct(s.id)}%"></i></div></div>
    <button class="btn" style="width:auto;padding:8px 14px" data-act="start-subj" data-id="${s.id}">${S.lang==='en'?'Practice':'अभ्यास'}</button></div>`).join('')}</div>`;
}
function viewPractice(){
  const subs=subjectsFor(S.branch);
  const list=DATA.questions.filter(q=>subs.some(s=>s.id===q.subject));
  if(!S.subj){
    return `<h1>${S.lang==='en'?'Practice':'अभ्यास'}</h1><p class="sub">${S.lang==='en'?'Sample questions. Real PYQ come only from official papers.':'नमूना सवाल। असली PYQ सिर्फ़ आधिकारिक पेपर से आएँगे।'}</p>
    <div class="card">${subs.map(s=>`<div class="row"><b>${T(s)}</b><button class="btn" style="width:auto;padding:8px 14px" data-act="start-subj" data-id="${s.id}">${S.lang==='en'?'Start':'शुरू'}</button></div>`).join('')}</div>`;
  }
  const qs=list.filter(q=>q.subject===S.subj);
  if(!qs.length) return `<h1>${T(byId(DATA.subjects,S.subj))}</h1><div class="card muted">${S.lang==='en'?'Questions coming soon for this subject.':'इस विषय के सवाल जल्द आएँगे।'}</div><button class="btn ghost" data-act="back-practice">${S.lang==='en'?'Back':'वापस'}</button>`;
  const q=qs[S.qi%qs.length];
  return `<button class="btn ghost" data-act="back-practice" style="width:auto;margin-bottom:8px">← ${S.lang==='en'?'Subjects':'विषय'}</button>
  <div class="card"><span class="tag">${q.kind==='pyq'?'PYQ':'Practice'}</span>
  <p style="font-size:17px;margin:10px 0">${T(q)}</p>
  ${q.o.map((o,i)=>`<button class="opt ${S.picked!==null?(i===q.a?'right':(i===S.picked?'wrong':'')):''}" data-act="pick" data-i="${i}" ${S.picked!==null?'disabled':''}><b>${'ABCD'[i]}</b> ${o}</button>`).join('')}
  ${S.picked!==null?`<button class="btn" style="margin-top:10px" data-act="next">${S.lang==='en'?'Next':'अगला'}</button>`:''}
  <p class="muted" style="margin-top:12px">${S.lang==='en'?'Score':'स्कोर'}: ${S.score.c}/${S.score.t}</p></div>`;
}
function viewProgress(){
  const subs=subjectsFor(S.branch);
  return `<h1>${S.lang==='en'?'Progress':'प्रगति'}</h1><div class="card">${subs.map(s=>{const p=S.progress[s.id]||{c:0,t:0};return `<div class="row"><div style="flex:1"><b>${T(s)}</b><div class="bar"><i style="width:${pct(s.id)}%"></i></div></div><span class="muted">${p.c}/${p.t}</span></div>`}).join('')}</div>`;
}
function viewProfile(){
  return `<h1>${S.lang==='en'?'Profile':'प्रोफ़ाइल'}</h1>
  <p class="sub">${S.lang==='en'?'Change branch anytime. Progress stays.':'ब्रांच कभी भी बदलें। प्रगति सुरक्षित रहेगी।'}</p>
  <div class="grid">${DATA.branches.map(b=>`<button class="tile ${b.id===S.branch?'on':''}" data-act="pick-branch" data-id="${b.id}"><b>${T(b)}</b></button>`).join('')}</div>
  <div class="card" style="margin-top:14px"><button class="btn ghost" data-act="reset">${S.lang==='en'?'Reset progress on this device':'इस डिवाइस की प्रगति मिटाएँ'}</button></div>`;
}

/* ---------- RENDER ---------- */
const TABS=[{id:'home',hi:'आज',en:'Today'},{id:'practice',hi:'अभ्यास',en:'Practice'},{id:'progress',hi:'प्रगति',en:'Progress'},{id:'profile',hi:'प्रोफ़ाइल',en:'Profile'}];
function render(){
  document.documentElement.lang = S.lang==='en'?'en':'hi';
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===S.lang));
  $('#tag').textContent = S.lang==='en'?'Diploma exam prep':'डिप्लोमा परीक्षा तैयारी';
  const app=$('#app');
  if(!S.branch){ app.innerHTML=viewOnboard(); $('#dock').classList.add('hide'); return; }
  $('#dock').classList.remove('hide');
  if(S.exam){ app.innerHTML=viewExam(); }
  else if(S.tab==='practice') app.innerHTML=viewPractice();
  else if(S.tab==='progress') app.innerHTML=viewProgress();
  else if(S.tab==='profile') app.innerHTML=viewProfile();
  else app.innerHTML=viewHome();
  $('#dock').innerHTML=TABS.map(t=>`<button class="${(S.tab===t.id&&!S.exam)?'on':''}" data-act="tab" data-id="${t.id}">${T(t)}</button>`).join('');
}

/* ---------- EVENTS ---------- */
document.addEventListener('click',e=>{
  const lg=e.target.closest('[data-lang]'); if(lg){S.lang=lg.dataset.lang; save(); render(); return}
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==='pick-branch'){ S.branch=id; S.exam=null; S.tab='home'; S.subj=null; save(); render(); }
  else if(a==='tab'){ S.tab=id; S.exam=null; S.subj=null; S.picked=null; render(); }
  else if(a==='open-exam'){ S.exam=id; render(); }
  else if(a==='go-home'){ S.exam=null; render(); }
  else if(a==='go-practice'){ S.tab='practice'; S.exam=null; S.subj=null; render(); }
  else if(a==='start-subj'){ S.tab='practice'; S.exam=null; S.subj=id; S.qi=0; S.picked=null; render(); }
  else if(a==='back-practice'){ S.subj=null; S.picked=null; render(); }
  else if(a==='pick'){
    const subs=subjectsFor(S.branch); const qs=DATA.questions.filter(q=>q.subject===S.subj && subs.some(s=>s.id===q.subject));
    const q=qs[S.qi%qs.length]; const i=+el.dataset.i; S.picked=i;
    const ok=i===q.a; S.score.t++; if(ok) S.score.c++;
    const p=S.progress[S.subj]||{c:0,t:0}; p.t++; if(ok)p.c++; S.progress[S.subj]=p; save(); render();
  }
  else if(a==='next'){ S.qi++; S.picked=null; render(); }
  else if(a==='reset'){ if(confirm(S.lang==='en'?'Reset progress on this device?':'इस डिवाइस की प्रगति मिटाएँ?')){ S.progress={}; S.score={c:0,t:0}; save(); render(); } }
});
render();
</script>
</body>
</html>
