name: Writer Robot
# Writes deep chapter content with free Gemini, checks it, saves it as a DRAFT (never shown in the app until approved).
# The report is posted as an issue. Keys are never printed.
on:
  schedule:
    - cron: '31 22 * * *'   # 04:01 IST, daily
  workflow_dispatch:
    inputs:
      count:
        description: 'How many chapters this run'
        default: '3'
      level:
        description: 'Only this level (empty = priority order)'
        default: 'govt_technical'
      only:
        description: 'Only these chapter ids, comma separated (rewrites existing drafts)'
        default: ''
      dry_run:
        description: 'Dry run (write nothing to the server)'
        type: boolean
        default: false
      command_id:
        description: 'Control Room command number (filled by the Dispatcher; leave empty)'
        default: ''
      source:
        description: 'Who started it (pgcron = Supabase schedule; leave empty)'
        default: ''
permissions:
  contents: read
  issues: write
  actions: read
concurrency: writer-robot
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Skip if this robot already ran in the last 6 hours (scheduled starts only)
        id: guard
        if: github.event_name == 'schedule' || inputs.source == 'pgcron'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub cron and the Supabase schedule both start this robot; only the first one in 6 hours works.
          since=$(date -u -d '-6 hours' +%FT%TZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/writer-robot.yml/runs?created=%3E%3D$since&per_page=30" \
              --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID) | select(.conclusion == \"success\" or .status != \"completed\")] | length")
          echo "earlier runs in 6 h: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Self-test
        if: steps.guard.outputs.skip != 'true'
        run: python robots/writer/selftest.py
      - name: Write
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          IN_COUNT: ${{ inputs.count || '3' }}
          IN_LEVEL: ${{ inputs.level }}
          IN_ONLY: ${{ inputs.only }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          # inputs come through env, never pasted into the script (no shell injection)
          case "$IN_COUNT" in ""|*[!0-9]*) echo "count must be a number"; exit 1;; esac
          case "$IN_ONLY" in *[!0-9,]*) echo "only must be ids"; exit 1;; esac
          A=(--count "$IN_COUNT")
          [ -n "$IN_LEVEL" ] && A+=(--level "$IN_LEVEL")
          [ -n "$IN_ONLY" ] && A+=(--only "$IN_ONLY")
          [ "$IN_DRY" = "true" ] && A+=(--dry-run)
          python robots/writer/writer.py "${A[@]}"
      - name: Report
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f writer-report.md ] || echo "Writer robot failed before writing a report." > writer-report.md
          gh issue create -R "$GITHUB_REPOSITORY" -t "Writer robot report $(date -u +%F_%H%M)" -F writer-report.md || true
      - name: Report to Control Room
        if: always() && inputs.command_id != '' && steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CMD_ID: ${{ inputs.command_id }}
        run: python robots/dispatcher/report.py --id "$CMD_ID" --file writer-report.md
