# One-time: approve row 43 (class_9_10 / 880 Electricity). Owner approval 2026-11-03 19:40 IST.
name: chapter-job-electricity-approve-2 (one time)
on:
  push:
    branches: [chapter-job-electricity-approve-2]
permissions: {}
concurrency: { group: chapter-job-electricity-approve-2, cancel-in-progress: false }
jobs:
  approve:
    if: github.event.created == true && contains(github.event.head_commit.message, '[electricity-approve-2-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: if [ -e runs/electricity-approve-2 ]; then echo "already done"; exit 1; fi
      - name: Approve row 43 (guarded)
        env: { SUPABASE_SECRET_KEY: '${{ secrets.SUPABASE_SECRET_KEY }}' }
        run: python3 tools/approve_row43.py || true
      - name: Refuse to publish if the secret is in the output
        env: { S1: '${{ secrets.SUPABASE_SECRET_KEY }}' }
        run: python3 -c "import os,sys;v=os.environ['S1'];sys.exit(1 if len(v)>=8 and v in open('out/result.json').read() else 0)"
      - uses: actions/upload-artifact@v4
        with: { name: approve2-result, path: out/, retention-days: 1 }
  publish:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: chapter-job-electricity-approve-2 }
      - uses: actions/download-artifact@v4
        with: { name: approve2-result, path: runs/electricity-approve-2 }
      - run: |
          git add runs/electricity-approve-2
          if git diff --cached --name-only | grep -v '^runs/electricity-approve-2/'; then exit 1; fi
          git config user.name chapter-job-run; git config user.email chapter-job-run@users.noreply.github.com
          git commit -m "Electricity approve-2 result [skip ci]"
          git push origin HEAD:refs/heads/chapter-job-electricity-approve-2
