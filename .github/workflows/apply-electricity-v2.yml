name: Apply Electricity v2 content
# Runs only on the electricity-v2 branch. Writes content/electricity_880/v3.json into draft 72 via draft_replace_with_version (saves the live version first).
on:
  push:
    branches: [electricity-v2]
    paths: ['content/electricity_880/v3.json', '.github/workflows/apply-electricity-v2.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 robots/apply/apply_draft.py --id 72 --file content/electricity_880/v3.json --note "2026-11-07 v3 audit fixes: full steps for 37 solved, 12 practice explanations, exam tips + quick check, Hinglish teach; longest copied run 6 words"
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
