name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: mkdir -p tests/shots && node tests/app.test.js
      - run: node tests/control.test.js
      - run: python3 robots/health/selftest.py
      - run: python3 robots/paper/selftest.py
      - run: python3 robots/writer/selftest.py
      - run: python3 robots/solver/selftest.py
      - run: python3 robots/dispatcher/selftest.py
      - run: python3 robots/planner/selftest.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: tests/shots }
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove leftover test branch
        run: git push origin --delete _pushtest || true
