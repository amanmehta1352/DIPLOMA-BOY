name: Backup all questions
# Read-only backup before any purge. Writes an artifact; deletes nothing.
on:
  schedule:
    - cron: '3 21 * * 0'   # Monday 02:33 IST, weekly full backup (90 days)
  workflow_dispatch:
permissions:
  contents: read
concurrency: backup-drafts
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Backup
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python robots/purge/backup.py --out out
      - uses: actions/upload-artifact@v4
        with:
          name: all-questions-backup
          path: out/
          retention-days: 90
