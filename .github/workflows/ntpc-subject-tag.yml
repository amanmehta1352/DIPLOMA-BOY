name: NTPC Subject Tag
# Started by Claude. Moves NTPC questions from 'ntpc-mixed' to Maths / Reasoning / General Awareness when the model is sure.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only)'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests scikit-learn
      - env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then python robots/import/subj_tag.py --dry-run; else python robots/import/subj_tag.py --apply; fi
