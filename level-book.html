<script>
/* ===== copied verbatim from book.html: stacked fractions and formula fitting ===== */
/* ===== Stacked fractions: a / b inside formula boxes -> numerator, horizontal bar, denominator ===== */
const FRAC_UNITS = new Set(['km','m','s','h','kg','g','cm','mm','nm','N','J','W','Hz','erg','dyne','cal','kWh','mol','K','A','V','C','min','ms','D','L','Pa','atm','rad','deg']);
function _fuTok(t){
  if(!t) return false;
  return t.split('·').every(p => { p = p.replace(/[²³⁻⁰¹⁴⁵⁶⁷⁸⁹0-9\-]+$/,''); return FRAC_UNITS.has(p); });
}
function _fuStrip(s){
  s = s.trim();
  if (s[0]==='(' && s[s.length-1]===')'){
    let d=0;
    for (let i=0;i<s.length;i++){
      if (s[i]==='(') d++; else if (s[i]===')'){ d--; if (d===0 && i<s.length-1) return s; }
    }
    return s.slice(1,-1).trim();
  }
  return s;
}
function _fuSplit(s){
  const out=[]; let d=0, last=0;
  const re=/^\s(=|\||→|≈|∝|\+|−|-|×)\s/;
  for (let i=0;i<s.length;i++){
    const c=s[i];
    if (c==='(') d++; else if (c===')') d=Math.max(0,d-1);
    else if (d===0 && /\s/.test(c)){
      const m=re.exec(s.slice(i));
      if (m){ out.push({t:s.slice(last,i)}); out.push({sep:m[0]}); i+=m[0].length-1; last=i+1; }
    }
  }
  out.push({t:s.slice(last)});
  return out;
}
function _fuSlashes(seg){
  const idx=[]; let d=0;
  for (let i=0;i<seg.length;i++){
    const c=seg[i];
    if (c==='(') d++; else if (c===')') d=Math.max(0,d-1);
    else if (c==='/' && d===0){
      const l=(seg.slice(0,i).match(/(\S+)$/)||[])[1]||'', r=(seg.slice(i+1).match(/^(\S+)/)||[])[1]||'';
      if (!(_fuTok(l) && _fuTok(r))) idx.push(i);
    }
  }
  return idx;
}
function _fuBal(s){ let d=0; for (const c of s){ if (c==='(') d++; else if (c===')'){ d--; if (d<0) return false; } } return d===0; }
function _fuFill(el, text){ const sub = text.indexOf('/')>=0 ? _fuSeg(text) : null; if (sub) el.appendChild(sub); else el.textContent = text; }
function _fuMake(num, den){
  const f=document.createElement('span'); f.className='frac';
  const n=document.createElement('span'); n.className='num'; _fuFill(n, num);
  const d=document.createElement('span'); d.className='den'; _fuFill(d, den);
  f.appendChild(n); f.appendChild(d); return f;
}
function _fuSeg(seg){
  const idx=_fuSlashes(seg);
  if (idx.length===1){
    const i=idx[0];
    const lead=seg.match(/^\s*/)[0], trail=seg.match(/\s*$/)[0];
    let num=seg.slice(0,i).trim(), den=seg.slice(i+1).trim(), suffix='', lead2='';
    const pm=den.match(/^(\S+)\s+(\(.*\))$/);
    if (pm){ den=pm[1]; suffix=' '+pm[2]; }
    const m=den.match(/^(.*?\S)\s+([A-Za-zµ°Ω]+(?:[·\/][A-Za-zµ°Ω]+)*[²³]?)$/);
    if (m && _fuTok(m[2].replace(/\//g,'·'))){ den=m[1]; suffix=' '+m[2]+suffix; }
    const dv=/[\u0900-\u097F]/, lat=/[A-Za-z0-9]/;
    if ((dv.test(num)||dv.test(den)) && lat.test(num+den) && !(dv.test(num)&&!lat.test(num)&&dv.test(den)&&!lat.test(den))){
      const nt=num.split(/\s+/); num=nt.pop(); lead2=nt.length? nt.join(' ')+' ' : '';
      const dt=den.split(/\s+/); den=dt.shift(); if (dt.length) suffix=' '+dt.join(' ')+suffix;
    }
    if (!num || !den) return null;
    num=_fuStrip(num); den=_fuStrip(den);
    if (!_fuBal(num) || !_fuBal(den)) return null;
    const frag=document.createDocumentFragment();
    if (lead||lead2) frag.appendChild(document.createTextNode(lead+lead2));
    frag.appendChild(_fuMake(num, den));
    if (suffix) frag.appendChild(document.createTextNode(suffix));
    if (trail) frag.appendChild(document.createTextNode(trail));
    return frag;
  }
  // a segment that is one parenthesised group holding exactly one fraction: (a/b)

/* Long formula lines "A | B | C" wrap between parts instead of being cut off */
function _fsSimple(el){ return [...el.children].every(c => /^(SUB|SUP|B|STRONG|EM|I|SPAN)$/.test(c.tagName) && !c.classList.contains('hi') && !c.classList.contains('en') && !c.classList.contains('frac')); }
function _fsSplit(el){

      const frag=document.createDocumentFragment();

        const r = p.t.includes('/') ? _fuSeg(p.t) : null;

  byType(atoms, 'concept').forEach(a => s.push(`<div class="teach-sec"><div class="teach-sec-h">💡 ${esc(a.title || L('समझो','Concept'))}</div><div class="teach-text"><p>${nl(a.body.text)}</p>${a.body.note ? `<div class="teach-ex"><strong>${L('याद रखो:','Remember:')}</strong> ${nl(a.body.note)}</div>` : ''}</div></div>`));
  byType(atoms, 'svg').forEach(a => s.push(`<div class="teach-sec"><div class="teach-sec-h">🖼️ ${esc(a.title || L('चित्र से समझो','See it'))}</div><div class="lb-fig">${svgImg(a.body.svg)}</div>${a.body.caption ? `<div class="lb-cap">${esc(a.body.caption)}</div>` : ''}</div>`));
  byType(atoms, 'formula').forEach(a => s.push(`<div class="teach-sec"><div class="teach-sec-h">✏️ ${esc(a.title || L('सूत्र','Formula'))}</div><div class="teach-formula">${fx(a.body.formula)}</div>${a.body.explanation ? `<div class="teach-text"><p>${nl(a.body.explanation)}</p></div>` : ''}</div>`));
  byType(atoms, 'example').forEach((a, i) => s.push(`<div class="teach-sec"><div class="teach-sec-h">🧮 ${L('चलो एक सवाल हल करें','Let us solve one')}</div>${nbCard(L(`सवाल ${i + 1}`, `Question ${i + 1}`), a.body.question, splitSteps(a.body.solution), a.body.answer)}</div>`));
  const m = mcqHtml(byType(atoms, 'mcq').flatMap(x => (x.body.questions || [])).slice(0, 3)); if (m) s.push(`<div class="teach-sec"><div class="teach-sec-h">✅ ${L('अब तुम बताओ','Your turn')}</div><div class="teach-text">${m}</div></div>`);
  const langs = [['hindi','हिंदी'],['english','English'],['bilingual','Bilingual'],['hinglish','Hinglish']];
  const sw = `<div class="lang-switcher">${langs.map(l => `<button class="lang-btn${l[0] === teachLang ? ' active' : ''}" onclick="setTeachLang('${l[0]}', this)">${l[1]}</button>`).join('')}</div>`
    + `<div class="lang-pending" id="teachPending" style="display:${teachLang === 'hindi' ? 'none' : 'block'}">${H('इस अध्याय का पाठ अभी सिर्फ़ हिंदी में है।', 'English version of this chapter is coming. The content below is shown in Hindi.')}</div>`;
  return `<div class="teach-theme">${sw}<div class="teach-title">${noOf(c)}. ${esc(noNum(L(c.hi, c.en)))} — ${L('क्लास में आपका स्वागत है!','welcome to the class!')}</div>${s.join('') || `<div class="teach-text"><p>${L('इस अध्याय में अभी सामग्री नहीं।','No content in this chapter yet.')}</p></div>`}</div>`;
}
function formulaCards(list){
  return `<div class="cards-list" id="formulaCards">${list.map((x, i) => `<div class="fcard cat-basic"><div class="top-row"><span class="cat-chip basic">● ${esc(LEVEL_NAME)}</span><span class="counter">${i + 1} / ${list.length}</span></div><div class="fcard-title">${esc(x.title || '')}</div><div class="formula-box-demo">${fx(x.formula)}</div>${x.sub ? `<div class="fcard-sub" style="margin-top:4px">${x.sub}</div>` : ''}</div>`).join('')
    || `<div class="pending-card">${L('इस अध्याय में अभी कोई सूत्र नहीं।','No formula in this chapter yet.')}</div>`}</div>`;
}
function formulaTab(atoms){
  return PENDING() + formulaCards(byType(atoms, 'formula').map(a => ({title: a.title, formula: a.body.formula, sub: a.body.explanation ? nl(a.body.explanation) : ''})));
}
function applyFormulaFilter(filter){
  document.querySelectorAll('#formulaChips .filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === filter));
  const cards = [...document.querySelectorAll('#formulaCards .fcard')];
  cards.forEach(card => { card.style.display = (filter === 'all' || card.dataset.cat === filter) ? 'flex' : 'none'; });
  const vis = cards.filter(c => c.style.display !== 'none');
  vis.forEach((card, i) => { const k = card.querySelector('.counter'); if (k) k.textContent = (i + 1) + ' / ' + vis.length; });
  try { pageScroller().scrollTo({top:0, behavior:'smooth'}); } catch (e) { window.scrollTo({top:0, behavior:'smooth'}); }
}
document.addEventListener('click', e => { const chip = e.target.closest('#formulaChips .filter-chip'); if (chip) applyFormulaFilter(chip.dataset.filter); });
function diagramTab(atoms){
  const d = byType(atoms, 'svg');
  return `<div class="notes-theme"><div class="notes-paper">${d.map(a => `<div class="panel orange"><div class="panel-header">🖼️ ${esc(a.title || '')}</div><div class="panel-body"><div class="lb-fig">${svgImg(a.body.svg)}</div>${a.body.caption ? `<div class="lb-cap">${esc(a.body.caption)}</div>` : ''}</div></div>`).join('')
    || `<p>${L('इस अध्याय का चित्र अभी तैयार नहीं है।','No diagram for this chapter yet.')}</p>`}</div></div>`;
}

/* ---- review mode: the owner's preview of robot drafts. Opens only with ?review=<code>; students never see drafts ---- */
const REVIEW = (Q.get('review') || '').trim();
const DRAFTS = {};
async function post(fn, args){
  const r = await fetch(SB.url + '/rest/v1/rpc/' + fn, {method:'POST', headers:{apikey:SB.key, Authorization:'Bearer ' + SB.key, 'Content-Profile':'mtb', 'Accept-Profile':'mtb', 'Content-Type':'application/json'}, body:JSON.stringify(args)});
  if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
}
async function draftFor(id){ if (!(id in DRAFTS)) DRAFTS[id] = await post('draft_review_get', {p_level:LEVEL, p_chapter:+id, p_code:REVIEW}); return DRAFTS[id]; }
const arr = x => Array.isArray(x) ? x : [];
const pts = list => `<ul class="lb-pts">${arr(list).map(x => `<li>${nl(x)}</li>`).join('')}</ul>`;
const lines = list => arr(list).map(x => `<div>${bookMath(x)}</div>`).join('');
function tbl(t){
  const rows = arr(t).filter(r => Array.isArray(r) && r.length); if (rows.length < 2) return '';
  return `<div class="lb-tblw"><table class="lb-tbl"><tr>${rows[0].map(c => `<th>${nl(c)}</th>`).join('')}</tr>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${nl(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
function reviewBanner(r){
  const ck = r.checks || {}, prob = arr(ck.problems), so = ck.second_opinion;
  return `<div class="lb-review">📝 <b>${L('ड्राफ्ट — सिर्फ़ आपके देखने के लिए। छात्रों को नहीं दिखता।','Draft: only for your review. Students do not see it.')}</b><br>`
    + `${L('हालत','Status')}: <b class="${r.status === 'draft' ? '' : 'bad'}">${esc(r.status)}</b> · ${esc(r.model || '')}`
    + (so ? ` · ${L('दूसरे AI से जाँच','Second opinion')}: ${10 - arr(so.disagree).length}/10 ${L('मिले','agree')}` : '')
    + (prob.length ? `<br><span class="bad">${prob.map(esc).join('<br>')}</span>` : '') + '</div>';
}
function dTeachTitles(d){
  return [...arr(d.teach).map(t => t.heading), ...arr(d.solved).map((x, i) => L(`चलो हल करें ${i + 1}`, `Let us solve ${i + 1}`)), ...(arr(d.practice).length ? [L('अब तुम बताओ','Your turn')] : [])];
}
function dBook(r){
  const d = r.data || {}, no = noOf(cur()), sec = [], body = [];
  arr(d.notes).forEach(n => { sec.push(n.title); body.push(pbHead(`${no}.${sec.length}`, n.title) + `<ul class="lb-pts pb-pts">${arr(n.points).map(x => `<li>${nl(x)}</li>`).join('')}</ul>` + tbl(n.table)); });
  if (arr(d.formulas).length) { sec.push(L('मुख्य सूत्र','Key formulas')); body.push(pbHead(`${no}.${sec.length}`, L('मुख्य सूत्र','Key formulas'))
    + arr(d.formulas).map(x => `<div class="pb-f"><b>${esc(x.title)}</b><div class="formula-box">${fx(x.formula)}</div>${x.units ? `<div class="pb-u">${L('इकाई','Unit')}: ${nl(x.units)}</div>` : ''}</div>`).join('')); }
  if (arr(d.solved).length) { sec.push(L('हल किए उदाहरण','Worked examples')); body.push(pbHead(`${no}.${sec.length}`, L('हल किए उदाहरण','Worked examples'))
    + arr(d.solved).map((x, i) => pbExample(i + 1, x.question, x.steps, x.answer)).join('')); }
  if (arr(d.practice).length) { sec.push(L('अभ्यास','Exercise')); body.push(pbHead(`${no}.${sec.length}`, L(`अभ्यास (${arr(d.practice).length} सवाल)`, `Exercise (${arr(d.practice).length} questions)`)) + `<div class="pb-exercise">${mcqHtml(d.practice)}</div>`); }
  const k = x => arr(d[x]).length;
  return reviewBanner(r) + bookShell(L(`📑 ${k('notes')} विषय · ∑ ${k('formulas')} सूत्र · 🧮 ${k('solved')} उदाहरण · ✅ ${k('practice')} अभ्यास`, `📑 ${k('notes')} topics · ∑ ${k('formulas')} formulas · 🧮 ${k('solved')} examples · ✅ ${k('practice')} exercise`),
    sec, dTeachTitles(d), body.join(''), H('📚 ड्राफ्ट वाले अध्याय', '📚 Chapters with a draft'));
}
function dSolved(x, i, teach){
  return `<div class="teach-sec"><div class="teach-sec-h">🧮 ${L(`चलो हल करें ${i + 1}`, `Let us solve ${i + 1}`)}</div>${nbCard(L(`सवाल ${i + 1}`, `Question ${i + 1}`), x.question, x.steps, x.answer)}</div>`;
}
function dNotes(r){
  const d = r.data || {}, c = cur(), p = [];
  arr(d.notes).forEach(n => p.push(`<div class="panel blue"><div class="panel-header">📑 ${esc(n.title)}</div><div class="panel-body">${pts(n.points)}${tbl(n.table)}</div></div>`));
  if (arr(d.formulas).length) p.push(`<div class="panel purple"><div class="panel-header">∑ ${L('सूत्र एक नज़र में','Formulas at a glance')}</div><div class="panel-body">${arr(d.formulas).map(x => `<div class="pb-fl"><span>${esc(x.title)}</span><div class="formula-box">${fx(x.formula)}</div></div>`).join('')}</div></div>`);
  if (arr(d.mistakes).length) p.push(`<div class="panel red"><div class="panel-header">⚠️ ${L('आम गलतियाँ','Common mistakes')}</div><div class="panel-body">${pts(d.mistakes)}</div></div>`);
  if (arr(d.revision).length) p.push(`<div class="panel purple"><div class="panel-header">🔁 ${L('जल्दी दोहराओ','Quick revision')}</div><div class="panel-body">${pts(d.revision)}</div></div>`);
  return reviewBanner(r) + `<div class="notes-theme"><div class="notes-paper">${PENDING()}<div style="text-align:center;font-weight:800;font-size:20px;color:#1d4ed8;margin:4px 0 12px">${noOf(c)}. ${esc(noNum(L(c.hi, c.en)))}</div>${p.join('')}</div></div>`;
}
function dTeach(r){
  const d = r.data || {}, c = cur(), s = [];
  teachLang = currentLang === 'en' ? 'english' : currentLang === 'both' ? 'bilingual' : 'hindi';
  arr(d.teach).forEach(t => s.push(`<div class="teach-sec"><div class="teach-sec-h">🎓 ${esc(t.heading)}</div><div class="teach-text"><p>${nl(t.explain)}</p>${t.example ? `<div class="teach-ex">${nl(t.example)}</div>` : ''}</div></div>`));
  arr(d.solved).forEach((x, i) => s.push(dSolved(x, i, true)));
  const m = mcqHtml(arr(d.practice).slice(0, 3)); if (m) s.push(`<div class="teach-sec"><div class="teach-sec-h">✅ ${L('अब तुम बताओ','Your turn')}</div><div class="teach-text">${m}</div></div>`);
  const langs = [['hindi','हिंदी'],['english','English'],['bilingual','Bilingual'],['hinglish','Hinglish']];
  const sw = `<div class="lang-switcher">${langs.map(l => `<button class="lang-btn${l[0] === teachLang ? ' active' : ''}" onclick="setTeachLang('${l[0]}', this)">${l[1]}</button>`).join('')}</div>`
    + `<div class="lang-pending" id="teachPending" style="display:${teachLang === 'hindi' ? 'none' : 'block'}">${H('इस अध्याय का पाठ अभी सिर्फ़ हिंदी में है।', 'English version of this chapter is coming. The content below is shown in Hindi.')}</div>`;
  return reviewBanner(r) + `<div class="teach-theme">${sw}<div class="teach-title">${noOf(c)}. ${esc(noNum(L(c.hi, c.en)))} — ${L('क्लास में आपका स्वागत है!','welcome to the class!')}</div>${s.join('')}</div>`;
}
function dFormula(r){
  return reviewBanner(r) + PENDING() + formulaCards(arr((r.data || {}).formulas).map(x => ({title: x.title, formula: x.formula,
    sub: [x.units ? `${L('इकाई','Unit')}: ${nl(x.units)}` : '', x.note ? nl(x.note) : ''].filter(Boolean).join('<br>')})));
}
/* one solved question as a notebook card: question, steps revealed one at a time (✍️), circled final answer */
function nbCard(label, question, steps, answer){
  const st = arr(steps).map(x => String(x || '').trim()).filter(Boolean);
  return `<div class="nb-card"><div class="nb-q"><small>${esc(label)}</small>${nbMath(question)}</div>`
    + st.map(x => `<div class="nb-step"><span class="nb-arr">➔</span>${nbMath(x)}</div>`).join('')
    + (answer ? `<div class="nb-ans"><small>${L('अंतिम उत्तर','Final Answer')}</small><span class="nb-circle">${nbMath(answer)}</span></div>` : '')
    + `<button class="nb-next" data-n="1">✍️ ${L('स्टेप 1 हल करो','Solve Step 1')}</button><button class="nb-next all">${L('पूरा हल एक साथ देखो','Show the full solution')}</button></div>`;
}
/* the masterclass page's own fraction rule (spaces allowed: 25 / 125), and * written as × */
const nbMath = t => bookMath(t).replace(/\n/g, '<br>');
const splitSteps = t => String(t || '').split(/\n|\s+·\s+/).map(x => x.trim()).filter(Boolean);
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.nb-next'); if (!b) return;
  const card = b.closest('.nb-card'), hidden = [...card.querySelectorAll('.nb-step:not(.on)')];
  if (b.classList.contains('all')) hidden.forEach(x => x.classList.add('on')); else if (hidden[0]) hidden[0].classList.add('on');
  const left = card.querySelectorAll('.nb-step:not(.on)').length, main = card.querySelector('.nb-next:not(.all)'), done = card.querySelectorAll('.nb-step.on').length;
  if (!left) { card.querySelectorAll('.nb-next').forEach(x => x.remove()); const a = card.querySelector('.nb-ans'); if (a) a.classList.add('on'); }
  else main.textContent = '✍️ ' + L(`स्टेप ${done + 1} हल करो`, `Solve Step ${done + 1}`);
});
/* a worked answer written out on the notebook (all steps shown), used under every practice question */
const expSteps = t => String(t || '').replace(/^\s*(✔|✘)?\s*(correct|सही)[!।.:]?\s*/i, '')
  .split(/\n|(?<=।)\s+|;\s+|(?<=[.!?])\s+(?=[A-Z(\u0900-\u097F])|\s*(?:⇒|=>)\s*/).map(x => x.trim()).filter(Boolean);
function nbSolution(steps, answer){
  return `<div class="nb-card"><div class="nb-q"><small>${L('हल','Solution')}</small></div>`
    + arr(steps).map(x => `<div class="nb-step on"><span class="nb-arr">➔</span>${nbMath(x)}</div>`).join('')
    + (answer ? `<div class="nb-ans on"><small>${L('सही उत्तर','Correct answer')}</small><span class="nb-circle">${nbMath(answer)}</span></div>` : '') + '</div>';
}
let SOLVE = {};   /* chapter id -> number of step-by-step solved questions (approved; with a review code also drafts) */
function solveBtn(){
  const n = SOLVE[curCh]; if (!n) return '';
  return `<button class="lb-solve" onclick="openSolve()">✍️ ${L('स्टेप-बाय-स्टेप हल करो','Solve step by step')} <small>(${n} ${L('सवाल','questions')})</small></button>`;
}
function openSolve(){
  const c = cur() || {};
  const q = new URLSearchParams({l:LEVEL, s:SUBJ, ch:String(curCh), cn:c.en || '', ln:LEVEL_NAME, ui:currentLang === 'en' ? 'en' : 'hi'});
  if (REVIEW) q.set('review', REVIEW);
  location.href = 'solve.html?' + q.toString();
}
let loadSeq = 0;   /* only the newest chapter/tab request may draw */
async function switchTab(tab){
  if (!['book','notes','teach','formula','diagram'].includes(tab)) tab = tab === '3d' ? 'diagram' : 'notes';
  document.body.dataset.tabActive = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const box = document.getElementById('readerContent'), seq = ++loadSeq;
  renderChapBar();
  let atoms, rv = REVIEW && tab !== 'diagram';
  try { atoms = rv ? await draftFor(curCh) : await atomsFor(curCh); if (rv && !atoms) throw new Error('no draft'); } catch (e) {
    if (seq === loadSeq)
      box.innerHTML = `<div class="pending-card">${L('अध्याय नहीं खुल सका। इंटरनेट जाँचें।','Could not open the chapter. Check your internet.')}</div>`;
    return;
  }
  if (seq !== loadSeq) return;
  const sb = (tab === 'book' || tab === 'notes') ? solveBtn() : '';
  box.innerHTML = sb + (rv ? {book:dBook, notes:dNotes, teach:dTeach, formula:dFormula} : {book:bookTab, notes:notesTab, teach:teachTab, formula:formulaTab, diagram:diagramTab})[tab](atoms);
  bindMcq(box); fracify(box); if (tab === 'formula') applyFormulaFilter('all');
  window.scrollTo(0, 0); try { (document.scrollingElement || document.documentElement).scrollTop = 0; } catch (e) {}
}
document.querySelectorAll('.lang-toggle .lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
(async function load(){
  const msg = t => { const m = document.getElementById('bookLoadingMsg'); if (m) m.innerHTML = t; };
  try {
    const cat = await get('rpc/get_level_catalog?p_level=' + encodeURIComponent(LEVEL));
    SUBJECT = (cat || []).find(s => s.slug === SUBJ); if (!SUBJECT) throw new Error('subject');
    CHAPTERS = (SUBJECT.chapters || []).map(c => ({id:c.id, hi:c.hi, en:c.en, n:c.n}));
    if (REVIEW) {   /* review mode: only chapters that have a robot draft can be opened */
      const have = new Set((await post('draft_review_list', {p_code:REVIEW})).filter(x => x.level_id === LEVEL).map(x => x.chapter_id));
      CHAPTERS.forEach(c => { c.n = have.has(c.id) ? 1 : 0; });
      if (!have.size) throw new Error('no drafts');
    }
    if (!CHAPTERS.some(c => c.id === curCh && c.n)) curCh = (ready()[0] || {}).id || 0;
    if (!curCh) throw new Error('empty');
    try { SOLVE = REVIEW ? await post('solution_review_counts', {p_level:LEVEL, p_code:REVIEW}) : await post('get_level_solution_counts', {p_level:LEVEL}); } catch (e) { SOLVE = {}; }
    await switchTab(Q.get('tab') || 'notes');
    document.getElementById('bookLoading').remove();
  } catch (e) {
    msg('किताब लोड नहीं हुई। इंटरनेट जाँचें। / Could not load the book. Check your internet.<br><button onclick="location.reload()" style="margin-top:12px;padding:10px 18px;border-radius:10px;border:1px solid #5eead4;background:none;color:#5eead4;font:inherit;cursor:pointer">फिर कोशिश करें / Retry</button>');
    console.error('level book load failed', e);
  }
})();
</script>
