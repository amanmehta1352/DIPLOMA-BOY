<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chapter 1 - Physics (Bilingual)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#243449; --heading:#60a5fa;
    --accent:#5eead4; --highlight:#fde68a; --text:#e2e8f0; --muted:#94a3b8; --line:#334155;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans Devanagari',sans-serif;font-size:15px;line-height:1.6;height:100%;overflow-x:hidden;}
  button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit;}

  

  
  .top-title{font-family:'Kalam',sans-serif;font-size:15px;font-weight:700;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;}

  .lang-toggle{display:flex;gap:3px;background:rgba(255,255,255,0.04);padding:3px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);flex-shrink:0;}
  .lang-toggle .lang-btn{padding:4px 8px;border-radius:5px;font-size:11px;font-weight:700;color:var(--muted);background:transparent;letter-spacing:0.3px;transition:all 0.2s;}
  .lang-toggle .lang-btn.active{color:var(--accent);background:rgba(94,234,212,0.15);box-shadow:0 0 8px rgba(94,234,212,0.2);}

  .view{display:block;padding-top:56px;padding-bottom:90px;flex:1;}
  .content-wrap{padding:16px;}

  body[data-lang="hi"] .en { display: none !important; }
  body[data-lang="en"] .hi { display: none !important; }
  body[data-lang="both"] .bil > .en {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed rgba(100,116,139,0.4);
    font-style: italic;
  }
  body[data-lang="both"] .notes-paper .bil > .en { border-top-color: rgba(100,116,139,0.3); color: #475569; }
  body[data-lang="both"] .bil-header .en::before { content: " • "; opacity: 0.55; font-weight: 400; }
  body[data-lang="both"] .top-title .en::before,
  body[data-lang="both"] .sheet-title .en::before { content: " / "; opacity: 0.5; }
  body[data-lang="both"] .fcard-title .en::before { content: " / "; opacity: 0.5; }
  body[data-lang="both"] .fcard-sub .en,
  body[data-lang="both"] .use-line .en { display: block; }

  
  
  .sheet-header{text-align:center;margin-bottom:16px;padding-bottom:8px;border-bottom:3px double #3b82f6;}
  .sheet-title{font-size:20px;font-weight:800;color:#3b82f6;text-transform:uppercase;}
  .sheet-subtitle{font-size:13px;color:#64748b;font-weight:600;margin-top:4px;}
  .panel{background:#fff;border:1.5px solid #cbd5e1;border-radius:8px;overflow:hidden;margin-bottom:12px;}
  .panel-header{padding:10px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1.5px solid #cbd5e1;background:#f8fafc;}
  .panel-body{padding:12px;font-size:14px;line-height:1.6;}
  .panel.blue{border-color:#3b82f6;}.panel.blue .panel-header{background:#eff6ff;color:#3b82f6;border-bottom-color:#3b82f6;}
  .panel.green{border-color:#10b981;}.panel.green .panel-header{background:#ecfdf5;color:#10b981;border-bottom-color:#10b981;}
  .panel.orange{border-color:#f59e0b;}.panel.orange .panel-header{background:#fffbeb;color:#f59e0b;border-bottom-color:#f59e0b;}
  .panel.purple{border-color:#8b5cf6;}.panel.purple .panel-header{background:#f5f3ff;color:#8b5cf6;border-bottom-color:#8b5cf6;}
  .panel.red{border-color:#ef4444;}.panel.red .panel-header{background:#fef2f2;color:#ef4444;border-bottom-color:#ef4444;}

  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;}
  th{background:#eff6ff;color:#3b82f6;padding:8px;text-align:left;border:1px solid #3b82f6;font-weight:700;}
  td{padding:8px;border:1px solid #cbd5e1;color:#1e293b;}

  .kv-list{display:flex;flex-direction:column;gap:6px;}
  .kv-item{display:flex;justify-content:space-between;padding:6px 8px;background:#f8fafc;border-radius:4px;border:1px solid #cbd5e1;gap:8px;}
  .kv-key{font-weight:600;color:#3b82f6;font-size:13px;}
  .kv-val{font-size:13px;text-align:right;}

  .formula-box{background:#eff6ff;border:2px solid #3b82f6;padding:12px;margin:12px 0;border-radius:6px;text-align:center;font-size:18px;color:#3b82f6;font-weight:700;font-family:'Courier New',monospace;}
  .diagram-container{background:#fff;border:1px solid #cbd5e1;border-radius:6px;padding:8px;margin:10px 0;text-align:center;}
  .diagram-caption{font-size:12px;color:#64748b;margin-top:6px;font-weight:600;border-top:1px dashed #cbd5e1;padding-top:6px;}

  .solution-box{background:#f8fafc;border:1px solid #cbd5e1;border-radius:6px;margin:12px 0;overflow:hidden;}
  .solution-header{background:#e2e8f0;color:#1e293b;padding:8px 12px;font-weight:700;font-size:14px;border-bottom:1px solid #cbd5e1;}
  .solution-body{padding:12px;}
  .sol-given{background:#fff;padding:8px 10px;border-radius:4px;margin-bottom:12px;border-left:3px solid #64748b;font-family:'Inter','Noto Sans Devanagari',sans-serif;font-size:14px;line-height:1.6;color:#1e293b;}
  .sol-step{margin-bottom:8px;padding-left:10px;border-left:2px solid #cbd5e1;font-family:'Courier New',monospace;font-size:15px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
  .sol-step strong{color:#8b5cf6;font-family:'Inter',sans-serif;font-size:13px;min-width:50px;}
  .sol-answer{background:#ecfdf5;padding:10px 12px;border-radius:4px;font-weight:700;color:#047857;text-align:center;border:2px dashed #10b981;margin-top:14px;font-family:'Courier New',monospace;font-size:15px;}

  .tip-box{background:#fef2f2;border:1px solid #ef4444;color:#991b1b;padding:10px;border-radius:6px;font-size:13px;margin:10px 0;display:flex;gap:8px;}
  .exam-box{background:#ecfdf5;border:1px solid #10b981;color:#047857;padding:10px;border-radius:6px;font-size:13px;margin:10px 0;display:flex;gap:8px;}

    .teach-title{font-size:22px;color:#f5f0d4;text-align:center;border-bottom:2px dashed rgba(232,228,208,0.3);padding-bottom:10px;margin-bottom:16px;}
  .teach-sec{margin-bottom:22px;}
  .teach-sec-h{font-size:16px;color:#a8d5ba;font-weight:700;border-bottom:1.5px solid #a8d5ba;display:inline-block;margin-bottom:10px;padding-bottom:2px;}
  .teach-text{font-size:15px;line-height:1.8;color:#e8e4d0;}
  .teach-text p{margin-bottom:10px;}
  .teach-text strong{color:#f4d35e;}
  .teach-text em{color:#a8d5ba;font-style:normal;}
  .teach-q{color:#ffb4a2;font-weight:700;font-style:italic;display:block;margin:10px 0 6px 0;}
  .teach-ex{background:rgba(244,211,94,0.08);border-left:3px solid #f4d35e;padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0;font-size:14px;}
  .teach-ex strong{color:#f4d35e;}
  .teach-formula{background:rgba(94,234,212,0.1);border:1.5px dashed #5eead4;padding:10px;border-radius:6px;text-align:center;font-family:'Courier New',monospace;font-size:16px;color:#5eead4;margin:10px 0;font-weight:700;}
  .fig-wrap{margin:12px 0;padding:10px;border:1px solid rgba(232,228,208,.2);border-radius:10px;background:rgba(255,255,255,.03);color:var(--text);}
  .tfig{width:100%;height:auto;display:block;}
  .fig-cap{font-size:13px;color:#a8d5ba;margin-top:6px;line-height:1.5;}
  .fig-cap em{color:#e8e4d0;opacity:.8;}
  .teach-list{padding-left:20px;margin:8px 0;}
  .teach-list li{margin-bottom:6px;font-size:14px;}

  .lang-switcher{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;}
  .lang-switcher::-webkit-scrollbar{display:none;}
  .lang-switcher .lang-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);padding:6px 14px;border-radius:20px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:#a8d5ba;white-space:nowrap;transition:0.3s;letter-spacing:0.2px;}
  .lang-switcher .lang-btn.active{background:#a8d5ba;color:#0a1f14;border-color:#a8d5ba;box-shadow:0 0 10px rgba(168,213,186,0.4);}

  
  
  .nav-btn.active { color: var(--accent); background: rgba(94, 234, 212, 0.15); }
  
  

  sup { font-size: 0.65em; line-height: 0; position: relative; vertical-align: baseline; top: -0.5em; }
  sub { font-size: 0.65em; line-height: 0; position: relative; vertical-align: baseline; bottom: -0.25em; }
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;font-family:'Courier New',monospace;font-weight:700;font-size:16px;position:relative;top:-2px;line-height:1.1;}
  .frac .num{border-bottom:2px solid currentColor;padding:0 4px 2px 4px;display:block;}
  .frac .den{padding:2px 4px 0 4px;display:block;}

  .filter-wrap{
    position: sticky; top: 56px; z-index: 90;
    background: rgba(15,23,42,0.95);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 12px 16px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .filter-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
  .filter-chips::-webkit-scrollbar{display:none;}
  .filter-chip{
    padding: 7px 14px; border-radius: 20px;
    background: rgba(94,234,212,0.06);
    border: 1px solid rgba(94,234,212,0.25);
    color: #5eead4; font-family: inherit; font-size: 12px; font-weight: 600;
    white-space: nowrap; cursor: pointer; transition: all 0.2s;
  }
  .filter-chip.active{background:#5eead4;color:#0f172a;box-shadow:0 0 12px rgba(94,234,212,0.35);}
  .filter-chip:hover:not(.active){background:rgba(94,234,212,0.15);}

  .cards-list{padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px;}

  .fcard{
    background:#1e293b; border:1px solid #334155; border-radius:16px; padding:16px;
    display:flex; flex-direction:column; gap:11px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .fcard.cat-conv{border-left:4px solid #5eead4;}
  .fcard.cat-dim{border-left:4px solid #a78bfa;}
  .fcard.cat-basic{border-left:4px solid #fde68a;}

  .top-row{display:flex;justify-content:space-between;align-items:center;}
  .cat-chip{padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;}
  .cat-chip.conv{background:rgba(94,234,212,0.15);color:#5eead4;}
  .cat-chip.dim{background:rgba(167,139,250,0.15);color:#a78bfa;}
  .cat-chip.basic{background:rgba(253,230,138,0.15);color:#fde68a;}
  .counter{color:#64748b;font-size:11px;font-weight:600;font-family:'Courier New',monospace;letter-spacing:0.5px;}

  .fcard-title{font-size:16px;font-weight:700;color:#e2e8f0;line-height:1.3;margin-top:1px;}
  .fcard-sub{font-size:12px;color:#94a3b8;margin-top:-6px;font-weight:500;}

  .formula-box-demo{
    background:linear-gradient(135deg,rgba(94,234,212,0.14),rgba(94,234,212,0.03));
    border:1.5px solid rgba(94,234,212,0.45); border-radius:12px; padding:22px 14px;
    text-align:center; font-size:24px; font-weight:700; font-family:'Courier New',monospace;
    color:#5eead4; letter-spacing:0.5px; word-break:break-word; line-height:1.3;
    position:relative; overflow:hidden;
  }
  .formula-box-demo::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg,transparent,#5eead4,transparent); opacity:0.6;
  }

  .use-line{
    background:rgba(245,158,11,0.06); border-left:3px solid #f59e0b;
    padding:9px 12px; border-radius:0 8px 8px 0;
    font-size:12.5px; color:#cbd5e1; line-height:1.55;
  }
  .use-line strong{color:#fde68a;font-weight:700;}
  .use-line .icon{color:#f59e0b;margin-right:5px;}

  .formula-note{
    margin: 4px 16px 24px; padding: 12px; background: rgba(94,234,212,0.05);
    border: 1px dashed rgba(94,234,212,0.3); border-radius: 10px;
    font-size: 12px; color: #94a3b8; text-align: center; line-height: 1.6;
  }

  .legend-overlay{position:absolute;bottom:16px;left:16px;background:rgba(30,41,59,0.8);backdrop-filter:blur(10px);padding:8px 12px;border-radius:8px;font-size:11px;display:flex;gap:12px;border:1px solid var(--line);}
  .legend-item{display:flex;align-items:center;gap:4px;color:var(--text);}
  .legend-dot{width:10px;height:10px;border-radius:50%;}
  /* 1. App ko Full Width karne ke liye */
  #app{max-width:100%; width:100%; margin:0; min-height:100vh; display:flex; flex-direction:column; position:relative;}
  
  /* 2. Top Bar Full Width */
  .top-bar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(15,23,42,0.95);backdrop-filter:blur(15px);z-index:100;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(255,255,255,0.05);width:100%;}
  
  /* 3. Notes ka safed background full width */
    
  /* 4. Bottom Nav (5 Buttons ke liye adjust kiya gaya hai) */
  .bottom-nav {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: 96%; max-width: 450px; height: 44px;
    background: rgba(30, 41, 59, 0.9);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 22px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 6px; z-index: 1000;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255,255,255,0.1);
  }
  .nav-btn {
    display: flex; flex-direction: column; /* Text aur icon ek ke niche ek */
    align-items: center; justify-content: center; flex: 1;
    color: var(--muted); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    padding: 4px 2px; border-radius: 12px; gap: 2px;
  }
  .nav-icon{font-size:14px;}
  .nav-lbl{font-size:9px; font-weight:700; letter-spacing:0.2px;}

  /* ==========================================
     PREMIUM BOUNDARIES & LAYOUT (FIXED)
     ========================================== */
  html, body { font-size: 16px; background: #0f172a; overflow-x: hidden; }
  #readerContent { padding: 0 !important; }
  .view { padding-top: 56px; padding-bottom: 96px; }
  .content-wrap { padding: 0; }
  .notes-theme { background: #e2e8f0; padding: 10px; width: 100%; min-height: calc(100vh - 60px); }
  .notes-paper { background: #ffffff; padding: 16px 12px 30px 32px; width: 100%; border: 1.5px solid #3b82f6; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
  .notes-paper { color:#1e293b; }
  .notes-paper .kv-val, .notes-paper .kv-key { color:#1e293b; }
  .notes-paper .kv-key { color:#1d4ed8; }
  .notes-paper::before { content: ''; position: absolute; top: 0; bottom: 0; left: 20px; border-left: 1.5px solid #fca5a5; }
  .sheet-title { font-size: 22px; line-height: 1.3; }
  .panel-body table { display: table; width: 100%; table-layout: auto; white-space: normal; word-break: break-word; font-size: 13px; }
  .panel-body th, .panel-body td { padding: 6px 5px; vertical-align: top; }
  .teach-theme { background: linear-gradient(135deg, #0a1f14, #163325); padding: 16px; color: #e8e4d0; font-family: 'Kalam', cursive; width: calc(100% - 20px); margin: 10px; min-height: calc(100vh - 90px); border: 6px solid #6b4423; border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.4), inset 0 0 40px rgba(0,0,0,0.5); }
  .teach-title { font-size: 24px; line-height: 1.3; }
  .teach-sec-h { font-size: 18px; }
  .teach-text { font-size: 16px; line-height: 1.8; }
  .teach-ex, .teach-list li { font-size: 15px; }
  .digital-book-container { background: #ffffff; margin: 10px; padding: 40px 20px; border: 2px dashed #94a3b8; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; min-height: 85vh; }
  .panel { border-radius: 10px; margin-bottom: 14px; }
  .panel-header { font-size: 16px; padding: 12px; }
  .panel-body { font-size: 15px; padding: 12px; }
  .formula-box, .formula-box-demo { font-size: 20px; word-break: break-word; }
  .sol-given, .sol-step, .sol-answer { font-size: 15px; }
  iframe[data-demo] { width: 100% !important; margin: 0 0 12px !important; border: none !important; border-radius: 0 !important; }

  /* ==========================================
     NEW: OUT-OF-THE-BOX BOUNDARY (NOTES & TEACH)
     ========================================== */

  /* 1. NOTES TAB (Digital Notebook Style) */
  .notes-theme {
    background: #e2e8f0; /* हल्का ग्रे बैकग्राउंड ताकि सफेद पेज उभरकर दिखे */
    padding: 12px; /* बाउंड्री और स्क्रीन के बीच थोड़ी जगह */
    margin: 0;
    width: 100%;
    min-height: calc(100vh - 60px);
  }

  .notes-paper {
    background: #ffffff;
    padding: 20px 16px 30px 38px; /* बाएँ तरफ ज्यादा पैडिंग (रेड लाइन के लिए) */
    width: 100%;
    margin: 0;
    /* साफ और पतली ब्लू बाउंड्री */
    border: 1.5px solid #3b82f6; 
    border-radius: 12px; /* स्मूथ कोने */
    /* पेज को 3D लुक देने के लिए शैडो */
    box-shadow: 0 8px 20px rgba(0,0,0,0.08), inset 0 0 0 1px rgba(59, 130, 246, 0.1);
    position: relative;
    overflow: hidden;
  }

  /* "Out of the box" - क्लासिक कॉपी वाली लाल मार्जिन लाइन */
  .notes-paper::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: 24px;
    border-left: 1.5px solid #fca5a5; /* सॉफ्ट रेड लाइन */
    pointer-events: none;
  }

  /* 2. TEACH TAB (Real Classroom Board Style) */
  .teach-theme {
    background: linear-gradient(135deg,#0a1f14,#163325);
    padding: 20px 14px; 
    color:#e8e4d0; 
    font-family:'Kalam',cursive;
    width: calc(100% - 24px); /* साइड से थोड़ी जगह */
    margin: 12px; /* चारों तरफ बराबर मार्जिन */
    min-height: calc(100vh - 90px); 
    
    /* लकड़ी के फ्रेम (Wooden Frame) का लुक */
    border: 8px solid #6b4423; 
    border-radius: 16px;
    box-shadow: 
      0 12px 30px rgba(0,0,0,0.4), /* बाहर की शैडो */
      inset 0 0 40px rgba(0,0,0,0.5); /* बोर्ड के अंदर की शैडो */
  }

  /* 3. DIGITAL BOOK TAB (Under Construction Boundary) */
  .digital-book-container {
    background: #ffffff;
    margin: 12px;
    padding: 40px 20px;
    border: 2px dashed #94a3b8; /* डैश बॉर्डर (Construction लुक) */
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    text-align: center;
    min-height: 80vh;
  }

  /* audit fixes: minimum readable sizes */
  .teach-sec-h, .teach-q { font-size: 17px; }
  .notes-paper .panel-body div, .notes-paper .panel-body p { font-size: 15px; }
  .notes-paper .kv-key, .notes-paper .kv-val { font-size: 14px; }
  .cat-chip { font-size: 12px; }
  .counter { font-size: 12px; }
  .fig-cap { font-size: 14px; }

  /* ===== EDGE-TO-EDGE FINAL (no side gutters; boundary lines touch the screen edge) ===== */
  .notes-theme { padding: 0 !important; margin: 0 !important; width: 100% !important; background: #ffffff !important; min-height: 100vh; }
  .notes-paper { width: 100% !important; margin: 0 !important; padding: 14px 10px 26px 30px !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; background: #ffffff !important; }
  .notes-paper::before { left: 12px !important; border-left: 1.5px solid #fca5a5 !important; }
  .sheet-header { border-bottom: 2px solid #3b82f6; }
  .teach-theme { width: 100% !important; margin: 0 !important; padding: 14px 12px 24px !important; border: none !important; border-top: 6px solid #6b4423 !important; border-bottom: 6px solid #6b4423 !important; border-radius: 0 !important; box-shadow: none !important; min-height: 100vh; }

function _dl(x){ return Array.isArray(x) ? '<span class="hi">' + x[0] + '</span><span class="en">' + x[1] + '</span>' : x; }

/* Topic groups for the formula filter (chapters 2–11), same chip style as chapter 1 */

function formulaCardsFor(n){

    </div>`; }).join('');

function setChapter(n){ curCh = n; switchTab(document.body.dataset.tabActive || 'notes'); }
const PENDING_NOTE = '<div class="lang-pending">English version of this chapter is coming. The content below is shown in Hindi.</div>';
function notesFor(n){
  if(n === 1) return chapterData.notesHTML;
  if(CHS[n]) return '<div class="notes-theme"><div class="notes-paper"><div class="hi">' + extraChapter(n).html + '</div><div class="en">' + CHS[n].notesEN + '</div></div></div>';

}
function teachPending(n){

}
function formulaFor(n){
  if(n === 1) return renderFormulaHTML();
  if(CHS[n]) return formulaCardsFor(n);

  }).join('');

/* Page scroll container: body scrolls in this app (html,body height:100%) */
function pageScroller(){ const b=document.body; return (b.scrollHeight > b.clientHeight + 1 && /auto|scroll/.test(getComputedStyle(b).overflowY)) ? b : (document.scrollingElement || document.documentElement); }
/* ===== Book tab: per-chapter contents with links into Notes / Teach / Formula / 3D ===== */
function _bookSplit(el){ const a=el.cloneNode(true), b=el.cloneNode(true); a.querySelectorAll('.en').forEach(x=>x.remove()); b.querySelectorAll('.hi').forEach(x=>x.remove()); return [a.textContent.replace(/\s+/g,' ').trim(), b.textContent.replace(/\s+/g,' ').trim()]; }

/* ===== Stacked fractions: a / b inside formula boxes -> numerator, horizontal bar, denominator ===== */
const FRAC_UNITS = new Set(['km','m','s','h','kg','g','cm','mm','nm','N','J','W','Hz','erg','dyne','cal','kWh','mol','K','A','V','C','min','ms','D','L','Pa','atm','rad','deg']);
function _fuTok(t){
  if(!t) return false;
  return t.split('·').every(p => { p = p.replace(/[²³⁻⁰¹⁴⁵⁶⁷⁸⁹0-9\-]+$/,''); return FRAC_UNITS.has(p); });
}
function _fuStrip(s){
  s = s.trim();
  if (s[0]==='(' && s[s.length-1]===')'){
    let d=0;
    for (let i=0;i<s.length;i++){
      if (s[i]==='(') d++; else if (s[i]===')'){ d--; if (d===0 && i<s.length-1) return s; }
    }
    return s.slice(1,-1).trim();
  }
  return s;
}
function _fuSplit(s){
  const out=[]; let d=0, last=0;
  const re=/^\s(=|\||→|≈|∝|\+|−|-|×)\s/;
  for (let i=0;i<s.length;i++){
    const c=s[i];
    if (c==='(') d++; else if (c===')') d=Math.max(0,d-1);
    else if (d===0 && /\s/.test(c)){
      const m=re.exec(s.slice(i));
      if (m){ out.push({t:s.slice(last,i)}); out.push({sep:m[0]}); i+=m[0].length-1; last=i+1; }
    }
  }
  out.push({t:s.slice(last)});
  return out;
}
function _fuSlashes(seg){
  const idx=[]; let d=0;
  for (let i=0;i<seg.length;i++){
    const c=seg[i];
    if (c==='(') d++; else if (c===')') d=Math.max(0,d-1);
    else if (c==='/' && d===0){
      const l=(seg.slice(0,i).match(/(\S+)$/)||[])[1]||'', r=(seg.slice(i+1).match(/^(\S+)/)||[])[1]||'';
      if (!(_fuTok(l) && _fuTok(r))) idx.push(i);
    }
  }
  return idx;
}
function _fuBal(s){ let d=0; for (const c of s){ if (c==='(') d++; else if (c===')'){ d--; if (d<0) return false; } } return d===0; }
function _fuFill(el, text){ const sub = text.indexOf('/')>=0 ? _fuSeg(text) : null; if (sub) el.appendChild(sub); else el.textContent = text; }
function _fuMake(num, den){
  const f=document.createElement('span'); f.className='frac';
  const n=document.createElement('span'); n.className='num'; _fuFill(n, num);
  const d=document.createElement('span'); d.className='den'; _fuFill(d, den);
  f.appendChild(n); f.appendChild(d); return f;
}
function _fuSeg(seg){
  const idx=_fuSlashes(seg);
  if (idx.length===1){
    const i=idx[0];
    const lead=seg.match(/^\s*/)[0], trail=seg.match(/\s*$/)[0];
    let num=seg.slice(0,i).trim(), den=seg.slice(i+1).trim(), suffix='', lead2='';
    const pm=den.match(/^(\S+)\s+(\(.*\))$/);
    if (pm){ den=pm[1]; suffix=' '+pm[2]; }
    const m=den.match(/^(.*?\S)\s+([A-Za-zµ°Ω]+(?:[·\/][A-Za-zµ°Ω]+)*[²³]?)$/);
    if (m && _fuTok(m[2].replace(/\//g,'·'))){ den=m[1]; suffix=' '+m[2]+suffix; }
    const dv=/[\u0900-\u097F]/, lat=/[A-Za-z0-9]/;
    if ((dv.test(num)||dv.test(den)) && lat.test(num+den) && !(dv.test(num)&&!lat.test(num)&&dv.test(den)&&!lat.test(den))){
      const nt=num.split(/\s+/); num=nt.pop(); lead2=nt.length? nt.join(' ')+' ' : '';
      const dt=den.split(/\s+/); den=dt.shift(); if (dt.length) suffix=' '+dt.join(' ')+suffix;
    }
    if (!num || !den) return null;
    num=_fuStrip(num); den=_fuStrip(den);
    if (!_fuBal(num) || !_fuBal(den)) return null;
    const frag=document.createDocumentFragment();
    if (lead||lead2) frag.appendChild(document.createTextNode(lead+lead2));
    frag.appendChild(_fuMake(num, den));
    if (suffix) frag.appendChild(document.createTextNode(suffix));
    if (trail) frag.appendChild(document.createTextNode(trail));
    return frag;
  }
  // a segment that is one parenthesised group holding exactly one fraction: (a/b)
  const t=seg.trim();
  if (idx.length===0 && t[0]==='(' && _fuStrip(t)!==t){
    const inner=_fuStrip(t), ii=_fuSlashes(inner);
    if (ii.length===1 && !/[\u0900-\u097F]/.test(inner)){
      const k=ii[0], num=inner.slice(0,k).trim(), den=inner.slice(k+1).trim();
      if (num && den){
        const frag=document.createDocumentFragment();
        frag.appendChild(document.createTextNode('('));
        frag.appendChild(_fuMake(_fuStrip(num), _fuStrip(den)));
        frag.appendChild(document.createTextNode(')'));
        return frag;
      }
    }
  }
  return null;
}
/* Long formula lines "A | B | C" wrap between parts instead of being cut off */
function _fsSimple(el){ return [...el.children].every(c => /^(SUB|SUP|B|STRONG|EM|I|SPAN)$/.test(c.tagName) && !c.classList.contains('hi') && !c.classList.contains('en') && !c.classList.contains('frac')); }
function _fsSplit(el){
  if(el.dataset.fsplit) return; el.dataset.fsplit='1';
  const parts = el.innerHTML.split(/(?:\s|&nbsp;)+\|(?:\s|&nbsp;)+/);
  if(parts.length < 2) return;
  el.innerHTML = parts.map(p => '<span class="fseg">' + p.trim() + '</span>').join('<span class="fsep">|</span>');
  el.classList.add('fsplit');
}
function splitFormulaBars(root){
  root.querySelectorAll('.formula-box,.formula-box-demo,.teach-formula').forEach(el => {
    if(_fsSimple(el)) _fsSplit(el);
    else el.querySelectorAll(':scope > span.hi, :scope > span.en').forEach(sp => { if(_fsSimple(sp)) _fsSplit(sp); });
  });
}
/* A formula line still wider than its box wraps at spaces (fractions stay intact) */
function fitFormulas(root){
  (root || document).querySelectorAll('.formula-box,.formula-box-demo,.teach-formula').forEach(el => {
    if(!el.offsetParent || el.classList.contains('fwrap')) return;
    if(el.scrollWidth > el.clientWidth + 2) el.classList.add('fwrap');
  });
}
document.addEventListener('click', e => { if(e.target.closest && e.target.closest('.lang-toggle, .lang-switcher')) setTimeout(() => { fitFormulas(document); if(document.body.dataset.tabActive === '3d' && curCh !== 1 && e.target.closest('.lang-toggle')) switchTab('3d'); }, 60); });
window.addEventListener('resize', () => { clearTimeout(window._fitT); window._fitT = setTimeout(() => fitFormulas(document), 150); });
/* Solution steps: keep label + content as two flex items so sub/superscripts don't split apart */
function wrapSolSteps(root){
  root.querySelectorAll('.sol-step').forEach(el => {
    if(el.dataset.sw) return; el.dataset.sw = '1';
    const first = el.firstElementChild; if(!first || first.tagName !== 'STRONG' || !first.nextSibling) return;
    const span = document.createElement('span'); span.className = 'sol-body';
    while(first.nextSibling) span.appendChild(first.nextSibling);
    el.appendChild(span);
  });
  root.querySelectorAll('.sol-step .frac, .sol-answer .frac').forEach(fr => {
    const nx = fr.nextSibling; if(!nx || nx.nodeType !== 1 || nx.tagName !== 'SUP' || fr.dataset.par) return;
    fr.dataset.par = '1'; fr.before(document.createTextNode('(')); fr.after(document.createTextNode(')'));
  });
}
function fracify(root){
  if(!root) return;
  try { splitFormulaBars(root); } catch(e) {}
  try { wrapSolSteps(root); } catch(e) {}
  requestAnimationFrame(() => { try { fitFormulas(root); } catch(e) {} });
  root.querySelectorAll('.formula-box,.formula-box-demo,.teach-formula').forEach(el => {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(t => {
      if (!t.nodeValue.includes('/') || (t.parentNode.closest && t.parentNode.closest('.frac'))) return;
      const parts=_fuSplit(t.nodeValue); let changed=false;
      const frag=document.createDocumentFragment();
      parts.forEach(p => {
        if (p.sep!==undefined){ frag.appendChild(document.createTextNode(p.sep)); return; }
        const r = p.t.includes('/') ? _fuSeg(p.t) : null;
        if (r){ frag.appendChild(r); changed=true; } else frag.appendChild(document.createTextNode(p.t));
      });
      if (changed) t.parentNode.replaceChild(frag, t);
    });
  });
}

let scene, camera, renderer, cube; let is3DInit = false;
function init3D() {
  const container = document.getElementById('3d-container');
  if(!container) return;
  if(is3DInit) { container.appendChild(renderer.domElement); return; }
  is3DInit = true;
  scene = new THREE.Scene();
  const w = container.clientWidth; const h = container.clientHeight;
  camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
  camera.position.set(2.5, 2.5, 3.5); camera.lookAt(0, 0, 0);
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h); renderer.setPixelRatio(window.devicePixelRatio); container.appendChild(renderer.domElement);
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); dirLight.position.set(5, 5, 5); scene.add(dirLight);
  const geometry = new THREE.BoxGeometry(2, 2, 2);
  const materials = [
    new THREE.MeshStandardMaterial({ color: 0x60a5fa }),
    new THREE.MeshStandardMaterial({ color: 0x3b82f6 }),
    new THREE.MeshStandardMaterial({ color: 0x5eead4 }),
    new THREE.MeshStandardMaterial({ color: 0x2dd4bf }),
    new THREE.MeshStandardMaterial({ color: 0xfde68a }),
    new THREE.MeshStandardMaterial({ color: 0xfbbf24 })
  ];
  cube = new THREE.Mesh(geometry, materials);
  const edges = new THREE.EdgesGeometry(geometry);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.2, transparent: true }));
  cube.add(line); scene.add(cube);
  let isDragging = false; let prevX = 0, prevY = 0;
  renderer.domElement.addEventListener('pointerdown', (e) => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
  window.addEventListener('pointerup', () => isDragging = false);
  window.addEventListener('pointermove', (e) => {
    if(!isDragging) return;
    const dx = e.clientX - prevX; const dy = e.clientY - prevY;
    cube.rotation.y += dx * 0.01; cube.rotation.x += dy * 0.01;
    prevX = e.clientX; prevY = e.clientY;
  });
  function animate() { requestAnimationFrame(animate); if(!isDragging) cube.rotation.y += 0.005; renderer.render(scene, camera); }
  animate();
}

function loadThree(cb) {
  if (window.THREE) return cb();
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  sc.onload = cb;
  sc.onerror = () => { const c = document.getElementById('3d-container'); if (c) c.insertAdjacentHTML('beforeend', '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;">3D लोड नहीं हो सका / 3D could not load</div>'); };
  document.head.appendChild(sc);
}

/* Diploma Boy: lets the app shell read which chapter is open (read-only). */
window.__curCh = () => curCh;
/* INIT (Diploma Boy): runs after the book data has arrived from the server. URL: ?b=<book>&ch=<n>&tab=<tab>&lang=<hi|en|both> */
function __bookInit(q) {
  let saved = 'hi';
  try { saved = localStorage.getItem('phys_lang') || 'hi'; } catch(e){}
  const lang = q && q.get('lang'); setLang(['hi','en','both'].includes(lang) ? lang : saved);
  const ch = q ? parseInt(q.get('ch'), 10) : NaN; if (ch && EXTRA.meta.some(m => m.n === ch)) curCh = ch;
  const tab = q && q.get('tab'); switchTab(['book','notes','teach','formula','3d'].includes(tab) ? tab : 'notes');
}
</script>

<script>
/* Diploma Boy: load this book from the server, then run the reader code unchanged. */
(async function bookLoad(){
  const SB = {url:'https://wobmtlcpszcntczkebtt.supabase.co', key:'sb_publishable_7ZZEUDULfYaMHSeLIxfluQ_fZWSCi8R'}; // publishable key
  const q = new URLSearchParams(location.search);
  const book = q.get('b') || 'physics-baseline';
  const msg = t => { const m = document.getElementById('bookLoadingMsg'); if (m) m.innerHTML = t; };
  try {
    const r = await fetch(SB.url + '/rest/v1/rpc/get_chapter_books?p_book=' + encodeURIComponent(book),   /* GET: cached by sw.js for offline */
      {headers:{apikey:SB.key, Authorization:'Bearer ' + SB.key, 'Accept-Profile':'mtb'}});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json();
    const one = rows.find(x => x.ch_no === 1);
    if (!rows.length || !one) throw new Error('empty');
    const B = {ch1: one.data, ch: {}, demos: {}, groups: {}};
    rows.filter(x => x.ch_no > 1).forEach(x => {
      const d = x.data;
      B.ch[x.ch_no] = {n: x.ch_no, titles: d.titles, notesEN: d.notes_en, formulas: d.formulas, teach: d.teach};
      B.demos[x.ch_no] = d.demo_html; B.groups[x.ch_no] = d.formula_groups || [];
    });
    window.__BOOK = B;
    document.getElementById('extraChapters').textContent = JSON.stringify({
      chapters: rows.filter(x => x.ch_no > 1).map(x => ({n: x.ch_no, hi: x.title_hi, en: x.title_en, html: x.data.notes_hi})),
      meta: rows.map(x => ({n: x.ch_no, sh: [x.short_hi, x.short_en]}))});
    document.getElementById('vec3dSrc').textContent = one.data.demo_html;
    document.querySelectorAll('script[type="text/plain"][data-code]').forEach(s => {
      const x = document.createElement('script'); x.textContent = s.textContent; document.body.appendChild(x); });
    __bookInit(q);
    document.getElementById('bookLoading').remove();
  } catch (e) {
    msg('किताब लोड नहीं हुई। इंटरनेट जाँचें। / Could not load the book. Check your internet.<br><button onclick="location.reload()" style="margin-top:12px;padding:10px 18px;border-radius:10px;border:1px solid #5eead4;background:none;color:#5eead4;font:inherit;cursor:pointer">फिर कोशिश करें / Retry</button>');
    console.error('book load failed', e);
  }
})();
</script>
