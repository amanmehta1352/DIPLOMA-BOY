name: Import Robot
# Started by Claude (the import admin). mode=paper: complete bilingual paper from an English + Hindi sheet (draft only).
# mode=tag: chapter tagger for drafts. mode=publish: checked publish. Never publishes anything that failed a check.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Job ids, comma separated'
        default: ''
      mode:
        description: 'paper | tag | publish'
        type: choice
        options: [paper, tag, publish]
        default: paper
      dry_run:
        description: 'Dry run (read + report only, nothing written)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency: import-robot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng poppler-utils
          pip install -q pdfplumber pymupdf pillow requests scikit-learn scipy
          if [ "${{ inputs.mode }}" = "paper" ]; then pip install -q torch --index-url https://download.pytorch.org/whl/cpu; pip install -q "transformers==4.46.3" sentencepiece sacremoses einops IndicTransToolkit; fi
      - name: Self-test
        run: python robots/import/selftest.py
      - name: Run
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          A="--work work"
          for j in $(echo "${{ inputs.jobs }}" | tr ',' ' '); do A="$A --job $j"; done
          [ "${{ inputs.dry_run }}" = "true" ] && A="$A --dry-run"
          case "${{ inputs.mode }}" in
            paper)   python robots/import/importer.py $A ;;
            tag)     cd robots/import && if [ "${{ inputs.dry_run }}" = "true" ]; then python tag.py --dry-run; else python tag.py --apply; fi ;;
            publish) python robots/import/publish.py $A ;;
          esac
      - name: Patterns (same-type questions, all subjects)
        if: ${{ inputs.mode == 'publish' && inputs.dry_run == false || inputs.mode == 'paper' && inputs.dry_run == false }}
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python robots/import/group.py
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-reports
          path: |
            work/report_*.json
            work/publish_*.json
            work/*/debug_pairs.json
          if-no-files-found: ignore
