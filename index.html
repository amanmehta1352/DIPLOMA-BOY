<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<meta name="description" content="Diploma Boy: RRB JE और SSC JE की तैयारी, PYQ, प्रैक्टिस और मॉक।">
<meta property="og:title" content="Diploma Boy">
<meta property="og:description" content="RRB JE और SSC JE की तैयारी, PYQ, प्रैक्टिस और मॉक।">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Diploma Boy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap">
<style>
/* Diploma Boy — identity: an engineering drawing sheet. Paper, drafting blue, signal saffron.
   One memorable element: the "title block" on Today (like the corner block of a drawing sheet). */
:root{
  --paper:#F5F6F2; --sheet:#FFFFFF; --ink:#16233A; --ink2:#4A5568; --rule:#DCE0D8; --grid:rgba(36,87,197,.07);
  --blue:#2457C5; --blue-soft:#E7EEFB; --saffron:#F2A007; --saffron-soft:#FFF4DC;
  --ok:#17744C; --ok-soft:#E3F4EC; --bad:#C8372D; --bad-soft:#FBE9E7; --mark:#7A4CC2;
  --s-maths:#0E86B8; --s-reasoning:#7A4CC2; --s-general-science:#1F8A5B; --s-general-awareness:#C77700; --s-eng:#C8372D;
  --r1:10px; --r2:16px; --shadow:0 1px 0 rgba(22,35,58,.06), 0 6px 18px -12px rgba(22,35,58,.35);
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px;
  --fs-body:16px; --fs-small:14px; --fs-title:24px; --fs-h2:18px; --tap:48px; --ease:150ms ease-out;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1522; --sheet:#152034; --ink:#E8EDF6; --ink2:#A3AEC2; --rule:#26334A; --grid:rgba(120,160,240,.06);
  --blue:#7EA6F5; --blue-soft:#1C2D4D; --saffron:#F5B83D; --saffron-soft:#3A2E12; --ok:#4CC78E; --ok-soft:#14352A; --bad:#F07A6E; --bad-soft:#3E1D1A; --mark:#B595F0;
  --shadow:0 1px 0 rgba(0,0,0,.3);}}
:root[data-theme="dark"]{
  --paper:#0E1522; --sheet:#152034; --ink:#E8EDF6; --ink2:#A3AEC2; --rule:#26334A; --grid:rgba(120,160,240,.06);
  --blue:#7EA6F5; --blue-soft:#1C2D4D; --saffron:#F5B83D; --saffron-soft:#3A2E12; --ok:#4CC78E; --ok-soft:#14352A; --bad:#F07A6E; --bad-soft:#3E1D1A; --mark:#B595F0;
  --shadow:0 1px 0 rgba(0,0,0,.3);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:Mukta,"Noto Sans Devanagari",system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.hide{display:none!important}
.muted{color:var(--ink2)}
.small{font-size:14px}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:18px;margin:24px 0 10px;font-weight:700}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.spacer{flex:1}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 14px;font-size:15px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:44px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--sheet)}
.lang button{border:0;background:none;padding:6px 11px;font-size:14px;cursor:pointer;min-height:44px;color:var(--ink2)}
.lang button.on{background:var(--blue);color:#fff}
.tblock{margin:12px 0 0;background:var(--sheet);border:2px solid var(--ink);border-radius:4px;display:grid;grid-template-columns:1.4fr 1fr .8fr;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px}
.tblock>div{padding:10px 12px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);min-width:0}
.tblock>div:nth-child(3){border-right:0}
.tblock .k{font-size:13px;color:var(--ink2)}
.tblock .v{font-weight:800;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.tblock .v.big{font-size:24px}
.tblock .wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;border-right:0;border-bottom:0}
.ring{--p:0;width:60px;height:60px;border-radius:50%;flex:none;background:conic-gradient(var(--saffron) calc(var(--p)*1%),var(--rule) 0);display:grid;place-items:center}
.ring::after{content:attr(data-t);width:46px;height:46px;border-radius:50%;background:var(--sheet);display:grid;place-items:center;font-weight:800;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:var(--r1);background:var(--blue);color:#fff;font-weight:700;font-size:17px;cursor:pointer;padding:10px 16px;text-align:center;line-height:1.25}
:root[data-theme="dark"] .btn:not(.line):not(.quiet):not(.saffron){color:#0E1522}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.line):not(.quiet):not(.saffron){color:#0E1522}}
.btn.saffron{background:var(--saffron);color:#1B1300}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.quiet{background:var(--blue-soft);color:var(--blue)}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.loading{opacity:.7;pointer-events:none}
.btn.loading::after{content:'';width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{background:var(--bad-soft);color:var(--bad);border-radius:var(--r1);padding:10px 12px;font-size:15px;font-weight:600}
.gal-sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.gal-sw div{border-radius:var(--r1);padding:10px;min-height:56px;font-size:13px;border:1px solid var(--rule)}
.gal-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gal-sec{margin:var(--sp5) 0 var(--sp2)}
.datef{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r1);padding:6px 6px 6px 14px;min-height:var(--tap)}
.datef input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;min-height:44px;color-scheme:light dark}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r2);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--rule);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;min-height:64px}
a.item{color:inherit;text-decoration:none}
.item:first-child{border-top:0}
.item .bar4{width:4px;align-self:stretch;border-radius:4px;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:16px;line-height:1.3}
.item .tx span{font-size:14px;color:var(--ink2)}
.meter{height:6px;background:var(--rule);border-radius:9px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:9px}
.chev{color:var(--ink2);flex:none;display:flex}
.empty{padding:22px 16px;text-align:center;color:var(--ink2)}
.note{background:var(--saffron-soft);border-left:4px solid var(--saffron);padding:10px 12px;border-radius:8px;font-size:15px;margin:12px 0}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.tag.pyq{background:var(--ink);color:var(--paper)}
.hero{padding:28px 0 8px}
.hero p{margin:8px 0 0;color:var(--ink2)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 24px}
.bcard{background:var(--sheet);border:1.5px solid var(--rule);border-radius:var(--r2);padding:16px 14px;text-align:left;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.bcard b{font-size:19px;line-height:1.2}
.bcard span{font-size:13px;color:var(--ink2)}
.bcard.on{border-color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.dock .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
.dock button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:12px;color:var(--ink2);cursor:pointer;min-height:58px;position:relative}
.dock button svg{width:24px;height:24px}
.dock button.on{color:var(--blue);font-weight:700}
.dock button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.dock .badge{position:absolute;top:5px;left:56%;background:var(--saffron);color:#1B1300;font-size:11px;font-weight:800;border-radius:9px;padding:0 5px;min-width:18px;line-height:17px}
.sheet{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column}
.sheet-top{background:var(--sheet);border-bottom:1px solid var(--rule)}
.sheet-top .wrap{display:flex;align-items:center;gap:8px;height:56px}
.icon-btn{border:0;background:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon-btn svg{width:24px;height:24px}
.prog{height:4px;background:var(--rule)}
.prog i{display:block;height:100%;background:var(--blue);transition:width .25s}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body .wrap{padding-top:14px;padding-bottom:110px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.pat{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:48px;padding:0 12px;border:1.5px solid var(--blue);border-radius:22px;background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:14px;cursor:pointer}
.pat svg{width:18px;height:18px}
.qtext{font-size:18px;line-height:1.55;margin:12px 0 4px;font-weight:500}
.qtext .en{display:block;font-size:15px;color:var(--ink2);font-weight:400;margin-top:6px}
.qimg{max-width:100%;display:block;margin:10px 0;background:#fff;border-radius:8px;border:1px solid var(--rule)}
.mt{font-size:12px;color:var(--ink2);margin-top:2px}
.opts{margin-top:14px;display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;min-height:54px;border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);cursor:pointer;font-size:16px;line-height:1.45}
.opt:disabled{cursor:default}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt .ot{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .ot .en{display:block;font-size:14px;color:var(--ink2)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.15;margin:0 2px}
.frac i{font-style:normal}.frac i:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}
.opt img{max-width:100%;max-height:84px;width:auto;height:auto;display:block;background:#fff;padding:4px;border-radius:6px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)} .opt.sel .l{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .l{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .l{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.verdict{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)} .verdict.skip{background:var(--saffron-soft);color:var(--ink)}
.sol{margin-top:10px;background:var(--sheet);border:1px dashed var(--ink2);border-radius:12px;padding:12px 14px;font-size:15px}
.sheet-foot{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:55}
.sheet-foot .wrap{display:flex;gap:8px}
.sheet-foot .btn{min-height:48px;font-size:16px;padding:8px 10px}
.timer{font-weight:800;font-variant-numeric:tabular-nums;font-size:17px;padding:4px 10px;border-radius:8px;background:var(--blue-soft);color:var(--blue)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.pal button{height:44px;border-radius:8px;border:1.5px solid var(--rule);background:var(--sheet);cursor:pointer;font-weight:700;font-size:14px}
.pal button.a{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.pal button.m{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.pal button.v{border-color:var(--bad);color:var(--bad)}
.pal button.cur{outline:3px solid var(--saffron);outline-offset:1px}
.pal button.am{background:var(--mark);border-color:var(--mark);color:var(--sheet);box-shadow:inset 0 -5px 0 var(--ok)}
.pal-h{font-size:14px;font-weight:700;margin:14px 0 8px;color:var(--ink2)}
.secbar{display:flex;gap:6px;overflow-x:auto;padding:6px 16px;scrollbar-width:none;background:var(--sheet);border-bottom:1px solid var(--rule)}
.secbar::-webkit-scrollbar{display:none}
.secbar .chip{min-height:44px;font-size:14px;padding:4px 12px}
.timer{border:0;cursor:pointer;min-height:44px}
.conf{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}
.conf .chip{font-size:14px}
.conf .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.padc{width:100%;height:min(60vh,420px);background:var(--paper);border:1px solid var(--rule);border-radius:12px;touch-action:none;display:block;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px}
.resume{border-left:4px solid var(--saffron)}
.avatar{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule);background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.avatar svg{width:22px;height:22px}.avatar.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.home{padding:18px 0 28px}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.h-big{font-size:27px;line-height:1.2;margin:6px 0 4px;font-weight:800;letter-spacing:-.015em}
.lead{margin:0 0 16px;font-size:15.5px}
.h-sec{font-size:19px;margin:26px 0 10px;font-weight:800}
.ctx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;color:var(--blue);font-size:15px}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:700;font-size:15px;cursor:pointer;padding:8px 4px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.linkbtn svg{width:18px;height:18px}
.pcard{background:var(--blue-soft);border:1.5px solid color-mix(in srgb,var(--blue) 22%,transparent);border-radius:22px;padding:18px 18px 16px;box-shadow:0 10px 28px -20px var(--blue)}
.pcard .pt{font-size:23px;line-height:1.25;font-weight:800;margin:8px 0 4px;letter-spacing:-.01em}
.pcard .ps{margin:0 0 14px;color:var(--ink2);font-size:15.5px}
.pbar{height:7px;border-radius:9px;background:color-mix(in srgb,var(--blue) 16%,transparent);overflow:hidden;margin:0 0 16px}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.pbtn{justify-content:space-between;border-radius:16px;min-height:56px;font-size:17.5px;padding:12px 20px}
.pcard .linkbtn{margin-top:6px;color:var(--bad);font-size:14px}
.flist{display:grid;gap:10px}
.fcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:18px;padding:14px 16px;min-height:72px;cursor:pointer;box-shadow:var(--shadow);transition:transform var(--ease)}
.fcard:active,.xcard:active{transform:scale(.985)}
.fcard .ft{flex:1;min-width:0}.fcard .ft b{display:block;font-size:17px;line-height:1.3}.fcard .ft span{font-size:14.5px;color:var(--ink2)}
.flink{color:var(--blue);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.xhead{display:flex;align-items:center;justify-content:space-between}.xhead .h-sec{margin-bottom:10px}
.xgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.xcard{background:var(--sheet);border:1px solid var(--rule);border-radius:18px;padding:14px 12px;min-height:88px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform var(--ease)}
.xcard svg{width:24px;height:24px;color:var(--blue)}.xcard b{font-size:15.5px;line-height:1.25}
.steps{background:var(--sheet);border:1px solid var(--rule);border-radius:18px;padding:6px 16px}
.steps>div{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}.steps>div:first-child{border-top:0}
.steps b{width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none;font-size:14px}
.steps span{display:flex;flex-direction:column;font-size:14.5px;color:var(--ink2)}.steps strong{color:var(--ink);font-size:16.5px}
.stags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.stags i{font-style:normal;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.qs{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);min-height:48px}
.qsr{max-height:60vh;overflow:auto}
.bcard{border-radius:18px}
.bcard:disabled{opacity:.5;cursor:default}
.panel{border-radius:18px}
@media (min-width:760px){.xgrid{gap:14px}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink2);margin:10px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,16,28,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--sheet);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.stat span{font-size:13px;color:var(--ink2)}
.score{display:flex;align-items:baseline;gap:6px;margin-top:10px}

<body>
<header class="top"><div class="wrap">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M2 21h28M18 21v9" stroke="currentColor" stroke-width="2"/><path d="M7 15l4.5-7 4.5 7 4.5-7 4.5 7" fill="none" stroke="#F2A007" stroke-width="2.5" stroke-linejoin="round"/></svg>Diploma Boy</div>

<script>
/* ============ CONFIG ============ */
const SB={url:'https://wobmtlcpszcntczkebtt.supabase.co', key:'sb_publishable_7ZZEUDULfYaMHSeLIxfluQ_fZWSCi8R'}; // publishable key: safe in the app
const REV=[1,3,7,15,30];   // spaced revision, days
/* One data source, three views: विषय (all questions of a chapter), PYQ (official papers), Practice (our own questions). */
const DATA={
  branches:[{id:'mechanical',hi:'मैकेनिकल',en:'Mechanical'},{id:'civil',hi:'सिविल',en:'Civil'},{id:'electrical',hi:'इलेक्ट्रिकल',en:'Electrical'},{id:'electronics',hi:'इलेक्ट्रॉनिक्स',en:'Electronics'},{id:'computer',hi:'कंप्यूटर / आईटी',en:'Computer / IT'}],
  subjects:[{id:'maths',hi:'गणित',en:'Mathematics',branch:null},{id:'reasoning',hi:'रीज़निंग',en:'Reasoning',branch:null},{id:'general-science',hi:'सामान्य विज्ञान',en:'General Science',branch:null},{id:'general-awareness',hi:'सामान्य जागरूकता',en:'General Awareness',branch:null}],
  exams:[
    {id:'rrb-je-cbt1',hi:'आरआरबी जेई सीबीटी 1',en:'RRB JE CBT 1',branches:['mechanical','civil','electrical','electronics','computer'],ready:false},
    {id:'ssc-je-paper1',hi:'एसएससी जेई पेपर I',en:'SSC JE Paper I',branches:['mechanical','civil','electrical'],ready:false},
    {id:'isro',hi:'इसरो',en:'ISRO',family:'isro',fhi:'इसरो',fen:'ISRO',branches:['electronics','computer','electrical','mechanical'],ready:false,soon:true},
    {id:'drdo',hi:'डीआरडीओ',en:'DRDO',family:'drdo',fhi:'डीआरडीओ',fen:'DRDO',branches:['electronics','computer','mechanical'],ready:false,soon:true}]
};
const COMMON=['maths','reasoning','general-science','general-awareness'];
const R={ok:false,topics:{},sources:{},stats:{}};

/* ============ STATE (saved on this phone) ============ */
const KEY='diploma-boy-v2';
let S={lang:'both',theme:'auto',branch:null,exam:null,tab:'today',goal:30,examDate:null,fams:null,stageF:'all',last:null,st:{},tp:{},days:{},mis:{},mocks:[],seen:{}};
try{const o=JSON.parse(localStorage.getItem(KEY)||'null'); if(o) Object.assign(S,o);
  else{const v1=JSON.parse(localStorage.getItem('diploma-boy-v1')||'null'); if(v1){S.lang=v1.lang||S.lang;S.branch=v1.branch||null;}}}catch(e){}
if(S.tab==='practice'&&!S.v3){S.tab='today';} S.v3=1;
function save(){try{const {lang,theme,branch,exam,tab,goal,examDate,fams,stageF,last,st,tp,days,mis,mocks,seen,v3}=S;localStorage.setItem(KEY,JSON.stringify({lang,theme,branch,exam,tab,goal,examDate,fams,stageF,last,st,tp,days,mis,mocks,seen,v3}))}catch(e){}}
let V={sheet:null,view:null,modal:null};   // screen state, not saved

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const BI=(hi,en)=>(hi&&en&&hi!==en)?hi+' / '+en:(hi||en||'');
const L=(hi,en)=>S.lang==='en'?(en||hi):S.lang==='both'?BI(hi,en):(hi||en);
const N=o=>{ if(!o) return ''; if(S.lang==='en') return o.en||o.hi||''; if(S.lang==='hi') return o.hi||o.en||''; return BI(o.hi,o.en); };
const byId=(a,id)=>a.find(x=>x.id===id);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const pct=(c,t)=>t?Math.round(c/t*100):0;
const fmtDate=s=>s?s.split('-').reverse().join('/'):'';
function TX(o){ if(!o) return ''; const hi=o.hi||'', en=o.en||'';
  if(S.lang==='en'||!hi) return en||hi; if(S.lang==='hi'||hi===en) return hi; return hi+'<span class="en">'+en+'</span>'; }
const ICON={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  learn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM4 17a2 2 0 0 1 2-2h12"/></svg>',
  pyq:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>',
  practice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
  chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  mistakes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  arrow:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>'
};
const subjColor=id=>/engineering/.test(id)?'var(--s-eng)':`var(--s-${id},var(--blue))`;
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
const backBtn=(act,label)=>`<div style="display:flex;align-items:center;gap:4px;margin-top:10px"><button class="icon-btn" data-a="${act}" aria-label="${L('वापस','Back')}">${ICON.back}</button><h1 style="font-size:22px">${label}</h1></div>`;

/* ============ DATABASE ============ */
async function sb(path){ const r=await fetch(SB.url+'/rest/v1/'+path,{headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Accept-Profile':'mtb'}}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function loadRemote(){
  try{
    const [br,ex,eb,su,tp,src,cs,secs,ps]=await Promise.all([
      sb('branches?select=id,slug,name_en,name_hi,sort&order=sort'),
      sb('exams?select=id,slug,name_en,name_hi,active,pattern,family_slug,family_hi,family_en,stage_hi,stage_en,stage_sort&active=eq.true&order=id'),
      sb('exam_branches?select=exam_id,branch_id'),
      sb('subjects?select=id,slug,name_en,name_hi,branch_id&order=id'),
      sb('topics?select=id,slug,name_en,name_hi,subject_id,sort,is_chapter,unit_en,unit_hi&order=sort,id'),
      sb('sources?select=id,exam_id,branch_id,paper_date,shift,note,kind&order=paper_date.desc,shift'),
      sb('chapter_stats?select=chapter_id,kind,n'),
      sb('exam_sections?select=exam_id,sort,slug,name_hi,name_en,questions,qno_from,qno_to,subjects&order=exam_id,sort').catch(()=>[]),
      sb('paper_stats?select=source_id,n').catch(()=>[])]);
    const bS={}; br.forEach(b=>bS[b.id]=b.slug);
    const sS={}; su.forEach(s=>sS[s.id]=s.slug);
    DATA.branches=br.map(b=>({id:b.slug,hi:b.name_hi,en:b.name_en}));
    DATA.subjects=su.map(s=>({id:s.slug,hi:s.name_hi,en:s.name_en,branch:s.branch_id==null?null:bS[s.branch_id]}));
    const exs=ex.map(e=>({id:e.slug,dbid:e.id,hi:e.name_hi,en:e.name_en,family:e.family_slug||e.slug,fhi:e.family_hi||e.name_hi,fen:e.family_en||e.name_en,stage:e.stage_en?{hi:e.stage_hi||e.stage_en,en:e.stage_en}:null,stageSort:e.stage_sort||1,pattern:e.pattern||{},sections:secs.filter(x=>x.exam_id===e.id).map(x=>({id:x.slug,hi:x.name_hi,en:x.name_en,n:x.questions,from:x.qno_from,to:x.qno_to,subjects:x.subjects})),branches:(eb.some(x=>x.exam_id===e.id)?eb.filter(x=>x.exam_id===e.id).map(x=>bS[x.branch_id]):br.map(b=>b.slug)),ready:true}));   /* an exam with no branch rows (RRB NTPC) is open to every branch */
    DATA.exams=[...exs,...DATA.exams.filter(e=>e.soon&&!exs.some(x=>x.id===e.id))];
    R.topics={}; tp.forEach(t=>R.topics[t.id]={id:t.id,hi:t.name_hi,en:t.name_en,subject:sS[t.subject_id],chapter:t.is_chapter,unit:t.unit_en?{hi:t.unit_hi,en:t.unit_en}:null,sort:t.sort});
    R.sources={}; src.forEach(x=>R.sources[x.id]={...x,exam:(exs.find(e=>e.dbid===x.exam_id)||{}).id,branch:bS[x.branch_id]||null});
    R.stats={}; cs.forEach(x=>{ const s=R.stats[x.chapter_id]||(R.stats[x.chapter_id]={pyq:0,practice:0}); s[x.kind]=x.n; });
    R.pstat={}; ps.forEach(x=>R.pstat[x.source_id]=x.n);
    R.ok=true;
  }catch(e){ R.ok=false; }
}
const QSEL='id,kind,topic_id,chapter_id,source_id,source_qno,stem,options,answer,solution,pattern_id,pattern_n';
function norm(r){ const ch=R.topics[r.chapter_id]||R.topics[r.topic_id]||{}; return {id:r.id,kind:r.kind,topic:ch,subj:ch.subject,src:R.sources[r.source_id],qno:r.source_qno,stem:r.stem||{},opts:r.options||[],a:r.answer,sol:r.solution,pat:r.pattern_id,patn:r.pattern_n}; }
function examSources(exam,branch){ return Object.values(R.sources).filter(s=>s.exam===exam&&(!s.branch||!branch||s.branch===branch)).sort((x,y)=>(y.paper_date||'').localeCompare(x.paper_date||'')||x.shift-y.shift); }
async function paged(scope,base){
  const off=S.seen[scope]||0; let rows=await sb(base+'&order=id&limit=20&offset='+off);
  if(!rows.length&&off){ rows=await sb(base+'&order=id&limit=20&offset=0'); S.seen[scope]=0; }
  S.seen[scope]=(S.seen[scope]||0)+rows.length; save(); return rows.map(norm);
}
// विषय / Practice view: by chapter (or whole subject), any exam
function fetchChapter(subj,chapterId,kind){
  const chs=chapterId?[chapterId]:chaptersOf(subj).map(t=>t.id); if(!chs.length) return Promise.resolve([]);
  return paged(`ch|${subj}|${chapterId||'all'}|${kind||'all'}`,`questions?select=${QSEL}&chapter_id=in.(${chs.join(',')})${kind?'&kind=eq.'+kind:''}`);   /* one question per same-type pattern; its chip opens the whole pattern */
}
// PYQ view: one exam, by subject (exam's own papers only)
function fetchExamSubject(exam,subj){
  const sids=examSources(exam,isBranchSubj(subj)?S.branch:null).map(s=>s.id);
  const tids=Object.values(R.topics).filter(t=>t.subject===subj).map(t=>t.id);
  if(!sids.length||!tids.length) return Promise.resolve([]);
  return paged(`ex|${exam}|${subj}`,`questions?select=${QSEL}&source_id=in.(${sids.join(',')})&topic_id=in.(${tids.join(',')})`);
}
async function fetchPattern(pid){ return (await sb(`questions?select=${QSEL}&pattern_id=eq.${pid}&order=id`)).map(norm); }   /* every exam, every year */
async function fetchPaper(srcId){ return (await sb(`questions?select=${QSEL}&source_id=eq.${srcId}&order=source_qno`)).map(norm); }
async function fetchIds(ids){ const out=[]; for(let i=0;i<ids.length;i+=40) out.push(...await sb(`questions?select=${QSEL}&id=in.(${ids.slice(i,i+40).join(',')})`)); return out.map(norm); }

/* ============ DERIVED ============ */
const isBranchSubj=id=>{const s=byId(DATA.subjects,id);return !!(s&&s.branch)};
const examsFor=b=>DATA.exams.filter(e=>e.branches.includes(b));
function famList(branch){ const m=new Map();
  DATA.exams.filter(e=>!branch||e.branches.includes(branch)).forEach(e=>{ const f=e.family||e.id;
    if(!m.has(f)) m.set(f,{id:f,hi:e.fhi||e.hi,en:e.fen||e.en,ready:false,stages:[]}); const o=m.get(f); o.stages.push(e); if(e.ready) o.ready=true; });
  m.forEach(o=>o.stages.sort((a,b)=>(a.stageSort||1)-(b.stageSort||1))); return [...m.values()]; }
function myFams(){ const all=famList(S.branch).filter(f=>f.ready); const sel=(S.fams||[]).filter(id=>all.some(f=>f.id===id)); return sel.length?all.filter(f=>sel.includes(f.id)):all; }
function myStages(){ return myFams().flatMap(f=>f.stages.filter(e=>e.ready)); }
const readyExams=()=>myStages();
const stageLabel=e=>e.stage?`${N({hi:e.fhi,en:e.fen})} ${N(e.stage)}`:N(e);
const stageShort=e=>myFams().length>1?stageLabel(e):(e.stage?N(e.stage):N(e));
function subjectPlan(only){
  const stages=only&&only!=='all'?myStages().filter(e=>e.id===only):myStages(); const m=new Map();
  stages.forEach(e=>examSubjects(e).forEach(s=>{ if(!m.has(s.id)) m.set(s.id,{s,tags:[]}); m.get(s.id).tags.push(e); }));
  if(!m.size) mySubjects().forEach(s=>m.set(s.id,{s,tags:[]}));
  return [...m.values()]; }
function curExam(){ const r=readyExams(); return r.find(e=>e.id===S.exam)||r[0]||null; }
function examSubjects(e){
  if(!e) return [];
  const secs=e.sections&&e.sections.length?e.sections.flatMap(x=>x.subjects):((e.pattern&&e.pattern.sections)||COMMON);
  const out=[]; secs.forEach(x=>{ if(x==='branch-engineering') DATA.subjects.filter(s=>s.branch===S.branch).forEach(s=>out.push(s)); else { const s=byId(DATA.subjects,x); if(s) out.push(s);} });
  return out;
}
function sectionOf(e,subj){ if(!e||!e.sections) return null; return e.sections.find(x=>x.subjects.includes(subj)||(x.subjects.includes('branch-engineering')&&isBranchSubj(subj)))||null; }
const paperTotal=e=>(e&&e.sections&&e.sections.length)?e.sections.reduce((a,x)=>a+x.n,0):((e&&e.pattern&&e.pattern.questions)||0);
function daysLeft(){ if(!S.examDate) return null; return Math.round((new Date(S.examDate+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5); }
function patternCard(e){ const p=e.pattern||{}; if(!e.sections||!e.sections.length) return '';
  return `<div class="panel" style="padding:12px 14px"><b style="display:block;margin-bottom:6px">${L('परीक्षा का पैटर्न','Exam pattern')}</b>
  <div class="gal-row">${e.sections.map(x=>`<span class="tag" style="font-size:13px;padding:3px 8px">${N(x)} · ${x.n}</span>`).join('')}</div>
  <div class="small muted" style="margin-top:8px">${L(`कुल ${paperTotal(e)} सवाल · ${p.minutes||'—'} मिनट · हर सवाल ${p.marks_per_q||1} अंक · गलत पर −${negTxt(p.negative_per_wrong)}`,`${paperTotal(e)} questions · ${p.minutes||'—'} min · ${p.marks_per_q||1} mark each · −${negTxt(p.negative_per_wrong)} per wrong`)}</div></div>`; }
function paperLine(e,src){ const n=(R.pstat||{})[src.id], t=paperTotal(e); if(!n||!t) return ''; const miss=t-n;
  return miss<=0?L(`${n} सवाल`,`${n} questions`):n<t*.8?L(`${n}/${t} सवाल · अधूरा पेपर`,`${n}/${t} questions · incomplete`):L(`${n}/${t} सवाल`,`${n}/${t} questions`); }
function groupBySection(by){ const e=curExam(), g=new Map();
  Object.entries(by).forEach(([sj,v])=>{ const sec=sectionOf(e,sj); const nm=sec?N(sec):N(byId(DATA.subjects,sj)||{hi:sj,en:sj}); const o=g.get(nm)||{c:0,w:0,u:0}; o.c+=v.c; o.w+=v.w; o.u+=v.u; g.set(nm,o); });
  return [...g.entries()]; }
function mockSecs(z){ const e=byId(DATA.exams,z.exam); if(!e||!e.sections||!e.sections.length) return [];
  return e.sections.map(sec=>({sec,idx:z.list.map((q,i)=>sectionOf(e,q.subj)===sec?i:-1).filter(i=>i>=0)})).filter(x=>x.idx.length); }
const mmss=ms=>{ const t=Math.round(ms/1000); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
function resumeCard(){ const o=pendingMock(); if(!o) return ''; const left=Math.max(0,Math.round((o.end-Date.now())/60000)), a=o.ans.filter(x=>x!=null).length;
  return `<div class="panel resume" style="margin-top:12px"><button class="item" data-a="m-resume"><span class="tx"><b>${L('अधूरा मॉक जारी रखें','Continue unfinished mock')}</b><span>${o.title} · ${L(`${a}/${o.list.length} हल, ${left} मिनट बचे`,`${a}/${o.list.length} answered, ${left} min left`)}</span></span><span class="chev">${ICON.chev}</span></button>
  <button class="item" data-a="m-drop-ask" style="min-height:48px"><span class="tx"><span style="color:var(--bad)">${L('यह मॉक हटा दें','Discard this mock')}</span></span></button></div>`; }
function softLanding(r){ let m='';
  if(r.prev){ const d=+(r.score-r.prev.score).toFixed(2);
    m=d>0?L(`पिछले मॉक से ${d} अंक ज़्यादा। अच्छा सुधार!`,`${d} marks more than your last mock. Good progress!`):d===0?L('पिछले मॉक जितने अंक। अगली बार गलत जवाब कम करने पर ध्यान दें।','Same as your last mock. Next time, cut down wrong answers.'):L(`पिछले मॉक से ${-d} अंक कम। कोई बात नहीं, नीचे देखें कहाँ अंक गए।`,`${-d} marks below your last mock. That's okay, see below where marks went.`); }
  else m=r.c?L(`आपने ${r.c} सवाल सही किए। यह आपका पहला मॉक है, अब इससे आगे बढ़ना है।`,`You got ${r.c} right. This is your first mock; now build on it.`):L('पहला मॉक दिया, यही शुरुआत है।','First mock done. That is the start.');
  return `<div class="note" style="margin-top:12px">${m}</div>`; }
function confBlock(r){ const cf=r.cf; if(!cf) return ''; const t=cf.sure.t+cf.half.t+cf.guess.t; if(!t) return '';
  const row=(k,hi,en)=>cf[k].t?`<tr><td>${L(hi,en)}</td><td>${cf[k].t}</td><td>${cf[k].c}</td><td>${pct(cf[k].c,cf[k].t)}%</td></tr>`:'';
  return `<h2>${L('कितने पक्के थे?','How sure were you?')}</h2><div class="panel" style="padding:4px 10px"><table class="sub"><tr><th></th><th>${L('जवाब','Answers')}</th><th>${L('सही','Right')}</th><th>%</th></tr>${row('sure','पक्का','Sure')}${row('half','50-50','50-50')}${row('guess','तुक्का','Guess')}</table></div>
  ${cf.guess.t?`<p class="small muted" style="margin:8px 0 0">${L(`तुक्के न लगाते तो ${r.noGuess} अंक आते (अभी ${r.score})।`,`Without guesses you would have ${r.noGuess} (now ${r.score}).`)}</p>`:''}`; }
function timeBlock(z){ const r=z.res; if(!r.used) return ''; const n=z.list.length, done=r.c+r.w, avg=done?r.used/done:0, allow=(z.minutes||90)*60000/n;
  const slow=z.ms.map((v,i)=>[v||0,i]).sort((a,b)=>b[0]-a[0]).slice(0,3).filter(x=>x[0]>=1000);
  return `<h2>${L('समय','Time')}</h2><div class="panel" style="padding:12px 14px"><div>${L(`कुल समय: ${mmss(r.used)} मिनट`,`Time used: ${mmss(r.used)} min`)}</div>
  ${done?`<div class="small muted" style="margin-top:4px">${L(`हल किए सवाल पर औसत ${mmss(avg)} · परीक्षा में हर सवाल को ${mmss(allow)} मिलता है`,`Average ${mmss(avg)} per answered question · the exam allows ${mmss(allow)} per question`)}</div>`:''}
  ${slow.length?`<div class="small muted" style="margin-top:4px">${L('सबसे ज़्यादा समय','Slowest')}: ${slow.map(x=>`Q${x[1]+1} (${mmss(x[0])})`).join(', ')}</div>`:''}</div>`; }
function stageChips(){ const st=myStages(); if(st.length<2) return '';

function mySubjects(){ return [...COMMON.map(id=>byId(DATA.subjects,id)).filter(Boolean),...DATA.subjects.filter(s=>s.branch===S.branch)]; }
function chaptersOf(subj){ return Object.values(R.topics).filter(t=>t.chapter&&t.subject===subj).sort((a,b)=>(a.sort||0)-(b.sort||0)||a.id-b.id); }
function cnt(chId,kind){ const s=R.stats[chId]||{}; return kind?(s[kind]||0):((s.pyq||0)+(s.practice||0)); }
function subjCount(subj,kind){ return chaptersOf(subj).reduce((a,t)=>a+cnt(t.id,kind),0); }
const stat=id=>S.st[id]||{c:0,t:0};
const todayCount=()=>S.days[today()]||0;
function streak(){ let n=0; for(let i=0;i<400;i++){ if(S.days[addDays(-i)]) n++; else if(i>0) break; } return n; }
function dueMistakes(){ const t=today(); return Object.keys(S.mis).filter(id=>S.mis[id].due<=t).map(Number); }
function weakTopics(){ const ok=new Set(mySubjects().map(s=>s.id)); return Object.entries(S.tp).filter(([id,v])=>v.t>=4&&R.topics[id]&&ok.has(R.topics[id].subject)).map(([id,v])=>({id:+id,acc:pct(v.c,v.t),t:v.t})).filter(x=>x.acc<70).sort((a,b)=>a.acc-b.acc).slice(0,3); }
function negTxt(n){ if(!n) return '0'; if(Math.abs(n-.25)<.01) return '¼'; if(Math.abs(n-1/3)<.01) return '⅓'; return n; }
function bump(q,ok){
  const s=S.st[q.subj]||{c:0,t:0}; s.t++; if(ok)s.c++; S.st[q.subj]=s;
  const tid=q.topic&&q.topic.id; if(tid){ const v=S.tp[tid]||{c:0,t:0}; v.t++; if(ok)v.c++; S.tp[tid]=v; }
  S.days[today()]=(S.days[today()]||0)+1;
}
function toMistakes(q,ok){
  const m=S.mis[q.id];
  if(!ok) S.mis[q.id]={subj:q.subj,w:(m?m.w:0)+1,step:0,due:addDays(1)};
  else if(m){ const step=m.step+1; if(step>=REV.length) delete S.mis[q.id]; else S.mis[q.id]={...m,step,due:addDays(REV[step])}; }
}

function qBlock(q,mode,sel){
  const reveal=mode!=='mock'&&sel!=null, src=q.src, pyq=q.kind!=='practice';
  const meta=`<div class="qmeta"><span class="tag ${pyq?'pyq':''}">${pyq?'PYQ':L('प्रैक्टिस','Practice')}</span><span>${N(q.topic)}</span>${pyq&&src?`<span>${N(byId(DATA.exams,src.exam)||{})} ${fmtDate(src.paper_date)}, ${L('शिफ़्ट','shift')} ${src.shift}, Q${q.qno}</span>`:''}${q.patn>1&&mode==='practice'&&!(V.sheet&&V.sheet.meta&&V.sheet.meta.pat)?`<button class="pat" data-a="pattern" data-id="${q.pat}" data-n="${q.patn}" aria-label="${L(`ऐसे ${q.patn} सवाल, सब परीक्षाओं के`,`${q.patn} same-type questions from all exams`)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>${q.patn}</button>`:''}</div>`;
  const pic=S.lang==='en'?(q.stem.img||q.stem.img_hi):(q.stem.img_hi||q.stem.img);   /* figure questions: picture of the official question block */
  /* never the same question twice: a picture that only copies the question (stem.dup) is shown only when the reader's language has no text */
  const own=S.lang==='en'?(q.stem.en||''):(q.stem.hi||q.stem.en||'');
  let showText=!(q.stem.fig&&pic), showPic=!!pic;
  if(pic&&q.stem.dup&&!q.stem.fig){ if(!own) showText=false; else if(S.lang!=='en'||q.stem.dup==='all') showPic=false; }
  else if(pic&&q.stem.qpic&&!own) showText=false;   /* table picture that already holds the whole question */
  const imgs=showPic?[].concat(pic).map(u=>`<img class="qimg" src="${u}" loading="lazy" alt="${L('सवाल का चित्र','Question figure')}">`).join(''):'';
  const lab=k=>q.stem.fig?String(k+1):'ABCD'[k];   /* figure pictures number their options 1-4 */
  const opts=q.opts.map((o,k)=>{let c=''; if(reveal){ if(k===q.a)c='right'; else if(k===sel)c='wrong'; } else if(sel===k) c='sel';
    /* one form per option, never two: text in the reader's language if it exists, otherwise the official picture */
    const own=S.lang==='en'?(o.en||''):(o.hi||o.en||''), usePic=!!o.img&&!own;
    const t=(q.stem.fig&&(o.en||'')===String(k+1))?L('चित्र में विकल्प '+(k+1),'Option '+(k+1)+' in the figure'):(usePic?'':TX(o).replace(/\b(\d{1,4})\/(\d{1,4})(?=\s*%)/g,'<span class="frac"><i>$1</i><i>$2</i></span>'));
    return `<button class="opt ${c}" data-a="pick" data-i="${k}" ${reveal?'disabled':''} aria-pressed="${sel===k}"><span class="l">${lab(k)}</span><span class="ot">${t}${usePic?`<img src="${o.img}" alt="${L('विकल्प '+lab(k),'Option '+lab(k))}">`:''}</span></button>`;}).join('');
  let after='';
  if(reveal){
    if(sel===-1) after=`<div class="verdict skip">${L(`छोड़ा। सही उत्तर ${lab(q.a)} है।`,`Skipped. The answer is ${lab(q.a)}.`)}</div>`;
    else { const ok=sel===q.a; after=`<div class="verdict ${ok?'ok':'bad'}" role="status">${ok?L('सही जवाब','Correct'):L(`गलत। सही उत्तर ${lab(q.a)} है।`,`Wrong. The answer is ${lab(q.a)}.`)}${!ok&&mode!=='review'?`<div class="small" style="font-weight:500">${L('गलती बुक में जोड़ दिया।','Added to the mistake book.')}</div>`:''}</div>`; }
    if(q.sol&&q.sol.hi) after+=`<div class="sol"><b>${L('हल','Solution')}:</b> ${q.sol.hi}</div>`;
  }
  return `${meta}${showText?`<div class="qtext">${TX(q.stem)}</div>`:''}${imgs}${q.stem.hi_mt&&S.lang!=='en'?`<div class="mt">हिंदी मशीन अनुवाद है, अंग्रेज़ी मूल प्रश्न है।</div>`:''}<div class="opts">${opts}</div>${after}`;
}
function clock(s){ s=Math.max(0,s|0); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function topBar(title,sub,extra='',closeAct='close'){ return `<div class="sheet-top"><div class="wrap"><button class="icon-btn" data-a="${closeAct}" aria-label="${L('बंद करें','Close')}">${ICON.close}</button><div style="flex:1;min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</b>${sub?`<span class="small muted">${sub}</span>`:''}</div>${extra}</div>`; }
function vSheet(){
  const z=V.sheet; if(!z) return '';
  if(z.loading) return `<div class="sheet" role="dialog" aria-modal="true">${topBar(z.title,'')}</div><div class="sheet-body"><div class="wrap"><div class="empty">${L('सवाल आ रहे हैं…','Loading questions…')}</div></div></div></div>`;
  if(!z.list.length) return `<div class="sheet" role="dialog" aria-modal="true">${topBar(z.title,'')}</div><div class="sheet-body"><div class="wrap"><div class="empty">${R.ok?L('यहाँ अभी सवाल नहीं हैं।','No questions here yet.'):L('सवाल लाने के लिए इंटरनेट चालू करें।','Turn on internet to load questions.')}</div><button class="btn" data-a="close">${L('वापस जाएँ','Go back')}</button></div></div></div>`;
  if(z.done) return vResult();
  const q=z.list[z.i], n=z.list.length, mock=z.mode==='mock', review=z.mode==='review';
  const sel=mock?z.ans[z.i]:review?(z.ansRef[z.i]==null?-1:z.ansRef[z.i]):z.pick;
  const answered=mock?z.ans.filter(x=>x!=null).length:0;
  const sub=mock?L(`${z.i+1}/${n} · हल ${answered}`,`${z.i+1}/${n} · done ${answered}`):L(`सवाल ${z.i+1} / ${n}`,`Question ${z.i+1} / ${n}`)+(review?'':`, ${L('सही','right')} ${z.c}`);
  const extra=mock?`<button class="timer ${z.left<300?'low':''}" id="tmr" data-a="t-hide" aria-label="${L('बचा समय (छुपाने के लिए दबाएँ)','Time left (tap to hide)')}">${z.hideT?L('समय देखें','Show time'):clock(z.left)}</button><button class="icon-btn" data-a="pad" aria-label="${L('रफ़ पेज','Rough pad')}">${ICON.pen}</button><button class="icon-btn" data-a="palette" aria-label="${L('सवाल सूची','Question list')}">${ICON.grid}</button>`:'';
  const secs=mock?mockSecs(z):[];
  const secBar=secs.length>1?`<div class="secbar" role="tablist" aria-label="${L('सेक्शन','Sections')}">${secs.map(x=>{const on=x.idx.includes(z.i), a=x.idx.filter(i=>z.ans[i]!=null).length; return `<button class="chip ${on?'on':''}" role="tab" aria-selected="${on}" data-a="sec-go" data-i="${x.idx[0]}">${N(x.sec)} ${a}/${x.idx.length}</button>`;}).join('')}</div>`:'';
  const conf=mock&&sel!=null?`<div class="conf"><span class="small muted">${L('कितना पक्का?','How sure?')}</span>${[['sure','पक्का','Sure'],['half','50-50','50-50'],['guess','तुक्का','Guess']].map(c=>`<button class="chip ${z.conf[z.i]===c[0]?'on':''}" data-a="m-conf" data-id="${c[0]}" aria-pressed="${z.conf[z.i]===c[0]}">${L(c[1],c[2])}</button>`).join('')}</div>`:'';
  const progW=Math.round((z.i+((!mock&&sel!=null)?1:0))/n*100);
  const foot=mock?`<div class="sheet-foot"><div class="wrap">
      <button class="btn line" style="flex:1" data-a="m-prev" ${z.i?'':'disabled'}>${L('पिछला','Previous')}</button>
      <button class="btn quiet" style="flex:1" data-a="m-mark" aria-pressed="${!!z.mark[z.i]}">${z.mark[z.i]?L('निशान हटाएँ','Unmark'):L('बाद में देखें','Mark')}</button>
      <button class="btn" style="flex:1.2" data-a="m-next">${z.i<n-1?L('सेव, अगला','Save, next'):L('जमा करें','Submit')}</button></div></div>`
    :`<div class="sheet-foot"><div class="wrap">${sel!=null?`<button class="btn" data-a="next">${z.i<n-1?L('अगला सवाल','Next question'):(review?L('ख़त्म, बंद करें','Done, close'):L('सेट ख़त्म करें','Finish set'))}</button>`:`<button class="btn line" data-a="skip">${L('छोड़ें, अगला','Skip')}</button>`}</div></div>`;
  return `<div class="sheet" role="dialog" aria-modal="true">${topBar(z.title,sub,extra,mock?'mock-exit':'close')}<div class="prog"><i style="width:${progW}%"></i></div>${secBar}</div>
   <div class="sheet-body" id="sbody"><div class="wrap">${qBlock(q,review?'review':z.mode,sel)}${conf}${mock&&sel!=null?`<button class="btn quiet" style="margin-top:12px" data-a="m-clear">${L('जवाब हटाएँ','Clear answer')}</button>`:''}${mock&&z.pad[z.i]?`<p class="small muted" style="margin-top:10px">${L('इस सवाल का रफ़ पेज सेव है।','Rough work saved for this question.')}</p>`:''}</div></div>${foot}</div>`;
}
function vResult(){
  const z=V.sheet;
  if(z.mode!=='mock') return `<div class="sheet" role="dialog" aria-modal="true">${topBar(z.title,'')}</div><div class="sheet-body"><div class="wrap">
    <h1 style="margin-top:8px">${L('सेट पूरा हुआ','Set complete')}</h1>
    <div class="score"><b>${z.c}</b><span class="muted">/ ${z.seen} ${L('सही','right')}</span></div>
    <div class="stats"><div class="stat"><b>${pct(z.c,z.seen)}%</b><span>${L('सही','Accuracy')}</span></div><div class="stat"><b>${z.seen-z.c}</b><span>${L('गलती बुक में','To mistakes')}</span></div><div class="stat"><b>${todayCount()}</b><span>${L('आज कुल','Today total')}</span></div></div>
    <div class="btn-row"><button class="btn line" data-a="close">${L('बंद करें','Close')}</button>${z.again?`<button class="btn" data-a="again">${L('अगले 20 सवाल','Next 20')}</button>`:`<button class="btn" data-a="close">${L('ठीक है','Done')}</button>`}</div></div></div></div>`;
  const r=z.res;
  return `<div class="sheet" role="dialog" aria-modal="true">${topBar(L('मॉक का नतीजा','Mock result'),z.title)}</div><div class="sheet-body"><div class="wrap">
   ${softLanding(r)}
   <div class="score"><b>${r.score}</b><span class="muted">/ ${r.max} ${L('अंक','marks')}</span></div>
   <div class="stats"><div class="stat"><b style="color:var(--ok)">${r.c}</b><span>${L('सही','Right')}</span></div><div class="stat"><b style="color:var(--bad)">${r.w}</b><span>${L('गलत','Wrong')} (−${r.neg})</span></div><div class="stat"><b>${r.u}</b><span>${L('छोड़े','Skipped')}</span></div></div>
   ${r.w?`<div class="note">${L(`गलत वाले ${r.w} सवाल छोड़ देते तो ${r.noguess} अंक आते। जिसमें पक्का न हों, उसे छोड़ना भी एक कला है।`,`Skipping the ${r.w} wrong ones would have given ${r.noguess}. Skipping what you are unsure of is a skill too.`)}</div>`:''}
   ${confBlock(r)}
   ${timeBlock(z)}
   <h2>${L('सेक्शन के अनुसार','By section')}</h2>
   <div class="panel" style="padding:4px 10px"><table class="sub"><tr><th>${L('विषय','Subject')}</th><th>${L('सही','Right')}</th><th>${L('गलत','Wrong')}</th><th>${L('छोड़े','Skip')}</th></tr>
   ${groupBySection(r.by).map(([nm,v])=>`<tr><td>${nm}</td><td>${v.c}</td><td>${v.w}</td><td>${v.u}</td></tr>`).join('')}</table></div>
   <div class="btn-row"><button class="btn line" data-a="m-review">${L('जवाब देखें','Review answers')}</button><button class="btn" data-a="close">${L('बंद करें','Close')}</button></div>
   <p class="small muted" style="margin-top:12px">${L('गलत सवाल गलती बुक में जोड़ दिए गए।','Wrong answers were added to the mistake book.')}</p></div></div></div>`;
}
function vPalette(){
  const z=V.sheet, st=i=>z.ans[i]!=null&&z.mark[i]?'am':z.mark[i]?'m':z.ans[i]!=null?'a':z.vis[i]?'v':'';
  const cnt=k=>z.list.filter((_,i)=>st(i)===k).length;
  const btn=i=>`<button class="${st(i)} ${i===z.i?'cur':''}" data-a="m-go" data-i="${i}" aria-label="${L('सवाल','Question')} ${i+1}">${i+1}</button>`;
  const secs=mockSecs(z);
  const grid=secs.length>1?secs.map(x=>`<div class="pal-h">${N(x.sec)}</div><div class="pal">${x.idx.map(btn).join('')}</div>`).join(''):`<div class="pal">${z.list.map((_,i)=>btn(i)).join('')}</div>`;
  return `<div class="modal" data-a="modal-close"><div class="box" data-stop="1" role="dialog" aria-modal="true"><div style="display:flex;align-items:center"><b style="font-size:18px;flex:1">${L('सवाल सूची','All questions')}</b><button class="icon-btn" data-a="modal-close" aria-label="${L('बंद करें','Close')}">${ICON.close}</button></div>
   <div class="legend"><span><i style="background:var(--ok)"></i>${L('हल किए','Answered')} ${cnt('a')}</span><span><i style="border:1.5px solid var(--bad)"></i>${L('देखा, हल नहीं','Not answered')} ${cnt('v')}</span><span><i style="border:1.5px solid var(--rule)"></i>${L('नहीं देखा','Not visited')} ${cnt('')}</span><span><i style="background:var(--mark)"></i>${L('बाद में देखें','Marked')} ${cnt('m')}</span><span><i style="background:var(--mark);box-shadow:inset 0 -3px 0 var(--ok)"></i>${L('हल + निशान','Answered & marked')} ${cnt('am')}</span></div>
   ${grid}
   <button class="btn saffron" style="margin-top:16px" data-a="m-submit-ask">${L('टेस्ट जमा करें','Submit test')}</button></div></div>`;
}
function vPad(){ return `<div class="modal" data-a="pad-close"><div class="box" data-stop="1" role="dialog" aria-modal="true" aria-label="${L('रफ़ पेज','Rough pad')}"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:18px;flex:1">${L('रफ़ पेज','Rough pad')} · ${L('सवाल','Q')} ${V.sheet.i+1}</b><button class="icon-btn" data-a="pad-close" aria-label="${L('बंद करें','Close')}">${ICON.close}</button></div>
  <p class="small muted" style="margin:4px 0 8px">${L('उँगली से लिखें। हर सवाल का रफ़ अलग सेव होता है।','Write with your finger. Each question keeps its own rough work.')}</p>
  <canvas id="pad" class="padc"></canvas>
  <div class="btn-row"><button class="btn line" data-a="pad-clear">${L('साफ़ करें','Clear')}</button><button class="btn" data-a="pad-close">${L('सेव, बंद करें','Save, close')}</button></div></div></div>`; }
function initPad(){ const c=$('#pad'); if(!c||c.dataset.ok) return; c.dataset.ok=1; const r=c.getBoundingClientRect(), d=window.devicePixelRatio||1;
  c.width=Math.round(r.width*d); c.height=Math.round(r.height*d); const x=c.getContext('2d'); x.scale(d,d); x.lineWidth=2.2; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#16233A';
  const prev=V.sheet.pad[V.sheet.i]; if(prev){ const im=new Image(); im.onload=()=>x.drawImage(im,0,0,r.width,r.height); im.src=prev; }
  let on=false; const pt=e=>{const b=c.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top];};
  c.addEventListener('pointerdown',e=>{ on=true; c.setPointerCapture(e.pointerId); const [a,b]=pt(e); x.beginPath(); x.moveTo(a,b); x.lineTo(a+.1,b+.1); x.stroke(); c.dataset.dirty=1; delete c.dataset.blank; });
  c.addEventListener('pointermove',e=>{ if(!on) return; const [a,b]=pt(e); x.lineTo(a,b); x.stroke(); });
  c.addEventListener('pointerup',()=>{ on=false; }); c.addEventListener('pointercancel',()=>{ on=false; }); }
function closePad(){ const c=$('#pad'), z=V.sheet; if(c&&c.dataset.dirty) z.pad[z.i]=c.dataset.blank?null:c.toDataURL('image/png'); V.modal=null; saveMock(); rSheet(); }

function vConfirm(msg,yes,act,danger){ return `<div class="modal" data-a="modal-close"><div class="box" data-stop="1" role="alertdialog" aria-modal="true"><p style="font-size:17px;margin:4px 0 16px">${msg}</p><div class="btn-row" style="margin:0"><button class="btn line" data-a="modal-close">${L('रुकें','Cancel')}</button><button class="btn saffron" style="${danger?'background:var(--bad);color:#fff':''}" data-a="${act}">${yes}</button></div></div></div>`; }

function applyTheme(){ const r=document.documentElement; if(S.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme); r.lang=S.lang==='en'?'en':'hi'; }
const TABS=[['today','होम','Home'],['learn','विषय','Subjects'],['pyq','परीक्षा','Exams'],['practice','प्रैक्टिस','Practice'],['mistakes','दोहराना','Revision']];
function render(){
  applyTheme();
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===S.lang));
  const app=$('#app');
  const av=$('#avatar'); av.innerHTML=ICON.me; av.classList.toggle('hide',!S.branch||!!V.onb); av.classList.toggle('on',S.tab==='me');
  if(!S.branch||V.onb){ app.innerHTML=V.onb?vOnboard():vWelcome(); $('#dock').classList.add('hide'); }
  else{
    $('#dock').classList.remove('hide');
    const t=S.tab; app.innerHTML=t==='learn'?vLearn():t==='pyq'?vPyq():t==='practice'?vPractice():t==='mistakes'?vMistakes():t==='me'?(V.view&&V.view.gal?vGallery():vMe()):vToday();
    const due=dueMistakes().length;
    $('#dockin').innerHTML=TABS.map(x=>`<button class="${S.tab===x[0]?'on':''}" data-a="tab" data-id="${x[0]}" ${S.tab===x[0]?'aria-current="page"':''}>${ICON[x[0]]}<span>${L(x[1],x[2])}</span>${x[0]==='mistakes'&&due?`<span class="badge">${due}</span>`:''}</button>`).join('');
  }
  rSheet();
}
function rSheet(top){ $('#layer').innerHTML=vSheet()+(V.modal||''); initPad(); document.body.style.overflow=V.sheet?'hidden':''; if(top){ const b=$('#sbody'); if(b) b.scrollTop=0; } }

/* ============ ACTIONS ============ */
async function openSet(title,loader,again,meta){
  V.sheet={mode:'practice',title,list:[],i:0,pick:null,c:0,seen:0,loading:true,again,meta:meta||{}}; rSheet();
  try{ V.sheet.list=await loader(); }catch(err){ V.sheet.list=[]; }
  V.sheet.loading=false; keepLast(); rSheet(true);
}
function keepLast(){ const z=V.sheet; if(!z||z.mode!=='practice'||!z.list.length) return;
  if(z.done||(z.i>=z.list.length-1&&z.pick!=null)){ S.last=null; save(); return; }
  S.last={title:z.title,subj:z.meta.subj||null,ch:z.meta.ch||null,kind:z.meta.kind||null,ids:z.list.map(q=>q.id),i:z.i,c:z.c,seen:z.seen}; save(); }
async function resumeLast(){ const l=S.last; if(!l) return;
  V.sheet={mode:'practice',title:l.title,list:[],i:0,pick:null,c:l.c||0,seen:l.seen||0,loading:true,meta:{subj:l.subj,ch:l.ch,kind:l.kind},again:l.subj?()=>startChapter(l.subj,l.ch,l.kind):null}; rSheet();
  try{ const rows=await fetchIds(l.ids); const by=new Map(rows.map(q=>[q.id,q])); V.sheet.list=l.ids.map(id=>by.get(id)).filter(Boolean); }catch(e){ V.sheet.list=[]; }
  V.sheet.i=Math.min(l.i,Math.max(0,V.sheet.list.length-1)); V.sheet.loading=false; rSheet(true); }
function startChapter(subj,ch,kind){
  const t=ch?R.topics[ch]:null, s=byId(DATA.subjects,subj)||{hi:subj,en:subj};
  const title=(t?N(t):N(s))+(kind==='pyq'?' · PYQ':kind==='practice'?' · '+L('प्रैक्टिस','Practice'):'');
  openSet(title,()=>fetchChapter(subj,ch?+ch:null,kind),()=>startChapter(subj,ch,kind),{subj,ch,kind});
}
function restoreBack(bk){ V.sheet={mode:'practice',title:bk.title,list:bk.list,i:bk.i,pick:bk.pick,c:bk.c,seen:bk.seen,loading:false,meta:bk.meta,again:bk.again}; rSheet(true); }
async function startPattern(pid,n){ const z=V.sheet, ok=z&&z.mode==='practice'&&z.list&&z.list.length&&!(z.meta&&z.meta.pat);
  const cur=ok?z.list[z.i]:null;   /* the question the student is on: never listed inside its own clip */
  const back=ok?{title:z.title,list:z.list,i:z.i,pick:z.pick,c:z.c,seen:z.seen,meta:z.meta,again:z.again}:null;
  await openSet(L('एक जैसे सवाल','Same-type questions'), async()=>{ const rs=await fetchPattern(pid); return cur?rs.filter(x=>x.id!==cur.id):rs; }, null, {pat:pid,back});
  const s=V.sheet; if(!s||!s.meta||s.meta.pat!==pid) return;          /* student already left the clip */
  if(!s.list.length){ if(back) restoreBack(back); else { V.sheet=null; render(); } return; }   /* nothing else: no empty clip */
  s.title=L(`एक जैसे सवाल · ${s.list.length}`,`Same-type questions · ${s.list.length}`); rSheet(true); }
function startExamSubject(subj){ const e=curExam(); if(!e) return; const s=byId(DATA.subjects,subj)||{};
  openSet(`${N(e)} · ${N(s)}`,()=>fetchExamSubject(e.id,subj),()=>startExamSubject(subj)); }
function startPaperPractice(srcId){ const s=R.sources[srcId], e=curExam();
  openSet(`${N(e)}, ${fmtDate(s.paper_date)} ${L('शिफ़्ट','shift')} ${s.shift}`,()=>fetchPaper(srcId),null); }
async function openRevise(subj){
  const ids=(subj?Object.keys(S.mis).filter(id=>S.mis[id].subj===subj).map(Number):dueMistakes()).slice(0,30);
  V.sheet={mode:'revise',title:L('दोहराना','Revision'),list:[],i:0,pick:null,c:0,seen:0,loading:true}; rSheet();
  try{ V.sheet.list=await fetchIds(ids); }catch(err){ V.sheet.list=[]; }
  V.sheet.loading=false; rSheet(true);
}
let TICK=null;
const MKEY='diploma-boy-mock';
function saveMock(){ const z=V.sheet; if(!z||z.mode!=='mock'||z.done||z.loading) return; try{ localStorage.setItem(MKEY,JSON.stringify(z)); }catch(e){ try{ localStorage.setItem(MKEY,JSON.stringify({...z,pad:z.pad.map(()=>null)})); }catch(e2){} } }
function dropMock(){ try{ localStorage.removeItem(MKEY); }catch(e){} }
function pendingMock(){ try{ const o=JSON.parse(localStorage.getItem(MKEY)||'null'); return o&&o.mode==='mock'&&!o.done&&o.list&&o.list.length?o:null; }catch(e){ return null; } }
function tickQ(){ const z=V.sheet; if(!z||z.mode!=='mock'||z.done) return; const now=Date.now(); z.ms[z.i]=(z.ms[z.i]||0)+Math.max(0,now-(z.t0||now)); z.t0=now; }
function goQ(i){ const z=V.sheet; tickQ(); z.i=i; z.vis[i]=true; saveMock(); }
function startTick(){
  clearInterval(TICK);
  TICK=setInterval(()=>{ const y=V.sheet; if(!y||y.mode!=='mock'||y.done){clearInterval(TICK);return;}
    y.left=Math.round((y.end-Date.now())/1000); const el=$('#tmr');
    if(el){ el.textContent=y.hideT?L('समय देखें','Show time'):clock(y.left); el.classList.toggle('low',y.left<300); }
    if(y.left<=300&&!y.a5){ y.a5=true; toast(L('5 मिनट बचे हैं','5 minutes left')); try{navigator.vibrate&&navigator.vibrate(200);}catch(e){} saveMock(); }
    if(y.left<=0){ submitMock(); toast(L('समय ख़त्म, टेस्ट जमा हुआ','Time up, test submitted')); } },1000);
}
async function openMock(srcId){
  const e=curExam(), s=R.sources[srcId], p=e.pattern||{};
  V.modal=null; V.sheet={mode:'mock',title:`${N(e)}, ${fmtDate(s.paper_date)} ${L('शिफ़्ट','shift')} ${s.shift}`,exam:e.id,list:[],i:0,ans:[],mark:[],vis:[],conf:[],ms:[],pad:[],loading:true,src:srcId,left:(p.minutes||90)*60,minutes:p.minutes||90,neg:p.negative_per_wrong||0,mpq:p.marks_per_q||1}; rSheet();
  try{ V.sheet.list=await fetchPaper(srcId); }catch(err){ V.sheet.list=[]; }
  const z=V.sheet; z.loading=false; const n=z.list.length;
  z.ans=Array(n).fill(null); z.mark=Array(n).fill(false); z.vis=z.list.map((_,i)=>i===0); z.conf=Array(n).fill(null); z.ms=Array(n).fill(0); z.pad=Array(n).fill(null);
  z.end=Date.now()+z.left*1000; z.t0=Date.now();
  if(n){ saveMock(); startTick(); }
  rSheet(true);
}
function resumeMock(){
  const o=pendingMock(); if(!o) return;
  V.modal=null; V.sheet=o; o.t0=Date.now(); o.left=Math.round((o.end-Date.now())/1000);
  if(o.left<=0){ submitMock(); toast(L('समय ख़त्म हो चुका था, टेस्ट जमा हुआ','Time was over, test submitted')); return; }
  startTick(); rSheet(true);
}
function submitMock(){
  const z=V.sheet; tickQ(); clearInterval(TICK); let c=0,w=0,u=0; const by={}, cf={sure:{c:0,t:0},half:{c:0,t:0},guess:{c:0,t:0}};
  z.list.forEach((q,i)=>{ const a=z.ans[i], b=by[q.subj]||(by[q.subj]={c:0,w:0,u:0});
    if(a==null){u++;b.u++;return;} const ok=a===q.a; if(ok){c++;b.c++;}else{w++;b.w++;}
    const k=z.conf[i]; if(k&&cf[k]){ cf[k].t++; if(ok) cf[k].c++; }
    bump(q,ok); toMistakes(q,ok); });
  const neg=+(w*z.neg).toFixed(2), score=+(c*z.mpq-neg).toFixed(2);
  const gW=cf.guess.t-cf.guess.c, noGuess=+((c-cf.guess.c)*z.mpq-(w-gW)*z.neg).toFixed(2);
  const used=z.ms.reduce((a,v)=>a+(v||0),0);
  const prev=S.mocks.filter(m=>m.exam===z.exam).slice(-1)[0]||null;
  z.res={c,w,u,neg,score,max:z.list.length*z.mpq,noguess:+(c*z.mpq).toFixed(2),noGuess,cf,by,used,prev:prev?{score:prev.score,max:prev.max}:null};
  S.mocks.push({src:z.src,exam:z.exam,label:z.title,score,max:z.res.max,c,w,u,date:today()}); save(); dropMock();
  z.done=true; V.modal=null; render(); rSheet(true);
}
const answeredMsg=z=>L(`${z.ans.filter(x=>x!=null).length} / ${z.list.length} सवाल हल हुए। टेस्ट जमा करें?`,`${z.ans.filter(x=>x!=null).length} / ${z.list.length} answered. Submit the test?`);
function go(tab,view){ S.tab=tab; V.view=view||null; if(!V.sheet) V.modal=null; save(); render(); window.scrollTo(0,0); }

document.addEventListener('input',ev=>{ if(ev.target.id==='qs'){ const r=$('#qsr'); if(r) r.innerHTML=searchResults(ev.target.value); } });
document.addEventListener('change',ev=>{ if(ev.target.id==='examDate'){ S.examDate=ev.target.value||null; save(); toast(L('तारीख़ सेव हुई','Date saved')); } });
document.addEventListener('click',ev=>{
  const lg=ev.target.closest('[data-lang]'); if(lg){ S.lang=lg.dataset.lang; save(); render(); return; }
  const el=ev.target.closest('[data-a]'); if(!el) return;
  if(el.classList.contains('modal')&&ev.target.closest('[data-stop]')) return;
  const a=el.dataset.a, id=el.dataset.id, z=V.sheet;
  switch(a){
    case 'branch': S.branch=id; S.exam=null; V.view=null; if(V.onb){ S.fams=(V.onbFams||[]).length?V.onbFams.slice():null; V.onb=false; S.tab='today'; S.stageF='all'; } save(); render(); window.scrollTo(0,0); if(S.tab==='me') toast(L('ब्रांच बदल दी','Branch changed')); break;
    case 'onb-go': V.onb=true; V.onbFams=(S.fams||[]).slice(); render(); window.scrollTo(0,0); break;
    case 'onb-fam': { const f=V.onbFams||(V.onbFams=[]); const k=f.indexOf(id); if(k>=0) f.splice(k,1); else f.push(id); render(); break; }
    case 'onb-cancel': V.onb=false; render(); break;
    case 'fam-toggle': { const f=(S.fams||[]).slice(); const k=f.indexOf(id); if(k>=0) f.splice(k,1); else f.push(id); S.fams=f.length?f:null; S.stageF='all'; save(); render(); break; }
    case 'stage-f': S.stageF=id; save(); render(); break;
    case 'search': V.modal=vSearch(); rSheet(); setTimeout(()=>{const i=$('#qs'); if(i) i.focus();},50); break;
    case 'mini': startMini(); break;
    case 'last-resume': resumeLast(); break;
    case 'exam': S.exam=id; V.view=null; save(); render(); break;
    case 'tab': go(id); break;
    case 'open-subj': go('learn',{subj:el.dataset.subj}); break;
    case 'open-ch': go('learn',{subj:(R.topics[el.dataset.ch]||{}).subject,ch:+el.dataset.ch}); break;
    case 'back-learn': go('learn',V.view&&V.view.ch?{subj:V.view.subj}:null); break;
    case 'open-psubj': go('practice',{subj:el.dataset.subj}); break;
    case 'back-practice': go('practice'); break;
    case 'open-paper': go('pyq',{paper:+id}); break;
    case 'back-pyq': go('pyq'); break;
    case 'open-mis': go('mistakes'); break;
    case 'open-gallery': go('me',{gal:1}); break;
    case 'back-me': go('me'); break;
    case 'back-today': go('today'); break;
    case 'start-ch': startChapter(el.dataset.subj, el.dataset.ch||null, el.dataset.kind||null); break;
    case 'start-exsub': startExamSubject(el.dataset.subj); break;
    case 'paper-practice': startPaperPractice(+id); break;
    case 'revise': openRevise(null); break;
    case 'revise-subj': openRevise(el.dataset.subj); break;
    case 'goal': S.goal=+id; save(); render(); break;
    case 'theme': S.theme=id; save(); render(); break;
    case 'reset-ask': V.modal=vConfirm(L('इस फ़ोन की सारी प्रगति, गलती बुक और मॉक मिट जाएँगे। यह वापस नहीं आएगा।','All progress, mistakes and mocks on this phone will be erased. This cannot be undone.'),L('मिटाएँ','Erase'),'reset',true); rSheet(); break;
    case 'reset': S.st={};S.tp={};S.days={};S.mis={};S.mocks=[];S.seen={}; V.modal=null; save(); render(); toast(L('प्रगति मिटा दी','Progress erased')); break;
    case 'modal-close': V.modal=null; rSheet(); break;
    case 'pattern': clearInterval(TICK); startPattern(+el.dataset.id,+el.dataset.n); break;
    case 'close': clearInterval(TICK); { const bk=V.sheet&&V.sheet.meta&&V.sheet.meta.back;
      if(bk){ restoreBack(bk); break; }
      V.sheet=null; V.modal=null; render(); } break;
    case 'pick':
      if(z.mode==='mock'){ z.ans[z.i]=+el.dataset.i; saveMock(); rSheet(); break; }
      if(z.mode==='review'||z.pick!=null) break;
      { z.pick=+el.dataset.i; z.seen++; const q=z.list[z.i], ok=z.pick===q.a; if(ok) z.c++; bump(q,ok); toMistakes(q,ok); save(); if(z.i<z.list.length-1&&z.mode==='practice'){ S.last&&(S.last.c=z.c,S.last.seen=z.seen); save(); } rSheet();
        const f=document.querySelector('.verdict'); if(f) f.scrollIntoView({behavior:'smooth',block:'nearest'}); }
      break;
    case 'skip': case 'next':
      if(z.i<z.list.length-1){ z.i++; z.pick=null; keepLast(); rSheet(true); }
      else if(z.mode==='review'){ V.sheet=null; render(); }
      else { z.done=true; keepLast(); render(); rSheet(true); }
      break;
    case 'again': if(z.again) z.again(); break;
    case 'mock-ask': { const e=curExam(), p=e.pattern||{}; V.modal=vConfirm(L(`यह पूरा पेपर है: ${p.questions||''} सवाल, ${p.minutes||''} मिनट। टाइमर तुरंत शुरू होगा। शुरू करें?`,`This is the full paper: ${p.questions||''} questions, ${p.minutes||''} min. The timer starts right away. Start?`),L('शुरू करें','Start'),'mock-go'); V.pendingSrc=+id; rSheet(); break; }
    case 'mock-go': openMock(V.pendingSrc); break;
    case 'm-next': if(z.i<z.list.length-1){ goQ(z.i+1); rSheet(true);} else { V.modal=vConfirm(answeredMsg(z),L('जमा करें','Submit'),'m-submit'); rSheet(); } break;
    case 'm-prev': if(z.i>0){ goQ(z.i-1); rSheet(true);} break;
    case 'm-mark': z.mark[z.i]=!z.mark[z.i]; saveMock(); rSheet(); break;
    case 'm-clear': z.ans[z.i]=null; z.conf[z.i]=null; saveMock(); rSheet(); break;
    case 'm-conf': z.conf[z.i]=z.conf[z.i]===id?null:id; saveMock(); rSheet(); break;
    case 'sec-go': goQ(+el.dataset.i); rSheet(true); break;
    case 't-hide': z.hideT=!z.hideT; saveMock(); rSheet(); break;
    case 'pad': V.modal=vPad(); rSheet(); break;
    case 'pad-clear': { const c=$('#pad'); if(c){ c.getContext('2d').clearRect(0,0,c.width,c.height); c.dataset.dirty=1; c.dataset.blank=1; } break; }
    case 'pad-close': closePad(); break;
    case 'm-pause': tickQ(); saveMock(); clearInterval(TICK); V.sheet=null; V.modal=null; render(); toast(L('टेस्ट सेव है, बाद में जारी रखें','Test saved, continue later')); break;
    case 'm-resume': resumeMock(); break;
    case 'm-drop-ask': V.modal=vConfirm(L('अधूरा मॉक हटा दें? इसके जवाब मिट जाएँगे।','Discard the unfinished mock? Its answers will be erased.'),L('हटाएँ','Discard'),'m-drop',true); rSheet(); break;
    case 'm-drop': dropMock(); V.modal=null; render(); break;
    case 'palette': V.modal=vPalette(); rSheet(); break;
    case 'm-go': goQ(+el.dataset.i); V.modal=null; rSheet(true); break;
    case 'm-submit-ask': V.modal=vConfirm(answeredMsg(z),L('जमा करें','Submit'),'m-submit'); rSheet(); break;
    case 'm-submit': submitMock(); break;
    case 'mock-exit': V.modal=vConfirm(L('टेस्ट रोकें? जवाब इसी फ़ोन में सेव रहेंगे और आप बाद में जारी रख सकते हैं। असली परीक्षा की तरह घड़ी चलती रहेगी।','Pause the test? Answers stay saved on this phone and you can continue later. Like the real exam, the clock keeps running.'),L('रोकें','Pause'),'m-pause'); rSheet(); break;
    case 'm-review': V.sheet={mode:'review',title:L('जवाब देखें','Review answers'),list:z.list,ansRef:z.ans,i:0,pick:null,c:0,seen:0}; rSheet(true); break;
  }
});
window.addEventListener('beforeunload',e=>{ if(V.sheet&&V.sheet.mode==='mock'&&!V.sheet.done){ e.preventDefault(); e.returnValue=''; } });
(async()=>{ render(); await loadRemote(); render(); })();
if('serviceWorker' in navigator && location.protocol==='https:') window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
</body>
