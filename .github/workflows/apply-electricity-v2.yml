name: Apply Electricity v2 content
# Runs only on the electricity-v2 branch. Writes content/electricity_880/v2.json into draft 72 via draft_replace_with_version (saves the live version first).
on:
  push:
    branches: [electricity-v2]
    paths: ['content/electricity_880/v2.json', '.github/workflows/apply-electricity-v2.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 robots/apply/apply_draft.py --id 72 --file content/electricity_880/v2.json --note "2026-11-07 v2 redesign on owner order; copyright longest run 6-7 words, overlap 8.8%; all numbers recomputed; old v1 kept in chapter_draft_versions"
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
