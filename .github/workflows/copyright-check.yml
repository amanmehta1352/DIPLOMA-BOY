name: Copyright check (review only)
# 3-word overlap between our atoms and NCERT text. Above 20% = flagged for review. Writes an artifact; changes nothing.
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'How many atoms'
        default: '10'
      level:
        description: 'Level id'
        default: 'class_9_10'
permissions:
  contents: read
concurrency: copyright-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Self-test
        run: python robots/copyright/selftest.py
      - name: Check
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          IN_COUNT: ${{ inputs.count }}
          IN_LEVEL: ${{ inputs.level }}
        run: |
          case "$IN_COUNT" in ""|*[!0-9]*) echo "count must be a number"; exit 1;; esac
          case "$IN_LEVEL" in ""|*[!a-z0-9_]*) echo "bad level"; exit 1;; esac
          pip install -q pdfplumber certifi
          # ncert.nic.in sends an incomplete certificate chain. Keep TLS verification ON: fetch the missing intermediate
          # from the address written in the server's own certificate (AIA), and add it to a private trust bundle.
          echo | openssl s_client -connect ncert.nic.in:443 -servername ncert.nic.in 2>/dev/null | openssl x509 > /tmp/leaf.pem || true
          AIA=$(openssl x509 -in /tmp/leaf.pem -noout -text 2>/dev/null | grep -o 'CA Issuers - URI:[^ ]*' | head -1 | sed 's/CA Issuers - URI://')
          echo "issuer certificate: ${AIA:-none}"
          cp "$(python -m certifi)" /tmp/bundle.pem
          if [ -n "$AIA" ]; then
            curl -sS -m 30 "$AIA" -o /tmp/inter.bin
            (openssl x509 -inform DER -in /tmp/inter.bin 2>/dev/null || openssl x509 -in /tmp/inter.bin) >> /tmp/bundle.pem
            openssl verify -CAfile /tmp/bundle.pem -untrusted /tmp/bundle.pem /tmp/leaf.pem || echo "chain still not verified"
          fi
          export SSL_CERT_FILE=/tmp/bundle.pem
          python robots/copyright/ngram.py --count "$IN_COUNT" --level "$IN_LEVEL" --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copyright-report
          path: out/
          if-no-files-found: ignore
