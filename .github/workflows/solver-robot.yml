name: Solver Robot
# Writes step-by-step solved questions (owner's masterclass format) with free Gemini, checks them,
# saves them as DRAFTS (students only see approved ones). Report posted as an issue. Keys are never printed.
on:
  schedule:
    - cron: '11 23 * * *'   # 04:41 IST, daily (after the Writer)
  workflow_dispatch:
    inputs:
      count:
        description: 'How many questions this run'
        default: '5'
      level:
        description: 'Only this level (empty = priority order)'
        default: 'govt_technical'
      chapter:
        description: 'Only this chapter id (0 = all)'
        default: '0'
      redo:
        description: 'Rewrite existing drafts of the chosen chapter (approved ones are kept)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (write nothing to the server)'
        type: boolean
        default: false
      command_id:
        description: 'Control Room command number (filled by the Dispatcher; leave empty)'
        default: ''
permissions:
  contents: read
  issues: write
concurrency: solver-robot
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Self-test
        run: python robots/solver/selftest.py
      - name: Solve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          IN_COUNT: ${{ inputs.count || '10' }}
          IN_CHAPTER: ${{ inputs.chapter || '0' }}
          IN_LEVEL: ${{ github.event_name == 'schedule' && 'govt_technical' || inputs.level }}
          IN_REDO: ${{ inputs.redo }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          # inputs come through env, never pasted into the script (no shell injection)
          case "$IN_COUNT$IN_CHAPTER" in *[!0-9]*) echo "count/chapter must be numbers"; exit 1;; esac
          case "$IN_LEVEL" in ""|[a-z0-9_]*) ;; *) echo "bad level"; exit 1;; esac
          A=(--count "$IN_COUNT" --chapter "$IN_CHAPTER")
          [ -n "$IN_LEVEL" ] && A+=(--level "$IN_LEVEL")
          [ "$IN_REDO" = "true" ] && A+=(--redo)
          [ "$IN_DRY" = "true" ] && A+=(--dry-run)
          python robots/solver/solver.py "${A[@]}"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f solver-report.md ] || echo "Solver robot failed before writing a report." > solver-report.md
          gh issue create -R "$GITHUB_REPOSITORY" -t "Solver robot report $(date -u +%F_%H%M)" -F solver-report.md || true
      - name: Report to Control Room
        if: always() && inputs.command_id != ''
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CMD_ID: ${{ inputs.command_id }}
        run: python robots/dispatcher/report.py --id "$CMD_ID" --file solver-report.md
